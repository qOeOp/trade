# Mypy configuration (quality CI). It lives outside pyproject.toml, a replay image input, so that a change to it
# leaves the replay image's digest alone (docs/plans/replay-image-20261111.zh.md).
[mypy]
python_version = 3.14
files = cli, engine, ledger, live, market, paper, registration, replay, report, runtime, shared,
        ide/research_graph, ide/ide.py,
        .agents/skills/video-evidence/assets/check_bundle.py, .agents/skills/video-evidence/assets/page_record.py,
        .agents/skills/product-doctor/assets/skill_heat.py

# pandas ships no type information and pyarrow 23 has no py.typed marker; both stay Any.
[mypy-pandas,pandas.*,pyarrow,pyarrow.*]
ignore_missing_imports = True
