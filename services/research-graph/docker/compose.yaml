# docker compose -f services/research-graph/docker/compose.yaml up -d, then open http://127.0.0.1:8765/
# Update with `docker compose pull && docker compose up -d`; the copies in the volume are kept.
name: research-graph
services:
  research-graph:
    image: ghcr.io/qoeop/trade-research-graph:main
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - research-graph-data:/data
    restart: unless-stopped
volumes:
  research-graph-data:
