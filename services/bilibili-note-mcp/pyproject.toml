[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "bilibili-note-mcp"
version = "0.1.0"
description = "Standalone Bilibili video to multimodal text research brief MCP"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp>=3.13,<4",
  "httpx[http2]>=0.28,<1",
  "mcp>=2,<3",
  "Pillow>=12,<13",
  "pydantic>=2.13,<3",
  "rfc8785>=0.1,<1",
  "yt-dlp>=2026.7.4,<2027",
]

[project.scripts]
bilibili-note-mcp = "bilibili_note_mcp.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"
resolution = "highest"
prerelease = "disallow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["bilibili_note_mcp"]
