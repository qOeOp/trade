# Its own Cargo workspace, with its own Cargo.lock: the root workspace does not list it, so it is
# built, tested and deployed without the rest of the repository.
[workspace]

[package]
name = "vibe-market-data-mcp"
version = "0.62.0"
edition = "2024"
rust-version = "1.97.1"
readme = "README.md"
description = "The market-data server of the agent's domain MCP catalog: a thin stdio process over Market Data's own HTTP routes"
publish = false

[lib]
name = "market_data_mcp"
path = "src/lib.rs"

[[bin]]
name = "market-data-mcp"
path = "src/main.rs"
doc = false
test = false

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = [
  "http2",
  "json",
  "rustls",
] }
serde_json = { version = "1.0.151", default-features = false, features = [
  "std",
] }
tokio = { version = "1.53.1", default-features = false, features = [
  "rt",
  "macros",
] }

[dev-dependencies]
rstest = "0.26.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
