[project]
name = "trade-research"
version = "0.3.0"
description = "Native Nautilus strategy research and reproducible backtests"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jsonschema>=4,<5",
  "nautilus_trader==2.0.0rc7",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "plotly==7.1.0",
  "pyarrow==23.0.1",
  "pymysql==1.1.2",
]

# Static checks and tests (quality CI); the images install with --no-dev and do not carry them.
[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pathspec==1.1.1",
  "ruff==0.15.1",
  "types-jsonschema==4.26.0.20261006",
  "types-pymysql==1.1.0.20260518",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cli", "deploy", "engine", "ledger", "live", "market", "paper", "registration", "replay", "report",
               "runtime", "shared"]
module-root = ""
