[project]
name = "trade-research"
version = "0.1.0"
description = "Native Nautilus strategy research and reproducible backtests"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jsonschema>=4,<5",
  "nautilus_trader[visualization]==2.0.0rc7",
  "pyarrow==23.0.1",
  "pymysql==1.1.2",
]

# Static checks only (quality CI); the runtime image installs with --no-dev and never carries them.
[dependency-groups]
dev = [
  "mypy==1.19.1",
  "ruff==0.15.1",
  "types-jsonschema==4.26.0.20261006",
  "types-pymysql==1.1.0.20260518",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cli", "engine", "ledger", "market", "paper", "qualification", "registration", "replay", "report",
               "runtime"]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["B"]
ignore = [
  "E731",  # style: a short lambda bound to a local name reads as well as a def here
  "E741",  # style: o, h, l, c are the bar's open, high, low and close
]

[tool.ruff.lint.per-file-ignores]
# Each lambda in a loop is called within the iteration that defines it (assertRaises-style helpers).
"tests/**" = ["B023"]
# Standalone skill scripts keep their imports on one line.
"services/video-evidence/check_bundle.py" = ["E401"]
".agents/skills/video-evidence/assets/page_record.py" = ["E401"]

[tool.mypy]
python_version = "3.14"
files = ["cli", "engine", "ledger", "market", "paper", "qualification", "registration", "replay", "report", "runtime",
         "services/ide/research_graph"]

[[tool.mypy.overrides]]
# pandas ships no type information and pyarrow 23 has no py.typed marker; both stay Any.
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
