[project]
name = "trade-research"
version = "0.1.0"
description = "Native Nautilus strategy research and reproducible backtests"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jsonschema>=4,<5",
  "nautilus_trader[visualization]==2.0.0rc3",
  "pyarrow==23.0.1",
  "pymysql==1.1.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["backtest", "ledger", "qualification", "registration", "replay", "report", "research"]
module-root = ""
