# Git state a hook inherits. `git commit` in a linked worktree exports GIT_DIR and GIT_INDEX_FILE to
# its hooks (no GIT_WORK_TREE; measured 2026-09-24), and with them set git takes the current
# directory as the work tree. So a hook that runs git must not change directory first, and one that
# works on another repository - a fixture, a temporary repository - must clear every GIT_* before it
# does (scripts/ci/test-plan.sh, crates/strategy_factory/tools/seal-program.sh). Never clear them at
# a hook's entry: for `git commit -- <paths>` GIT_INDEX_FILE names a temporary index holding exactly
# what is being committed, and `git diff --cached` in scripts/clippy-changed.sh and
# scripts/doc-changed.sh reads it; cleared, they check the wrong files.
exclude: ^(patches/pyo3-stub-gen/|services/bilibili-note-mcp/deploy/openclaw/openclaw-2026\.7\.1-2-mcp-progress\.patch$)
repos:
  ##############################################################################
  #  General checks
  ##############################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-new-submodules
      - id: end-of-file-fixer
        types_or: [rust, python, markdown]
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
        exclude: ^services/bilibili-note-mcp/
      - id: detect-private-key
      - id: check-added-large-files
        exclude: ^crates/serialization/generated/capnp/
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-sr", "-ln", "bash", "-w"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Follow `source` directives whatever else is in the run. Without this, shellcheck follows a
        # sourced file only when that file is also one of its inputs, so the verdict depended on
        # the file set: `--all-files` (CI) passed while a commit touching only the sourcing script
        # failed SC1091 - four files did, linted alone. A `source=` path that does not exist still
        # fails either way.
        args: ["--external-sources"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: dockerfile-lint
        description: Lint Dockerfiles for best practices and errors
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        description: Checks for common typos
        args: ["--force-exclude"]
        types_or: [rust, python, toml, yaml, rst, markdown]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        description: Checks for common misspellings
        types_or: [rust, python, toml, yaml, rst, markdown]
  - repo: https://github.com/gitleaks/gitleaks
    # Pinned to v8.30.1: autoupdate occasionally selects the lower v8.30.0 tag
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        description: Detects hard-coded secrets prior to commit
        args: ["--staged", "--redact"]
  ##############################################################################
  #  Custom hooks
  ##############################################################################
  - repo: local
    hooks:
      - id: check-hidden-chars
        name: check hidden unicode/control chars
        description: Fail on hidden control or zero-width unicode characters in source
        entry: bash .pre-commit-hooks/check_hidden_chars.sh
        language: system
        types_or: [rust, python, toml, markdown, yaml, json, text]
        files: "\\.(rs|py|toml|md|yml|yaml|json|sh|bash|dockerfile)$|Dockerfile.*"
      - id: check-unicode-typography
        name: check Unicode typography
        description: Reject typographic dashes, curly quotes, and emoji-style check/cross marks
        entry: bash .pre-commit-hooks/check_unicode_typography.sh
        language: system
        types: [text]
        # Bilibili Note owns Chinese-language typography in its dedicated gate.
        exclude: ^services/bilibili-note-mcp/
      - id: test-unicode-typography
        name: test Unicode typography hook
        description: Verifies rejected characters, allowed characters, and exceptions
        entry: bash .pre-commit-hooks/test_check_unicode_typography.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|\.pre-commit-hooks/(check|test_check)_unicode_typography\.sh)$
        pass_filenames: false
      - id: check-non-latin-text
        name: check non-Latin text
        description: Detect non-Latin characters (CJK, Cyrillic, Arabic, etc.) to enforce English-only
        entry: bash .pre-commit-hooks/check_non_latin_text.sh
        language: system
        types: [text]
        files: "\\.(rs|py|md|toml|yaml|yml)$"
        # Bilibili Note is a Chinese-language research product by contract.
        exclude: ^(docs/.*\.zh\.md|services/bilibili-note-mcp/)
      - id: test-hook-failure-is-reported
        name: test hook failure reporting
        description: Drives every hook with a failing command and requires it to name the line
        entry: bash .pre-commit-hooks/test_hook_failure_is_reported.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|\.pre-commit-hooks/.*\.sh)$
        pass_filenames: false
      - id: test-non-latin-text
        name: test non-Latin text hook
        description: Verifies each blocked script is rejected identically in every locale
        entry: bash .pre-commit-hooks/test_check_non_latin_text.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|\.pre-commit-hooks/(check|test_check)_non_latin_text\.sh)$
        pass_filenames: false
      - id: check-toml-codegen
        name: check toml-codegen
        description: Ensures TOML files don't contain the 'codegen-backend' keyword
        entry: bash .pre-commit-hooks/check_toml_codegen.sh
        language: system
        files: \.toml$
      - id: check-no-build-packages
        name: check no-build-packages
        description: Ensures `[tool.uv].no-build-package` matches `uv.lock`
        entry: bash scripts/check-no-build-packages.sh
        language: system
        files: ^python/(uv\.lock|pyproject\.toml)$
        pass_filenames: false
      - id: check-docker-toolchain-pins
        name: check Docker toolchain pins
        description: Ensures Docker uv, Rust, and Python pins match project toolchain versions
        entry: bash scripts/ci/check-docker-toolchain-pins.bash
        language: system
        files: >-
          (?x)^(

            \.docker/(DockerfileUbuntu|vibe_trader\.dockerfile)|
            python/pyproject\.toml|
            rust-toolchain\.toml|
            scripts/(uv-version|rust-toolchain)\.sh|
            scripts/ci/check-docker-toolchain-pins\.bash
          )$
        pass_filenames: false
      - id: rd-workbench-check
        name: check R&D deployment package
        description: >-
          Runs the deployment package check CI runs, which pins text in postgres-init and reads Owner
          sources, so a change it refuses is refused at commit rather than forty minutes later
        entry: bash product/rd-workbench/scripts/check.sh
        language: system
        files: ^(product/rd-workbench/|crates/|scripts/ci/test-rd-owner-postgres\.bash$)
        pass_filenames: false
      - id: check-feature-gate-coverage
        name: check feature gate coverage
        description: Names Cargo features that gate code no job compiles, and fails on a new one
        entry: python3 scripts/ci/check-feature-gate-coverage.py
        language: system
        files: ^(crates/|product/|scripts/ci/check-feature-gate-coverage\.py$|Makefile$|\.github/workflows/)
        pass_filenames: false
      - id: test-feature-gate-coverage
        name: test feature gate coverage resolution
        description: Proves the guard asks Cargo what CI compiles instead of reading the strings
        entry: python3 scripts/ci/test_check_feature_gate_coverage.py
        language: system
        files: >-
          (?x)^(

            \.pre-commit-config\.yaml|
            Makefile|
            scripts/ci/(check-feature-gate-coverage|test_check_feature_gate_coverage)\.py|
            \.github/workflows/.*\.yml
          )$
        pass_filenames: false
      - id: check-source-canary
        name: check source canary
        description: Ensures reachability probes separate a refused runner address from a dead source
        entry: python3 scripts/ci/test_source_canary.py
        language: system
        files: ^scripts/ci/(source_canary|test_source_canary)\.py$
        pass_filenames: false
      - id: check-rust-toolchain
        name: check Rust toolchain
        description: Ensures the Rust toolchain parser requires an exact pinned channel
        entry: bash scripts/ci/test-rust-toolchain.bash
        language: system
        files: ^(rust-toolchain\.toml|scripts/rust-toolchain\.sh|scripts/ci/test-rust-toolchain\.bash)$
        pass_filenames: false
      - id: test-chain-entry-watchdog
        name: test ordered-chain entry watchdog
        description: A chain entry past its wall clock is stopped by name and leaves a record
        entry: bash scripts/ci/test-chain-entry-watchdog.bash
        language: system
        files: ^scripts/ci/(chain-entry-watchdog|test-chain-entry-watchdog)\.bash$
        pass_filenames: false
      - id: test-cargo-target-in-worktree
        name: test local chain target-directory check
        description: A cargo target directory outside the worktree, including a prefix-sharing sibling, is refused
        entry: bash scripts/ci/test-cargo-target-in-worktree.bash
        language: system
        files: ^scripts/ci/(cargo-target-in-worktree|test-cargo-target-in-worktree)\.bash$
        pass_filenames: false
      - id: test-owner-chain-lock
        name: test Owner chain machine lock
        description: A second local Owner chain is refused and named; a dead holder releases the lock
        entry: bash scripts/ci/test-owner-chain-lock.bash
        language: system
        files: ^scripts/ci/(owner-chain-lock|test-owner-chain-lock)\.bash$
        pass_filenames: false
      - id: check-miri-toolchain
        name: check Miri toolchain
        description: Ensures the pinned Miri compiler supports the workspace Rust version
        entry: bash scripts/ci/test-check-miri-toolchain.bash
        language: system
        files: >-
          (?x)^(

            Cargo\.toml|
            Makefile|
            tools\.toml|
            scripts/tool-version\.sh|
            scripts/ci/(check-miri-toolchain|test-check-miri-toolchain)\.bash
          )$
        pass_filenames: false
      - id: test-frozen-source-convention-baseline
        name: test frozen source convention baseline
        description: Verifies the capsule-bound lowerer convention exclusion fails closed
        entry: bash .pre-commit-hooks/test_check_frozen_source_convention_baseline.sh
        language: system
        files: >-
          (?x)^(

            \.pre-commit-config\.yaml|
            \.pre-commit-hooks/(check_error_conventions|check_testing_conventions|check_formatting_rs|check_frozen_source_convention_baseline|test_check_frozen_source_convention_baseline)\.sh|
            crates/strategy_factory/src/bounded_feature_program_lowerer_v1\.rs
          )$
        pass_filenames: false
      - id: check-error-conventions
        name: check error conventions
        description: Enforces error variable naming conventions
        entry: bash .pre-commit-hooks/check_error_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false
      - id: check-no-legacy-paths
        name: check no legacy paths
        description: Fails on removed Python namespace paths and unexpected FFI surfaces
        entry: bash .pre-commit-hooks/check_no_legacy_paths.sh
        language: system
        files: ^(crates|docs|examples|python)/|[.]md$|^(Cargo[.]toml|Makefile)$
        pass_filenames: false
      - id: check-links-offline
        name: check links (offline)
        description: Verifies all tracked internal markdown links resolve on disk via lychee
        entry: bash .pre-commit-hooks/check_links_offline.sh
        language: system
        always_run: true
        pass_filenames: false
  ##############################################################################
  #  Rust formatting and linting
  ##############################################################################
  - repo: local
    hooks:
      - id: check-anyhow-usage
        name: check anyhow usage
        description: Enforces anyhow conventions
        entry: bash .pre-commit-hooks/check_anyhow_usage.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: check-logging-conventions
        name: check logging conventions
        description: Enforces logging and process termination conventions
        entry: bash .pre-commit-hooks/check_logging_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: test-logging-conventions
        name: test logging conventions hook
        description: Verifies direct output and process termination rules
        entry: bash .pre-commit-hooks/test_check_logging_conventions.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|\.pre-commit-hooks/(check|test_check)_logging_conventions\.sh)$
        pass_filenames: false
      - id: check-tokio-usage
        name: check tokio usage
        description: Enforces tokio usage conventions
        entry: bash .pre-commit-hooks/check_tokio_usage.sh
        language: system
        files: "\\.rs$|Cargo\\.toml$"
        pass_filenames: false
      - id: check-dst-conventions
        name: check DST conventions
        description: Enforces deterministic simulation testing path bans
        entry: bash .pre-commit-hooks/check_dst_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: check-pyo3-conventions
        name: check pyo3 conventions
        description: Enforces PyO3 naming conventions
        entry: bash .pre-commit-hooks/check_pyo3_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: check-testing-conventions
        name: check testing conventions
        description: Enforces testing standardizations and conventions
        entry: bash .pre-commit-hooks/check_testing_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false
      - id: check-owner-custody-proof-selection
        name: check Owner custody proof selection
        description: Every Owner custody proof is chain-selected or carries its reason
        entry: bash scripts/ci/check-owner-custody-proof-selection.bash .
        language: system
        files: "(\\.(rs|bash|sh|ya?ml|toml)$|^Makefile$)"
        pass_filenames: false
      - id: check-vibe-conventions
        name: check vibe conventions
        description: Enforces Vibe type usage conventions
        entry: bash .pre-commit-hooks/check_vibe_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: check-formatting-rs
        name: check formatting (Rust)
        description: Enforces formatting conventions in Rust code
        entry: bash .pre-commit-hooks/check_formatting_rs.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false
      - id: test-formatting-rs
        name: test Rust formatting hook
        description: Verifies blank-line and module-ordering rules
        entry: bash .pre-commit-hooks/test_check_formatting_rs.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|\.pre-commit-hooks/(check|test_check)_formatting_rs\.sh)$
        pass_filenames: false
      - id: check-formatting-py
        name: check formatting (Python)
        description: Enforces formatting conventions in Python code
        entry: bash .pre-commit-hooks/check_formatting_py.sh
        language: system
        files: "\\.py$"
        pass_filenames: false
      - id: check-docs-conventions
        name: check docs conventions
        description: Enforces documentation conventions
        entry: bash .pre-commit-hooks/check_docs_conventions.sh
        language: system
        files: "\\.(rs|md)$"
        pass_filenames: false
      - id: check-cargo-conventions
        name: check cargo conventions
        description: Enforces Cargo.toml dependency ordering conventions
        entry: bash .pre-commit-hooks/check_cargo_conventions.sh
        language: system
        files: "Cargo\\.toml$"
        pass_filenames: false
      - id: check-jiff-features
        name: check Jiff features
        description: Locks resolved Jiff feature policy across Rust and Python builds
        entry: bash .pre-commit-hooks/check_jiff_features.sh
        language: system
        files: "(^|/)(Cargo\\.(toml|lock))$"
        pass_filenames: false
      - id: check-workspace-test-coverage
        name: check workspace test coverage
        description: Reconciles workspace members with Rust test selection
        entry: bash scripts/ci/check-workspace-test-coverage.sh
        language: system
        files: >-
          (?x)^(

            (?:.*/)?Cargo\.toml|
            .*\.rs|
            Makefile|
            scripts/ci/check-workspace-test-coverage\.sh
          )$
        pass_filenames: false
      - id: fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: bash .pre-commit-hooks/cargo_fmt_stable.sh
        language: system
        args: ["--all", "--", "--check"]
        files: "\\.(rs|toml)$"
        exclude: ^services/bilibili-note-mcp/
        types: [file]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Run the Clippy linter on changed crates
        entry: bash scripts/clippy-changed.sh
        language: system
        files: "\\.(rs|toml)$"
        exclude: ^services/bilibili-note-mcp/
        types: [file]
        pass_filenames: false
      - id: cargo-clippy-network-turmoil-non-linux
        name: cargo clippy network turmoil (non-Linux)
        description: Run the network Turmoil Clippy check on non-Linux hosts
        entry: bash .pre-commit-hooks/cargo_clippy_network_turmoil_non_linux.sh
        language: system
        files: "^(crates/network/|Cargo\\.toml$|clippy\\.toml$|rust-toolchain\\.toml$|\\.cargo/)"
        types: [file]
        pass_filenames: false
      - id: cargo-doc
        name: cargo doc
        description: Check documentation builds on changed crates
        entry: bash scripts/doc-changed.sh
        language: system
        files: "\\.(rs|toml)$"
        exclude: ^services/bilibili-note-mcp/
        types: [file]
        pass_filenames: false
      - id: cargo-machete
        name: cargo machete
        description: Detect declared-but-unused workspace dependencies
        entry: bash .pre-commit-hooks/cargo_machete.sh
        language: system
        files: "(Cargo\\.toml|\\.rs)$|^\\.pre-commit-hooks/cargo_machete\\.sh$"
        pass_filenames: false
  ##############################################################################
  #  Python formatting and linting
  ##############################################################################
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]
        exclude: ^services/bilibili-note-mcp/
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
        name: add-trailing-comma
        types: [python]
        exclude: ^services/bilibili-note-mcp/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: ruff
        args: ["--fix", "--config", "python/pyproject.toml"]
        exclude: ^services/bilibili-note-mcp/
      - id: ruff-format
        name: ruff-format
        args: ["--config", "python/pyproject.toml"]
        exclude: ^services/bilibili-note-mcp/
  - repo: https://github.com/PyCQA/docformatter
    # Pinned to 1.7.7 because v1.7.8 conflicts with this repo's Ruff docstring rules
    rev: v1.7.7
    hooks:
      - id: docformatter
        language_version: python3.13 # Pin to 3.13 due to incompatibility with 3.14
        additional_dependencies: [tomli]
        exclude: ^services/bilibili-note-mcp/
        args:
          - "--wrap-summaries"
          - "88"
          - "--wrap-descriptions"
          - "88"
          - "--make-summary-multi-line"
          - "--pre-summary-newline"
          - "--blank"
          - "--recursive"
          - "--in-place"
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1 # Must match [tool.uv] required-version in python/pyproject.toml
    hooks:
      - id: uv-lock
        args: ["--project", "python"]
        files: ^python/(uv\.lock|pyproject\.toml)$
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  ##############################################################################
  #  Markdown formatting and linting
  ##############################################################################
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        entry: markdownlint-cli2
        args:
          - --config
          - .markdownlint.jsonc
          - --fix
        files: "\\.md$"
  - repo: local
    hooks:
      - id: test-production-producer-check
        name: test production-producer-check calibration
        description: Proves the producer and caller searches still answer both ways, not just one
        entry: python3 -B scripts/production-producer-check_test.py
        language: system
        files: ^(\.pre-commit-config\.yaml|scripts/production-producer-check(_test|_mutations)?\.py)$
        pass_filenames: false
      - id: test-production-producer-check-mutations
        name: test production-producer-check mutations
        description: Reintroduces each defect the calibration claims to catch and watches it be caught
        entry: python3 -B scripts/production-producer-check_mutations.py
        language: system
        files: ^(\.pre-commit-config\.yaml|scripts/production-producer-check(_test|_mutations)?\.py)$
        pass_filenames: false
      - id: test-flattened-error-variants
        name: test flattened-error-variants calibration
        description: Proves the error-flow walk still classifies each kind of edge both ways
        entry: python3 -B scripts/flattened-error-variants_test.py
        language: system
        files: >-
          (?x)^(

            \.pre-commit-config\.yaml|
            scripts/production-producer-check\.py|
            scripts/flattened-error-variants(_test|_mutations)?\.py

          )$
        pass_filenames: false
      - id: test-flattened-error-variants-mutations
        name: test flattened-error-variants mutations
        description: Reintroduces each defect the calibration claims to catch and watches it be caught
        entry: python3 -B scripts/flattened-error-variants_mutations.py
        language: system
        files: >-
          (?x)^(

            \.pre-commit-config\.yaml|
            scripts/production-producer-check\.py|
            scripts/flattened-error-variants(_test|_mutations)?\.py

          )$
        pass_filenames: false
      - id: check-markdown-tables
        name: normalize markdown table padding
        description: Pads GFM table columns to their widest cell, which MD060 does not check
        entry: python3 -B scripts/check-markdown-tables.py
        language: system
        types: [markdown]
      - id: mermaid-lint
        name: mermaid lint
        description: Validates Mermaid diagrams embedded in Markdown files
        entry: mermaid-lint
        language: node
        additional_dependencies: ["@mermaid-lint/cli@0.35.0"]
        args: [--fix, --no-semantic, --quiet]
        types: [markdown]
