[package]
name = "l2-recorder-bakeoff"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "l2-bakeoff-rust"
path = "src/rust/main.rs"

[[bin]]
name = "l2-segment-rust"
path = "src/rust/segment.rs"

[[bin]]
name = "l2-soak-rust"
path = "src/rust/soak.rs"

[dependencies]
crc32fast = "1"
crossbeam-channel = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
