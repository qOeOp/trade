[agents]
max_threads = 3

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bun "$(git rev-parse --show-toplevel)/scripts/codex-mission-stop-hook.ts"'
timeout = 5
statusMessage = "Checking bounded mission Handoff"

[mcp_servers.trade-agent]
command = "bun"
args = ["modules/orchestration-ops/agent-mcp/src/scripts/main.ts"]
cwd = ".."
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 20
default_tools_approval_mode = "writes"
enabled_tools = [
  "trade_tool_search",
  "trade_tool_read",
  "artifact_catalog_query",
  "artifact_read",
  "rd_program_read",
  "ops_cycle_summary",
]

[mcp_servers.sentrux]
command = "sentrux"
args = ["--mcp"]
cwd = ".."
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 180
default_tools_approval_mode = "auto"
