services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=trade_rd
      - RD_OWNER_DB_PASSWORD
      - RD_FACT_WRITER_DB_PASSWORD=${RD_FACT_WRITER_DB_PASSWORD:?set RD_FACT_WRITER_DB_PASSWORD}
      - MARKET_DATA_OWNER_DB_PASSWORD=${MARKET_DATA_OWNER_DB_PASSWORD:?set MARKET_DATA_OWNER_DB_PASSWORD}
      - MARKET_DATA_READER_DB_PASSWORD=${MARKET_DATA_READER_DB_PASSWORD:?set MARKET_DATA_READER_DB_PASSWORD}
      # yamllint disable rule:line-length
      - REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD=${REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD:?set REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD}
      # yamllint enable rule:line-length
      - OPERATOR_AUTHORIZATION_DB_PASSWORD
      - QUALIFICATION_OWNER_DB_PASSWORD
      - PRODUCT_EDGE_DB_PASSWORD
      - BACKTEST_OWNER_DB_PASSWORD
      - EXECUTION_WRITER_DB_PASSWORD
      - PORTFOLIO_WRITER_DB_PASSWORD
      - GOVERNANCE_WRITER_DB_PASSWORD
      - INSTRUMENT_OWNER_DB_PASSWORD
      - RISK_WRITER_DB_PASSWORD
      - SCANNER_WRITER_DB_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/00-create-rd-owner.sh:/docker-entrypoint-initdb.d/00-create-rd-owner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_rd"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rd-owner-api:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: unless-stopped
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
      RD_FACT_WRITER_DATABASE_URL: >-
        ${RD_FACT_WRITER_DATABASE_URL:?set RD_FACT_WRITER_DATABASE_URL}
      MARKET_DATA_OWNER_DATABASE_URL: >-
        ${MARKET_DATA_OWNER_DATABASE_URL:?set MARKET_DATA_OWNER_DATABASE_URL}
      MARKET_DATA_RD_ROLE_SET_DATABASE_URL: >-
        ${MARKET_DATA_RD_ROLE_SET_DATABASE_URL:?set MARKET_DATA_RD_ROLE_SET_DATABASE_URL}
      MARKET_DATA_OBSERVATION_SOURCE: ${MARKET_DATA_OBSERVATION_SOURCE:-}
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
      DATABENTO_PUBLISHERS_PATH: ${DATABENTO_PUBLISHERS_PATH:-}
      DATABENTO_MAX_PROBE_COST_USD: ${DATABENTO_MAX_PROBE_COST_USD:-0}
      BINANCE_PIT_MEMBERS: ${BINANCE_PIT_MEMBERS:-}
      BINANCE_PIT_INTERVAL: ${BINANCE_PIT_INTERVAL:-1m}
      DEPLOYMENT_STORE_ADMISSION_MODE: ${DEPLOYMENT_STORE_ADMISSION_MODE-disabled}
      DEPLOYMENT_STORE_ENVIRONMENT_IDENTITY: ${DEPLOYMENT_STORE_ENVIRONMENT_IDENTITY:-}
      DEPLOYMENT_STORE_DEPLOYMENT_IDENTITY: ${DEPLOYMENT_STORE_DEPLOYMENT_IDENTITY:-}
      DEPLOYMENT_STORE_EXPECTED_HEAD_IDENTITY: ${DEPLOYMENT_STORE_EXPECTED_HEAD_IDENTITY:-}
      QUALIFICATION_OWNER_DATABASE_URL: >-
        ${QUALIFICATION_OWNER_DATABASE_URL:?set QUALIFICATION_OWNER_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      PRODUCT_EDGE_DEPLOYMENT_IDENTITY: ${PRODUCT_EDGE_DEPLOYMENT_IDENTITY:?set PRODUCT_EDGE_DEPLOYMENT_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      RD_OWNER_ENABLE_ACCEPTANCE_FAULTS: ${RD_OWNER_ENABLE_ACCEPTANCE_FAULTS:-0}
      RD_SANDBOX_SOCKET: /run/trade-rd-sandbox/build.sock
      RUST_LOG: info
    depends_on:
      replay-policy-catalog-owner-readback:
        condition: service_completed_successfully
    expose:
      - 8080
    volumes:
      - sandbox-socket:/run/trade-rd-sandbox:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rd-dashboard-owner-read-api:
    profiles: ["dashboard-preview"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    entrypoint: ["/usr/local/bin/strategy-factory-rd-dashboard-read-api"]
    restart: unless-stopped
    environment:
      RD_DASHBOARD_OWNER_READ_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
      RD_DASHBOARD_OWNER_READ_API_TOKEN: >-
        ${RD_DASHBOARD_OWNER_READ_API_TOKEN:?set RD_DASHBOARD_OWNER_READ_API_TOKEN}
      RD_DASHBOARD_SOURCE_INTAKE_PRODUCT_EDGE_DATABASE_URL: >-
        ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      RD_DASHBOARD_SOURCE_INTAKE_REQUEST_PROOF: >-
        ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      RUST_LOG: info
    expose:
      - 8082
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  schema-materialize:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    command: ["--materialize-schema"]
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  authority-custody-migrate:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RD_OWNER_DB_PASSWORD: ${RD_OWNER_DB_PASSWORD:?set RD_OWNER_DB_PASSWORD}
      RD_FACT_WRITER_DB_PASSWORD: >-
        ${RD_FACT_WRITER_DB_PASSWORD:?set RD_FACT_WRITER_DB_PASSWORD}
      MARKET_DATA_OWNER_DB_PASSWORD: >-
        ${MARKET_DATA_OWNER_DB_PASSWORD:?set MARKET_DATA_OWNER_DB_PASSWORD}
      MARKET_DATA_READER_DB_PASSWORD: >-
        ${MARKET_DATA_READER_DB_PASSWORD:?set MARKET_DATA_READER_DB_PASSWORD}
      REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD: >-
        ${REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD:?set REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD}
      OPERATOR_AUTHORIZATION_DB_PASSWORD: >-
        ${OPERATOR_AUTHORIZATION_DB_PASSWORD:?set OPERATOR_AUTHORIZATION_DB_PASSWORD}
      QUALIFICATION_OWNER_DB_PASSWORD: >-
        ${QUALIFICATION_OWNER_DB_PASSWORD:?set QUALIFICATION_OWNER_DB_PASSWORD}
      PRODUCT_EDGE_DB_PASSWORD: ${PRODUCT_EDGE_DB_PASSWORD:?set PRODUCT_EDGE_DB_PASSWORD}
      BACKTEST_OWNER_DB_PASSWORD: ${BACKTEST_OWNER_DB_PASSWORD:?set BACKTEST_OWNER_DB_PASSWORD}
      EXECUTION_WRITER_DB_PASSWORD: ${EXECUTION_WRITER_DB_PASSWORD:?set EXECUTION_WRITER_DB_PASSWORD}
      PORTFOLIO_WRITER_DB_PASSWORD: ${PORTFOLIO_WRITER_DB_PASSWORD:?set PORTFOLIO_WRITER_DB_PASSWORD}
      GOVERNANCE_WRITER_DB_PASSWORD: ${GOVERNANCE_WRITER_DB_PASSWORD:?set GOVERNANCE_WRITER_DB_PASSWORD}
      INSTRUMENT_OWNER_DB_PASSWORD: ${INSTRUMENT_OWNER_DB_PASSWORD:?set INSTRUMENT_OWNER_DB_PASSWORD}
      RISK_WRITER_DB_PASSWORD: ${RISK_WRITER_DB_PASSWORD:?set RISK_WRITER_DB_PASSWORD}
      SCANNER_WRITER_DB_PASSWORD: ${SCANNER_WRITER_DB_PASSWORD:?set SCANNER_WRITER_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/opt/trade/10-migrate-authority-custody.sh"]
    volumes:
      - ./postgres-init/10-migrate-authority-custody.sh:/opt/trade/10-migrate-authority-custody.sh:ro
    depends_on:
      schema-materialize:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  authority-schema-materialize:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    entrypoint: ["/usr/local/bin/product-edge-authority-bootstrap", "materialize-schema"]
    environment:
      OPERATOR_AUTHORIZATION_DATABASE_URL: >-
        ${OPERATOR_AUTHORIZATION_DATABASE_URL:?set OPERATOR_AUTHORIZATION_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: >-
        ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
    # After the authority custody migration, not before: these migrations assume
    # `operator_authorization_private` and the Product Edge relations' schema
    # already exist, and that step is what creates them.
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  replay-policy-catalog-bootstrap:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    entrypoint: ["/usr/local/bin/replay-policy-catalog-authority-bootstrap"]
    environment:
      REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL: >-
        ${REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL:?set REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL}
      REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND_PATH: >-
        /run/secrets/replay-policy-catalog-bootstrap-create-command.json
      REPLAY_POLICY_CATALOG_BOOTSTRAP_ADVANCE_COMMAND_PATH: >-
        /run/secrets/replay-policy-catalog-bootstrap-advance-command.json
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY: >-
        ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY}
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY_PATH: >-
        /run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex
    volumes:
      # yamllint disable rule:line-length
      - ${REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND:?set REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND}:/run/secrets/replay-policy-catalog-bootstrap-create-command.json:ro
      - ${REPLAY_POLICY_CATALOG_BOOTSTRAP_ADVANCE_COMMAND:?set REPLAY_POLICY_CATALOG_BOOTSTRAP_ADVANCE_COMMAND}:/run/secrets/replay-policy-catalog-bootstrap-advance-command.json:ro
      - ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY}:/run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex:ro
      # yamllint enable rule:line-length
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  replay-policy-catalog-owner-readback:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    entrypoint: ["/usr/local/bin/replay-policy-catalog-owner-readback"]
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
      REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND_PATH: >-
        /run/secrets/replay-policy-catalog-bootstrap-create-command.json
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY: >-
        ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY}
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY_PATH: >-
        /run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex
    volumes:
      # yamllint disable rule:line-length
      - ${REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND:?set REPLAY_POLICY_CATALOG_BOOTSTRAP_CREATE_COMMAND}:/run/secrets/replay-policy-catalog-bootstrap-create-command.json:ro
      - ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY}:/run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex:ro
      # yamllint enable rule:line-length
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  authority-bootstrap:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    entrypoint: ["/usr/local/bin/product-edge-authority-bootstrap"]
    environment:
      OPERATOR_AUTHORIZATION_DATABASE_URL: >-
        ${OPERATOR_AUTHORIZATION_DATABASE_URL:?set OPERATOR_AUTHORIZATION_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      PRODUCT_EDGE_BOOTSTRAP_CONFIG: ${PRODUCT_EDGE_BOOTSTRAP_CONFIG:?set PRODUCT_EDGE_BOOTSTRAP_CONFIG}
    command: ["/run/secrets/product-edge-bootstrap.json"]
    volumes:
      - ${PRODUCT_EDGE_BOOTSTRAP_CONFIG:?set PRODUCT_EDGE_BOOTSTRAP_CONFIG}:/run/secrets/product-edge-bootstrap.json:ro
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  authority-recovery:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    entrypoint: ["/usr/local/bin/product-edge-recover-expired-manifests"]
    environment:
      OPERATOR_AUTHORIZATION_DATABASE_URL: >-
        ${OPERATOR_AUTHORIZATION_DATABASE_URL:?set OPERATOR_AUTHORIZATION_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      PRODUCT_EDGE_DEPLOYMENT_IDENTITY: >-
        ${PRODUCT_EDGE_DEPLOYMENT_IDENTITY:?set PRODUCT_EDGE_DEPLOYMENT_IDENTITY}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      PRODUCT_EDGE_RECOVERY_CONFIG: ${PRODUCT_EDGE_RECOVERY_CONFIG:?set PRODUCT_EDGE_RECOVERY_CONFIG}
    command: ["/run/secrets/product-edge-recovery.json"]
    volumes:
      - ${PRODUCT_EDGE_RECOVERY_CONFIG:?set PRODUCT_EDGE_RECOVERY_CONFIG}:/run/secrets/product-edge-recovery.json:ro
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  rd-build-sandbox:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.sandbox
    restart: unless-stopped
    network_mode: none
    environment:
      PATH: /usr/local/cargo/bin:/usr/local/rustup/toolchains/1.97.1-aarch64-unknown-linux-gnu/bin:/usr/bin:/bin
      RD_SANDBOX_SOCKET: /run/trade-rd-sandbox/build.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - sandbox-socket:/run/trade-rd-sandbox
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/trade-rd-sandbox/build.sock"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard-run-store-migrate:
    profiles: ["dashboard-preview"]
    image: trade-dashboard:${DASHBOARD_IMAGE_TAG:-preview}
    pull_policy: never
    restart: "no"
    command: ["npm", "run", "run-store:migrate"]
    environment:
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
    security_opt:
      - no-new-privileges:true

  dashboard-web:
    profiles: ["dashboard-preview"]
    image: trade-dashboard:${DASHBOARD_IMAGE_TAG:-preview}
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      dashboard-run-store-migrate:
        condition: service_completed_successfully
      rd-dashboard-owner-read-api:
        condition: service_healthy
    environment:
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
      DASHBOARD_CURSOR_HMAC_KEY: ${DASHBOARD_CURSOR_HMAC_KEY:-}
      DASHBOARD_OPERATOR_API_TOKEN: ${DASHBOARD_OPERATOR_API_TOKEN:-}
      DASHBOARD_LOCAL_OPERATOR_LOGIN_TOKEN: ${DASHBOARD_LOCAL_OPERATOR_LOGIN_TOKEN:-}
      DASHBOARD_SESSION_HMAC_KEY: ${DASHBOARD_SESSION_HMAC_KEY:-}
      DASHBOARD_MCP_API_TOKEN: ${DASHBOARD_MCP_API_TOKEN:-}
      DASHBOARD_MCP_PRINCIPAL_REF: ${DASHBOARD_MCP_PRINCIPAL_REF:-}
      DASHBOARD_MCP_TOKEN_EXPIRES_AT_EPOCH_SECONDS: >-
        ${DASHBOARD_MCP_TOKEN_EXPIRES_AT_EPOCH_SECONDS:-}
      DASHBOARD_MCP_ALLOWED_HOSTNAMES: ${DASHBOARD_MCP_ALLOWED_HOSTNAMES:-localhost,127.0.0.1,[::1]}
      DASHBOARD_MCP_ALLOWED_ORIGIN_HOSTNAMES: >-
        ${DASHBOARD_MCP_ALLOWED_ORIGIN_HOSTNAMES:-localhost,127.0.0.1,[::1]}
      DASHBOARD_SERVER_INSTANCE_IDENTITY: ${DASHBOARD_SERVER_INSTANCE_IDENTITY:-dashboard-web}
      DASHBOARD_DEPLOYMENT_CLASS: ${DASHBOARD_DEPLOYMENT_CLASS:-}
      DASHBOARD_DISPOSABLE_ARTIFACT_EXECUTION: ${DASHBOARD_DISPOSABLE_ARTIFACT_EXECUTION:-}
      DASHBOARD_DISPOSABLE_DEVELOP_COMPOSER_EXECUTION: >-
        ${DASHBOARD_DISPOSABLE_DEVELOP_COMPOSER_EXECUTION:-}
      DASHBOARD_DISPOSABLE_EXPLORATORY_REPLAY_EXECUTION: >-
        ${DASHBOARD_DISPOSABLE_EXPLORATORY_REPLAY_EXECUTION:-}
      DASHBOARD_DISPOSABLE_SOURCE_RESEARCH_EXECUTION: >-
        ${DASHBOARD_DISPOSABLE_SOURCE_RESEARCH_EXECUTION:-}
      PRODUCT_EDGE_ROUTING_READ_API_URL: ${PRODUCT_EDGE_ROUTING_READ_API_URL:-}
      PRODUCT_EDGE_ROUTING_READ_API_TOKEN: ${PRODUCT_EDGE_ROUTING_READ_API_TOKEN:-}
      PRODUCT_EDGE_DEPLOYMENT_IDENTITY: ${PRODUCT_EDGE_DEPLOYMENT_IDENTITY:-}
      DASHBOARD_COMPATIBILITY_ENVELOPES_JSON: ${DASHBOARD_COMPATIBILITY_ENVELOPES_JSON:-}
      DASHBOARD_COMPATIBILITY_ENVELOPES_DIGEST: ${DASHBOARD_COMPATIBILITY_ENVELOPES_DIGEST:-}
      DASHBOARD_ARTIFACT_DIGEST: ${DASHBOARD_ARTIFACT_DIGEST:-}
      DASHBOARD_SHADOW_WORKER_ARTIFACT_DIGEST: ${DASHBOARD_SHADOW_WORKER_ARTIFACT_DIGEST:-}
      RD_OWNER_API_ARTIFACT_DIGEST: ${RD_OWNER_API_ARTIFACT_DIGEST:-}
      DASHBOARD_SHADOW_SCHEDULES_JSON: ${DASHBOARD_SHADOW_SCHEDULES_JSON:-}
      DASHBOARD_SHADOW_SCHEDULES_DIGEST: ${DASHBOARD_SHADOW_SCHEDULES_DIGEST:-}
      RD_OWNER_API_URL: ${RD_OWNER_API_URL:-http://rd-owner-api:8080}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:-}
      RD_DASHBOARD_OWNER_READ_API_URL: >-
        ${RD_DASHBOARD_OWNER_READ_API_URL:-http://rd-dashboard-owner-read-api:8082}
      RD_DASHBOARD_OWNER_READ_API_TOKEN: ${RD_DASHBOARD_OWNER_READ_API_TOKEN:-}
    ports:
      - 127.0.0.1:${DASHBOARD_PORT:-3100}:3100
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3100/api/health/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
