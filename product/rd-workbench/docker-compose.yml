services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - POSTGRES_DB=windmill
      - RD_OWNER_DB_PASSWORD
      - RD_FACT_WRITER_DB_PASSWORD=${RD_FACT_WRITER_DB_PASSWORD:?set RD_FACT_WRITER_DB_PASSWORD}
      - MARKET_DATA_OWNER_DB_PASSWORD=${MARKET_DATA_OWNER_DB_PASSWORD:?set MARKET_DATA_OWNER_DB_PASSWORD}
      # yamllint disable rule:line-length
      - REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD=${REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD:?set REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD}
      # yamllint enable rule:line-length
      - OPERATOR_AUTHORIZATION_DB_PASSWORD
      - QUALIFICATION_OWNER_DB_PASSWORD
      - PRODUCT_EDGE_DB_PASSWORD
      - BACKTEST_OWNER_DB_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/00-create-rd-owner.sh:/docker-entrypoint-initdb.d/00-create-rd-owner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windmill"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rd-owner-api:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: unless-stopped
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
      MARKET_DATA_OWNER_DATABASE_URL: >-
        ${MARKET_DATA_OWNER_DATABASE_URL:?set MARKET_DATA_OWNER_DATABASE_URL}
      MARKET_DATA_RD_ROLE_SET_DATABASE_URL: >-
        ${MARKET_DATA_RD_ROLE_SET_DATABASE_URL:?set MARKET_DATA_RD_ROLE_SET_DATABASE_URL}
      DEPLOYMENT_STORE_ADMISSION_MODE: ${DEPLOYMENT_STORE_ADMISSION_MODE-disabled}
      DEPLOYMENT_STORE_ENVIRONMENT_IDENTITY: ${DEPLOYMENT_STORE_ENVIRONMENT_IDENTITY:-}
      DEPLOYMENT_STORE_DEPLOYMENT_IDENTITY: ${DEPLOYMENT_STORE_DEPLOYMENT_IDENTITY:-}
      DEPLOYMENT_STORE_EXPECTED_HEAD_IDENTITY: ${DEPLOYMENT_STORE_EXPECTED_HEAD_IDENTITY:-}
      QUALIFICATION_OWNER_DATABASE_URL: >-
        ${QUALIFICATION_OWNER_DATABASE_URL:?set QUALIFICATION_OWNER_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      PRODUCT_EDGE_DEPLOYMENT_IDENTITY: ${PRODUCT_EDGE_DEPLOYMENT_IDENTITY:?set PRODUCT_EDGE_DEPLOYMENT_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      RD_OWNER_ENABLE_ACCEPTANCE_FAULTS: ${RD_OWNER_ENABLE_ACCEPTANCE_FAULTS:-0}
      RD_SANDBOX_SOCKET: /run/trade-rd-sandbox/build.sock
      RUST_LOG: info
    depends_on:
      replay-policy-catalog-owner-readback:
        condition: service_completed_successfully
    expose:
      - 8080
    volumes:
      - sandbox-socket:/run/trade-rd-sandbox:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  schema-materialize:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    command: ["--materialize-schema"]
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  authority-custody-migrate:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RD_OWNER_DB_PASSWORD: ${RD_OWNER_DB_PASSWORD:?set RD_OWNER_DB_PASSWORD}
      RD_FACT_WRITER_DB_PASSWORD: >-
        ${RD_FACT_WRITER_DB_PASSWORD:?set RD_FACT_WRITER_DB_PASSWORD}
      MARKET_DATA_OWNER_DB_PASSWORD: >-
        ${MARKET_DATA_OWNER_DB_PASSWORD:?set MARKET_DATA_OWNER_DB_PASSWORD}
      REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD: >-
        ${REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD:?set REPLAY_POLICY_CATALOG_ADMIN_DB_PASSWORD}
      OPERATOR_AUTHORIZATION_DB_PASSWORD: >-
        ${OPERATOR_AUTHORIZATION_DB_PASSWORD:?set OPERATOR_AUTHORIZATION_DB_PASSWORD}
      QUALIFICATION_OWNER_DB_PASSWORD: >-
        ${QUALIFICATION_OWNER_DB_PASSWORD:?set QUALIFICATION_OWNER_DB_PASSWORD}
      PRODUCT_EDGE_DB_PASSWORD: ${PRODUCT_EDGE_DB_PASSWORD:?set PRODUCT_EDGE_DB_PASSWORD}
      BACKTEST_OWNER_DB_PASSWORD: ${BACKTEST_OWNER_DB_PASSWORD:?set BACKTEST_OWNER_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/opt/trade/10-migrate-authority-custody.sh"]
    volumes:
      - ./postgres-init/10-migrate-authority-custody.sh:/opt/trade/10-migrate-authority-custody.sh:ro
    depends_on:
      schema-materialize:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  replay-policy-catalog-bootstrap:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    entrypoint: ["/usr/local/bin/replay-policy-catalog-authority-bootstrap"]
    environment:
      REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL: >-
        ${REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL:?set REPLAY_POLICY_CATALOG_ADMIN_DATABASE_URL}
      REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST_PATH: >-
        /run/secrets/replay-policy-catalog-bootstrap-request.json
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY: >-
        ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY}
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY_PATH: >-
        /run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex
    volumes:
      # yamllint disable rule:line-length
      - ${REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST:?set REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST}:/run/secrets/replay-policy-catalog-bootstrap-request.json:ro
      - ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY}:/run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex:ro
      # yamllint enable rule:line-length
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  replay-policy-catalog-owner-readback:
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    restart: "no"
    entrypoint: ["/usr/local/bin/replay-policy-catalog-owner-readback"]
    environment:
      RD_OWNER_DATABASE_URL: ${RD_OWNER_DATABASE_URL:?set RD_OWNER_DATABASE_URL}
      REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST_PATH: >-
        /run/secrets/replay-policy-catalog-bootstrap-request.json
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY: >-
        ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_IDENTITY}
      REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY_PATH: >-
        /run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex
    volumes:
      # yamllint disable rule:line-length
      - ${REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST:?set REPLAY_POLICY_CATALOG_BOOTSTRAP_REQUEST}:/run/secrets/replay-policy-catalog-bootstrap-request.json:ro
      - ${REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY:?set REPLAY_POLICY_CATALOG_TRUSTED_VERIFIER_PUBLIC_KEY}:/run/secrets/replay-policy-catalog-trusted-verifier-public-key.hex:ro
      # yamllint enable rule:line-length
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  authority-bootstrap:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    entrypoint: ["/usr/local/bin/product-edge-authority-bootstrap"]
    environment:
      OPERATOR_AUTHORIZATION_DATABASE_URL: >-
        ${OPERATOR_AUTHORIZATION_DATABASE_URL:?set OPERATOR_AUTHORIZATION_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      PRODUCT_EDGE_BOOTSTRAP_CONFIG: ${PRODUCT_EDGE_BOOTSTRAP_CONFIG:?set PRODUCT_EDGE_BOOTSTRAP_CONFIG}
    command: ["/run/secrets/product-edge-bootstrap.json"]
    volumes:
      - ${PRODUCT_EDGE_BOOTSTRAP_CONFIG:?set PRODUCT_EDGE_BOOTSTRAP_CONFIG}:/run/secrets/product-edge-bootstrap.json:ro
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  authority-recovery:
    profiles: ["authority-admin"]
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.owner
    entrypoint: ["/usr/local/bin/product-edge-recover-expired-manifests"]
    environment:
      OPERATOR_AUTHORIZATION_DATABASE_URL: >-
        ${OPERATOR_AUTHORIZATION_DATABASE_URL:?set OPERATOR_AUTHORIZATION_DATABASE_URL}
      PRODUCT_EDGE_DATABASE_URL: ${PRODUCT_EDGE_DATABASE_URL:?set PRODUCT_EDGE_DATABASE_URL}
      PRODUCT_EDGE_DEPLOYMENT_IDENTITY: >-
        ${PRODUCT_EDGE_DEPLOYMENT_IDENTITY:?set PRODUCT_EDGE_DEPLOYMENT_IDENTITY}
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY:?set PRODUCT_EDGE_TRUSTED_ISSUER_IDENTITY}
      PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION: >-
        ${PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION:?set PRODUCT_EDGE_TRUSTED_ISSUER_KEY_VERSION}
      PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE: >-
        ${PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE:?set PRODUCT_EDGE_TRUSTED_AUTHORIZATION_AUDIENCE}
      PRODUCT_EDGE_RECOVERY_CONFIG: ${PRODUCT_EDGE_RECOVERY_CONFIG:?set PRODUCT_EDGE_RECOVERY_CONFIG}
    command: ["/run/secrets/product-edge-recovery.json"]
    volumes:
      - ${PRODUCT_EDGE_RECOVERY_CONFIG:?set PRODUCT_EDGE_RECOVERY_CONFIG}:/run/secrets/product-edge-recovery.json:ro
    depends_on:
      authority-custody-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  rd-build-sandbox:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: product/rd-workbench/Dockerfile.sandbox
    restart: unless-stopped
    network_mode: none
    environment:
      PATH: /usr/local/cargo/bin:/usr/local/rustup/toolchains/1.97.1-aarch64-unknown-linux-gnu/bin:/usr/bin:/bin
      RD_SANDBOX_SOCKET: /run/trade-rd-sandbox/build.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - sandbox-socket:/run/trade-rd-sandbox
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/trade-rd-sandbox/build.sock"]
      interval: 5s
      timeout: 3s
      retries: 20

  windmill-server:
    # yamllint disable rule:line-length
    image: ghcr.io/windmill-labs/windmill:1.791.0@sha256:1e9ec20f5a99235ccce18e4a4879a8c14ff1738af37fd23c18d87594dcee5916
    # yamllint enable rule:line-length
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL:?set WINDMILL_DATABASE_URL}
      MODE: server
      BASE_URL: http://127.0.0.1:${RD_WORKBENCH_PORT:-18000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${RD_WORKBENCH_PORT:-18000}:8000
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  windmill-worker:
    # yamllint disable rule:line-length
    image: ghcr.io/windmill-labs/windmill:1.791.0@sha256:1e9ec20f5a99235ccce18e4a4879a8c14ff1738af37fd23c18d87594dcee5916
    # yamllint enable rule:line-length
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL:?set WINDMILL_DATABASE_URL}
      MODE: worker
      WORKER_GROUP: rd-product-edge
      WORKER_TAGS: rd-product-edge,dependency
      RD_OWNER_API_TOKEN: ${RD_OWNER_API_TOKEN:?set RD_OWNER_API_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RD_EXECUTION_AGENT_MODEL: ${RD_EXECUTION_AGENT_MODEL:-deepseek-chat}
      WHITELIST_ENVS: RD_OWNER_API_TOKEN,DEEPSEEK_API_KEY,RD_EXECUTION_AGENT_MODEL
      RUST_LOG: warn
    depends_on:
      postgres:
        condition: service_healthy
      rd-owner-api:
        condition: service_healthy
    volumes:
      - worker-cache:/tmp/windmill/cache
      - worker-logs:/tmp/windmill/logs
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  worker-cache:
  worker-logs:
  sandbox-socket:
