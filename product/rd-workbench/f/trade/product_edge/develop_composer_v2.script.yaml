summary: Run or resolve Develop Composer V2 from canonical Research custody
description: >-
  Transports only one canonical Research request locator to the R&D Owner. The
  Owner derives the request, Design, digests and provider under its own custody.
lock: "!inline f/trade/product_edge/develop_composer_v2.script.lock"
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  order:
    - action
    - research_request_locator
  properties:
    action:
      type: string
      enum:
        - RUN
        - RESOLVE
    research_request_locator:
      type: string
      minLength: 1
      maxLength: 256
      description: Exact canonical Research request locator used for Owner-derived RUN and recovery projection.
  required:
    - action
    - research_request_locator
tag: rd-product-edge
