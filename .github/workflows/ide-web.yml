name: ide-web

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ide-web.yml
      - ide/web/**
      - ide/agent/**
      - .github/actions/ci-paths/**
      - .github/scripts/ci-paths.py
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main every commit keeps its own run:
# a cancelled run marks that merged commit red although nothing failed.
concurrency:
  group: ide-web-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-paths
        id: paths
        with:
          paths: |
            .github/workflows/ide-web.yml
            ide/web/**
            ide/agent/**
            .github/actions/ci-paths/**
            .github/scripts/ci-paths.py

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Type-check and build the research graph web renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ide/web/package-lock.json
      - run: npm ci --prefix ide/web
      - name: Test live research navigation
        run: npm test --prefix ide/web
      - name: Type-check and build the single-file page (tsc --noEmit && vite build)
        run: npm run build --prefix ide/web
      - name: The built page holds the view placeholder exactly once
        run: test "$(grep -o __RESEARCH_GRAPH_VIEW__ ide/web/dist/index.html | wc -l)" -eq 1

  agent:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Type-check and test the chat service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ide/agent/package-lock.json
      - run: npm ci --prefix ide/agent
      - run: npm run check --prefix ide/agent
      - run: npm test --prefix ide/agent

  gate:
    name: ide-web-gate
    if: always()
    needs: [changes, build, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks, or an explicitly unrelated change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            (.changes.outputs.changed as $changed |
             ($changed == "true" or $changed == "false") and
             ([to_entries[] | select(.key != "changes") | .value.result]
              | all(. == (if $changed == "true" then "success" else "skipped" end))))
          ' <<< "$NEEDS"
