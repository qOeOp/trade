name: ide-image

# The trade IDE service image, and the image of the same compose project's ledger service and paper
# daemon (the Dockerfile's `service` target), are built here, never on a workstation: the graph it serves
# names the product commit it was drawn with, so the image must hold exactly a commit of this
# repository. A main build moves the `main` tag; a pull request build gets a `pr-N` tag. Every
# image carries that commit in org.opencontainers.image.revision.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ide-image.yml
      - ide/**
      - deploy/**
      - cli/**
      - engine/**
      - ledger/**
      - live/**
      - market/**
      - paper/**
      - qualification/**
      - registration/**
      - replay/**
      - report/**
      - runtime/**
      - pyproject.toml
      - uv.lock
      - .github/actions/ci-paths/**
      - .github/scripts/ci-paths.py
      - .github/scripts/publish-platform-image.sh
      - .github/scripts/check-native-runtime.py
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ide-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-paths
        id: paths
        with:
          paths: |
            .github/workflows/ide-image.yml
            ide/**
            deploy/**
            cli/**
            engine/**
            ledger/**
            live/**
            market/**
            paper/**
            qualification/**
            registration/**
            replay/**
            report/**
            runtime/**
            pyproject.toml
            uv.lock
            .github/actions/ci-paths/**
            .github/scripts/ci-paths.py
            .github/scripts/publish-platform-image.sh
            .github/scripts/check-native-runtime.py

  image:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Name the image and its tags
        id: names
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The image holds the checked-out commit (a pull request's merge commit), so that is its revision.
          revision="$(git rev-parse HEAD)"
          tags() {  # image
            local found="$1:sha-$revision-$ARCH"
            if [ "$EVENT" = pull_request ]; then
              found="$found,$1:pr-$PR_NUMBER-$ARCH"
            elif [ "$REF" = refs/heads/main ]; then
              found="$found,$1:main-$ARCH"
            fi
            echo "$found"
          }
          image="ghcr.io/${OWNER,,}/trade-ide"
          service="ghcr.io/${OWNER,,}/trade-service"
          {
            echo "image=$image"
            echo "tags=$(tags "$image")"
            echo "service_image=$service"
            echo "service_tags=$(tags "$service")"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ide
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ide-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ide-${{ matrix.arch }}
      - id: service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: service
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.service_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ide-${{ matrix.arch }}
      - name: Exercise the built native service and IDE without venue access
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SERVICE: ${{ steps.names.outputs.service_image }}
          REVISION: ${{ steps.names.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$(case "$ARCH" in arm64) echo aarch64;; amd64) echo x86_64;; esac)"
          for kind in service ide; do
            base="$SERVICE"
            if [ "$kind" = ide ]; then base="$IMAGE"; fi
            image="$base:sha-$REVISION-$ARCH"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,size=2147483648 \
              --env HOME=/tmp --env DOLT_ROOT_PATH=/tmp/dolt-root \
              --mount type=bind,src="$PWD",dst=/validation,readonly \
              --entrypoint python "$image" /validation/.github/scripts/check-native-runtime.py "$kind" "$ARCH"
          done
      - name: Report the pushed digests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.names.outputs.tags }}
          SERVICE_IMAGE: ${{ steps.names.outputs.service_image }}
          SERVICE_DIGEST: ${{ steps.service.outputs.digest }}
          SERVICE_TAGS: ${{ steps.names.outputs.service_tags }}
          REVISION: ${{ steps.names.outputs.revision }}
        run: |
          {
            echo "image: \`$IMAGE@$DIGEST\`"
            echo
            echo "service image: \`$SERVICE_IMAGE@$SERVICE_DIGEST\`"
            echo
            echo "revision: \`$REVISION\`"
            echo
            echo "tags: \`$TAGS\`, \`$SERVICE_TAGS\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the exact native IDE artifact after its tests passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.names.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({
              'revision': os.environ['REVISION'],
              'image': os.environ['IMAGE'] + '@' + os.environ['DIGEST'],
          }) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: [changes, image]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish IDE and service platform manifests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          revision="$(git rev-parse HEAD)"
          alias=''
          if [ "$EVENT" = pull_request ]; then alias="pr-$PR_NUMBER";
          elif [ "$REF" = refs/heads/main ]; then alias=main; fi
          for image in trade-ide trade-service; do
            bash .github/scripts/publish-platform-image.sh "ghcr.io/${OWNER,,}/$image" "$revision" "$alias"
          done

  gate:
    name: ide-image-gate
    if: always()
    needs: [changes, image, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks, or an explicitly unrelated change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            (.changes.outputs.changed as $changed |
             ($changed == "true" or $changed == "false") and
             ([to_entries[] | select(.key != "changes") | .value.result]
              | all(. == (if $changed == "true" then "success" else "skipped" end))))
          ' <<< "$NEEDS"
