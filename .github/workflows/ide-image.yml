name: ide-image

# The trade IDE service image, the image of the same compose project's ledger service and paper daemon
# (the Dockerfile's `service` target) and its Docker API proxy (`docker-api`) are built here, never on a
# workstation: the graph it serves names the product commit it was drawn with, so the image must hold
# exactly a commit of this repository. A main build moves the `main` tag forward; a pull request build gets a `pr-N` tag. Every
# image carries that commit in org.opencontainers.image.revision.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ide-image.yml
      - ide/**
      - deploy/*.py
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - deploy/entrypoint.sh
      - deploy/compose.yaml
      - deploy/docker-api/**
      - cli/**
      - engine/**
      - ledger/**
      - live/**
      - market/**
      - paper/**
      - registration/**
      - replay/**
      - report/**
      - runtime/**
      - shared/**
      - pyproject.toml
      - uv.lock
      - .github/actions/ci-paths/**
      - .github/scripts/ci-paths.py
      - .github/scripts/replay-changed.py
      - .github/scripts/publish-platform-image.sh
      - .github/scripts/check-native-runtime.py
      - .github/scripts/fresh-install.sh
      - tests/cli/test_commands.py
      - tests/ledger/dolt.py
      - tests/market/directory.py
      - tests/registration/world.py
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per main commit: a group holds one pending run, so a shared main group cancelled queued builds in a
# burst of merges, and release-ready never admits a runtime whose commit has a cancelled run. The `main` tag moves
# only forward (publish-platform-image.sh), so an older build finishing last does not move it back.
concurrency:
  group: ide-image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-paths
        id: paths
        with:
          paths: |
            .github/workflows/ide-image.yml
            ide/**
            deploy/*.py
            deploy/Dockerfile
            deploy/Dockerfile.dockerignore
            deploy/entrypoint.sh
            deploy/compose.yaml
            deploy/docker-api/**
            cli/**
            engine/**
            ledger/**
            live/**
            market/**
            paper/**
            registration/**
            replay/**
            report/**
            runtime/**
            shared/**
            pyproject.toml
            uv.lock
            .github/actions/ci-paths/**
            .github/scripts/ci-paths.py
            .github/scripts/replay-changed.py
            .github/scripts/publish-platform-image.sh
            .github/scripts/check-native-runtime.py
            .github/scripts/fresh-install.sh
            tests/cli/test_commands.py
            tests/ledger/dolt.py
            tests/market/directory.py
            tests/registration/world.py

  image:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write  # signs the SBOM attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Name the image and its tags
        id: names
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The image holds the checked-out commit (a pull request's merge commit), so that is its revision.
          revision="$(git rev-parse HEAD)"
          tags() {  # image
            local found="$1:sha-$revision-$ARCH"
            if [ "$EVENT" = pull_request ]; then
              found="$found,$1:pr-$PR_NUMBER-$ARCH"
            fi
            echo "$found"
          }
          image="ghcr.io/${OWNER,,}/trade-ide"
          service="ghcr.io/${OWNER,,}/trade-service"
          docker_api="ghcr.io/${OWNER,,}/trade-docker-api"
          {
            echo "image=$image"
            echo "tags=$(tags "$image")"
            echo "service_image=$service"
            echo "service_tags=$(tags "$service")"
            echo "docker_api_image=$docker_api"
            echo "docker_api_tags=$(tags "$docker_api")"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ide
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ide-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ide-${{ matrix.arch }}
      - id: service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: service
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.service_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ide-${{ matrix.arch }}
      - id: docker_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: docker-api
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.docker_api_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ide-${{ matrix.arch }}
      - name: Exercise the built proxy on this runner's engine, hardened as compose runs it
        env:
          DOCKER_API: ${{ steps.names.outputs.docker_api_image }}
          REVISION: ${{ steps.names.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$DOCKER_API:sha-$REVISION-$ARCH"
          docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
          docker run -d --name docker-api-check --user 0:0 --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges -p 127.0.0.1:2375:2375 -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" "$image" --image=ghcr.io/qoeop/trade-runtime --user=1001:1001 \
            "--mount-root=$RUNNER_TEMP"
          sleep 1
          DOCKER_HOST=tcp://127.0.0.1:2375 docker version
          if DOCKER_HOST=tcp://127.0.0.1:2375 docker volume ls; then echo "the proxy let docker volume ls through"; exit 1; fi
          docker logs docker-api-check 2>&1 | grep -q 'refused GET .*/volumes'
          docker rm -f docker-api-check
      - name: Exercise the built native service and IDE without venue access
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SERVICE: ${{ steps.names.outputs.service_image }}
          REVISION: ${{ steps.names.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$(case "$ARCH" in arm64) echo aarch64;; amd64) echo x86_64;; esac)"
          for kind in service ide; do
            base="$SERVICE"
            if [ "$kind" = ide ]; then base="$IMAGE"; fi
            image="$base:sha-$REVISION-$ARCH"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,size=2147483648 \
              --env HOME=/tmp --env DOLT_ROOT_PATH=/tmp/dolt-root \
              --mount type=bind,src="$PWD",dst=/validation,readonly \
              --entrypoint python "$image" /validation/.github/scripts/check-native-runtime.py "$kind" "$ARCH"
          done
      - name: Report the pushed digests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.names.outputs.tags }}
          SERVICE_IMAGE: ${{ steps.names.outputs.service_image }}
          SERVICE_DIGEST: ${{ steps.service.outputs.digest }}
          SERVICE_TAGS: ${{ steps.names.outputs.service_tags }}
          DOCKER_API_IMAGE: ${{ steps.names.outputs.docker_api_image }}
          DOCKER_API_DIGEST: ${{ steps.docker_api.outputs.digest }}
          REVISION: ${{ steps.names.outputs.revision }}
        run: |
          {
            echo "image: \`$IMAGE@$DIGEST\`"
            echo
            echo "service image: \`$SERVICE_IMAGE@$SERVICE_DIGEST\`"
            echo
            echo "Docker API proxy image: \`$DOCKER_API_IMAGE@$DOCKER_API_DIGEST\`"
            echo
            echo "revision: \`$REVISION\`"
            echo
            echo "tags: \`$TAGS\`, \`$SERVICE_TAGS\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the exact native IDE artifact after its tests passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.names.outputs.revision }}
          SERVICE: ${{ steps.names.outputs.service_image }}@${{ steps.service.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({
              'revision': os.environ['REVISION'],
              'image': os.environ['IMAGE'] + '@' + os.environ['DIGEST'],
              'service': os.environ['SERVICE'],
          }) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30
      # SBOMs and a vulnerability scan of what this main build pushed, by digest. `sbom: true` on the builds
      # above would wrap each image in an index with an attestation manifest: its digest would stop being the
      # platform manifest that release.json, deploy/images.py and publish-platform-image.sh pin. These are
      # records, not gates: a failure here warns and never withholds a release.
      - id: syft
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - id: grype
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Write the SBOMs and scan them
        id: sbom
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IDE: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ steps.names.outputs.service_image }}@${{ steps.service.outputs.digest }}
          DOCKER_API: ${{ steps.names.outputs.docker_api_image }}@${{ steps.docker_api.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "### Vulnerabilities ($ARCH, high and critical with a fix)" >> "$GITHUB_STEP_SUMMARY"
          for kind in ide service docker_api; do
            case "$kind" in ide) image="$IDE";; service) image="$SERVICE";; docker_api) image="$DOCKER_API";; esac
            "$SYFT" scan "registry:$image" -o "spdx-json=sbom-$kind.spdx.json" -q
            {
              echo "**$image**"; echo; echo '```'
              "$GRYPE" "sbom:sbom-$kind.spdx.json" --only-fixed -o table -q | awk 'NR == 1 || /High|Critical/' 
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-ide.spdx.json
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.service_image }}
          subject-digest: ${{ steps.service.outputs.digest }}
          sbom-path: sbom-service.spdx.json
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.docker_api_image }}
          subject-digest: ${{ steps.docker_api.outputs.digest }}
          sbom-path: sbom-docker_api.spdx.json

  manifest:
    needs: [changes, image]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # pushes the images
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish IDE, service and Docker API proxy platform manifests
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}  # compares commits before the main tag moves
        run: |
          revision="$(git rev-parse HEAD)"
          alias=''
          if [ "$EVENT" = pull_request ]; then alias="pr-$PR_NUMBER";
          elif [ "$REF" = refs/heads/main ]; then alias=main; fi
          for image in trade-ide trade-service trade-docker-api; do
            bash .github/scripts/publish-platform-image.sh "ghcr.io/${OWNER,,}/$image" "$revision" "$alias"
          done
      # A warning, since a source change is always ahead of the pin until the pull request that moves it.
      - name: Warn when the pinned Docker API proxy is behind its source
        if: github.event_name == 'push'
        run: |
          pinned="$(sed -nE 's/^ *image: (ghcr\.io\/[^ ]*trade-docker-api@sha256:[0-9a-f]{64}).*/\1/p' deploy/compose.yaml)"
          if revision="$(docker buildx imagetools inspect --format '{{json .Image}}' "$pinned" \
              | jq -er '."linux/amd64".config.Labels."org.opencontainers.image.revision"')" \
              && git fetch --quiet --depth=1 origin "$revision"; then
            git diff --quiet "$revision" HEAD -- deploy/docker-api \
              || echo "::warning title=Docker API proxy::deploy/docker-api changed since $revision, the build deploy/compose.yaml pins; move the pin (deploy/README.md, Updating)"
          else
            echo "::warning title=Docker API proxy::could not read the build deploy/compose.yaml pins"
          fi

  # A fresh install from an empty host state to one replay, with this build's images (.github/scripts/fresh-install.sh
  # says what differs from a person's install and why). A fork's pull request pushes no images, so it has none to run.
  fresh-install:
    needs: [changes, image]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::notice title=Fresh install::not run, since a fork's pull request pushes no images"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Name this build's images and the runtime its replay uses
        id: images
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          revision="$(git rev-parse HEAD)"
          registry="ghcr.io/${OWNER,,}"
          digest() { docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -er .digest; }
          # The runtime this commit's replays pair with: its own replay image when replay-changed.py, given
          # runtime-image.yml's replay CI_PATHS, selects a replay build against the same base, otherwise the current
          # replay image `main`. A commit that changes only the execution image's inputs or this project's own
          # version builds no replay image to wait for.
          case "$EVENT" in pull_request) base="$PR_BASE";; push) base="$BEFORE";; *) base="$(git rev-parse HEAD^1)";; esac
          paths="$(python3 -c '
          import re, sys
          source = open(".github/workflows/runtime-image.yml").read().split("\n  changes:\n", 1)[1]
          print(re.split(r"\n(?! {12})", source.split("          CI_PATHS: |\n", 1)[1], maxsplit=1)[0].replace(" " * 12, ""))
          ')"
          CI_EVENT_NAME=pull_request CI_BASE_SHA="$base" CI_PATHS="$paths" GITHUB_OUTPUT="$RUNNER_TEMP/runtime" \
            python3 .github/scripts/replay-changed.py
          if grep -qx 'changed=true' "$RUNNER_TEMP/runtime"; then
            tag="$registry/trade-runtime:sha-$revision-amd64"
            for _ in $(seq 80); do docker buildx imagetools inspect "$tag" >/dev/null 2>&1 && break; sleep 30; done
            runtime="$registry/trade-runtime@$(digest "$tag")"
          else
            runtime="$registry/trade-runtime@$(docker buildx imagetools inspect --raw "$registry/trade-runtime:main" \
              | jq -er '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
          fi
          {
            echo "ide=$registry/trade-ide@$(digest "$registry/trade-ide:sha-$revision-amd64")"
            echo "service=$registry/trade-service@$(digest "$registry/trade-service:sha-$revision-amd64")"
            echo "runtime=$runtime"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: steps.images.outcome == 'success'
      - if: steps.images.outcome == 'success'
        run: uv python install 3.14 && uv sync --frozen
      - name: From an empty host to one replay
        if: steps.images.outcome == 'success'
        env:
          IDE: ${{ steps.images.outputs.ide }}
          SERVICE: ${{ steps.images.outputs.service }}
          RUNTIME: ${{ steps.images.outputs.runtime }}
        run: bash .github/scripts/fresh-install.sh "$IDE" "$SERVICE" "$RUNTIME"

  gate:
    name: ide-image-gate
    if: always()
    needs: [changes, image, manifest, fresh-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/gate
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
