name: bilibili-note-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bilibili-note-mcp.yml
      - .pre-commit-config.yaml
      - services/bilibili-note-mcp/**
  push:
    branches: [main]
    paths:
      - .github/workflows/bilibili-note-mcp.yml
      - .pre-commit-config.yaml
      - services/bilibili-note-mcp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilibili-note-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: bilibili-note-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bilibili-note-mcp
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: services/bilibili-note-mcp/uv.lock

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check schemas, code, tests, and fixture result
        run: |
          uv run --frozen python scripts/export_schemas.py --check
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen mypy src
          uv run --frozen python -m pytest -q
          uv run --frozen python -m bilibili_note_mcp --self-check

      - name: Check service Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          --config ../../.markdownlint.jsonc
          README.md bilibili-note.md
