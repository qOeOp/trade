name: bilibili-note-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bilibili-note-mcp.yml
      - .pre-commit-config.yaml
      - services/bilibili-note-mcp/**
  push:
    branches: [main]
    paths:
      - .github/workflows/bilibili-note-mcp.yml
      - .pre-commit-config.yaml
      - services/bilibili-note-mcp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilibili-note-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: bilibili-note-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bilibili-note-mcp
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: services/bilibili-note-mcp/uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check schemas, code, tests, and fixture result
        run: |
          uv run --frozen python scripts/export_schemas.py --check
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen mypy src
          uv run --frozen python -m pytest -q
          uv run --frozen python -m bilibili_note_mcp --self-check

      - name: Check service Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          --config ../../.markdownlint.jsonc
          README.md bilibili-note.md deploy/openclaw/README.md

  openclaw-patch:
    name: openclaw-patch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw
    env:
      OPENCLAW_BASE_COMMIT: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
      OPENCLAW_BASE_TREE: f855f357444931631be29141026876741ebc7dbd
      OPENCLAW_PATCH_SHA256: 35ebbfcbc651be6b1914766701b047ec418b51342ef9733c32f388adee39f5a6
      OPENCLAW_PATCH: ../trade/services/bilibili-note-mcp/deploy/openclaw/openclaw-2026.7.1-2-mcp-progress.patch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout trade candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trade
          persist-credentials: false

      - name: Checkout exact OpenClaw source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openclaw/openclaw
          ref: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
          path: openclaw
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Verify source and apply the exact patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OPENCLAW_BASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$OPENCLAW_BASE_TREE"
          test "$(sha256sum "$OPENCLAW_PATCH" | cut -d ' ' -f 1)" = "$OPENCLAW_PATCH_SHA256"
          git apply --check "$OPENCLAW_PATCH"
          git apply "$OPENCLAW_PATCH"
          test "$(git diff --name-only "$OPENCLAW_BASE_COMMIT" -- . | wc -l | tr -d ' ')" = "41"

      - name: Install exact OpenClaw dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run focused terminal bridge tests
        run: |
          node node_modules/vitest/vitest.mjs run \
            src/agents/agent-bundle-mcp-runtime.test.ts \
            src/agents/agent-bundle-mcp-tools.materialize.test.ts \
            src/agents/agent-bundle-mcp-tools.request-boundary.test.ts \
            src/agents/embedded-agent-runner/run.incomplete-turn.test.ts \
            src/agents/embedded-agent-runner/run/attempt-trajectory-status.test.ts \
            src/agents/embedded-agent-runner/run/payloads.test.ts \
            src/agents/embedded-agent-subscribe.handlers.lifecycle.test.ts \
            src/agents/embedded-agent-subscribe.handlers.tools.test.ts \
            src/agents/mcp-transport-config.test.ts \
            src/agents/openclaw-owned-tool-runtime-contract.test.ts \
            src/config/mcp-config.test.ts \
            src/gateway/openresponses-http.test.ts

      - name: Run OpenClaw type, lint, format, and diff gates
        shell: bash
        run: |
          pnpm tsgo:core
          pnpm tsgo:test:src
          mapfile -d '' changed_paths < <(git diff --name-only -z "$OPENCLAW_BASE_COMMIT" -- .)
          test "${#changed_paths[@]}" = "41"
          node scripts/run-oxlint.mjs "${changed_paths[@]}"
          node_modules/.bin/oxfmt --check --threads=1 "${changed_paths[@]}"
          git diff --check

      - name: Build patched OpenClaw
        run: pnpm build
