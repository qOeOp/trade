# yamllint disable rule:line-length
# Re-read after #1227 (prune deletes collided member executables), on main's entry of 2026-10-02T21:11Z.
# LANE8 PROBE, NOT FOR MERGE: how much of main's rust-tests entry is workspace units the saving
# run did not rebuild. D rebuilds every such unit anyway (its outputs predate the recorded time T),
# so they are dead weight; external dependencies reuse by hash and are not counted as prunable.
name: lane8-prune-probe

on:
  push:
    branches:
      - lane8-probe/prune

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      # yamllint disable-line rule:line-length
      RUST_TEST_EXTRA_FEATURES: capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,vibe-strategy-factory/sealed-develop-composer-acceptance
      RUST_BACKTRACE: 1
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          rust-cache-enabled: "true"
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      - name: Measure stale workspace units
        run: |-
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps > /tmp/meta.json
          python3 - << 'PY'
          import json, os, re
          from pathlib import Path
          target = Path(os.environ["CARGO_TARGET_DIR"])
          marker = (target / "source-marker" / "CACHEDIR.TAG").read_text()
          m = re.search(r"# workspace source ([0-9a-f]{40}) ([0-9]+)", marker)
          sha, t = m.group(1), int(m.group(2))
          meta = json.load(open("/tmp/meta.json"))
          names = set()
          for p in meta["packages"]:
              for n in [p["name"]] + [tgt["name"] for tgt in p["targets"]]:
                  names.add(n.replace("-", "_"))
          def pkg_of(entry):
              base = entry.split(".")[0]
              base = base[3:] if base.startswith("lib") else base
              return base.rsplit("-", 1)[0].replace("-", "_") if "-" in base else base.replace("-", "_")
          total = ws_new = ws_old = ext = 0
          for dirpath, _, files in os.walk(target):
              for f in files:
                  path = Path(dirpath) / f
                  try:
                      st = path.lstat()
                  except OSError:
                      continue
                  total += st.st_size
                  rel = path.relative_to(target).parts
                  kind = next((k for k in ("deps", ".fingerprint", "build") if k in rel), None)
                  if kind is None:
                      continue
                  entry = rel[rel.index(kind) + 1]
                  if pkg_of(entry) in names:
                      if st.st_mtime < t:
                          ws_old += st.st_size
                      else:
                          ws_new += st.st_size
                  else:
                      ext += st.st_size
          # Split the old bytes: an entry (fingerprint dir, build dir, deps file) that holds any file
          # written at or after T is kept whole by prune; one with none would have been deleted.
          entries = {}
          for dirpath, _, files in os.walk(target):
              for f in files:
                  path = Path(dirpath) / f
                  rel = path.relative_to(target).parts
                  kind = next((k for k in ("deps", ".fingerprint", "build") if k in rel), None)
                  if kind is None:
                      continue
                  i = rel.index(kind)
                  entry = rel[: i + 2]
                  if pkg_of(rel[i + 1]) not in names:
                      continue
                  try:
                      st = path.lstat()
                  except OSError:
                      continue
                  e = entries.setdefault((kind, entry), [0, 0, False])
                  if st.st_mtime < t:
                      e[0] += st.st_size
                  else:
                      e[1] += st.st_size
                      e[2] = True
          split = {}
          for (kind, entry), (old, new, fresh) in entries.items():
              key = (kind, "kept (has a fresh file)" if fresh else "all old")
              split[key] = split.get(key, 0) + old
          for (kind, state), old in sorted(split.items()):
              print(f"LANE8-P old bytes in {kind} entries, {state}: {old / 1e9:.3f} GB")
          largest = sorted(
              ((old, "/".join(entry)) for (kind, entry), (old, new, fresh) in entries.items() if kind == "deps" and not fresh),
              reverse=True,
          )[:20]
          for old, name in largest:
              print(f"LANE8-P old deps entry {old / 1e6:9.1f} MB  {name}")
          gb = lambda b: f"{b / 1e9:.2f} GB"
          print(f"LANE8-P marker {sha[:9]} at {t}")
          print(f"LANE8-P restored target {gb(total)}: workspace units built in the saving run {gb(ws_new)}, workspace units older than the marker {gb(ws_old)} (prunable), external {gb(ext)}")
          PY

      - name: Units whose fingerprint survived but whose binary did not
        run: |-
          set -euo pipefail
          python3 - << 'PY'
          import os, re
          from pathlib import Path
          target = Path(os.environ["CARGO_TARGET_DIR"])
          t = int(re.search(r"# workspace source [0-9a-f]{40} ([0-9]+)", (target / "source-marker" / "CACHEDIR.TAG").read_text()).group(1))
          profile = target / "ci-pr"
          missing = present = 0
          for fp in sorted((profile / ".fingerprint").iterdir()):
              m = re.match(r"^(vibe-[a-z0-9-]+)-([0-9a-f]{16})$", fp.name)
              if not m:
                  continue
              unit_hash = m.group(2)
              for f in fp.iterdir():
                  k = re.match(r"^(?:test-(?:integration-test|lib|bin)|bin)-(.+)$", f.name)
                  if not k or f.name.endswith(".json"):
                      continue
                  out = profile / "deps" / f"{k.group(1).replace('-', '_')}-{unit_hash}"
                  if out.exists():
                      present += 1
                      continue
                  missing += 1
                  times = sorted(int(x.stat().st_mtime) - t for x in fp.iterdir())
                  print(f"LANE8-M missing {out.name} for {fp.name}/{f.name}; fingerprint file mtimes relative to T: {times}")
          print(f"LANE8-M marker T={t}; test/bin units with output present {present}, missing {missing}")
          for name in ("readiness_consumer-0688e611e20bc9f6", "layout-979771506fe65792", "public_owner_admission-0b47813230018f1b"):
              print(f"LANE8-M named {name}: exists={(profile / 'deps' / name).exists()}")
          PY
