name: nightly-docs-features-check

# Documentation, feature compatibility, and all-target checks - runs nightly and on-demand.
#
# Verifies docs.rs documentation builds, crate feature combinations, and example targets.

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [test-docs-features]
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (same as security-audit)
  workflow_dispatch: # Allow manual trigger

jobs:
  docsrs-check:
    name: docsrs-check
    if: github.repository == 'nautechsystems/nautilus_trader'
    runs-on: ubuntu-22.04
    # No successful run of this job to measure yet (2026-09-24), so a stand-in: twice the slowest
    # compile-and-test job measured on these runners, rust tests at 3228s, rounded up. A hang anywhere
    # in the job stops here rather than at GitHub's six-hour default. Replace with twice this job's
    # own slowest run after its first successful runs.
    timeout-minutes: 120
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/docsrs-check
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Common setup
        # No successful run of this job to measure yet (2026-09-24), so twice the slowest Common setup
        # measured in any job: 1233s, rust tests. A hung setup fails here with its log instead of
        # running to the job limit. Replace with this job's own measurement after its first
        # successful runs.
        timeout-minutes: 42
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Install Rust nightly
        run: rustup toolchain install nightly

      - name: Install cargo-hack
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-hack

      - name: Run docsrs-check
        run: make docsrs-check

  check-features:
    name: check-features
    if: github.repository == 'nautechsystems/nautilus_trader'
    runs-on: ubuntu-22.04
    # Its one successful run took 12495s (2026-09-24); twice that is past GitHub's 360-minute maximum,
    # so this is the maximum, written out so a re-measure has a line to change. Re-measure once the
    # job has more successful runs.
    timeout-minutes: 360
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/check-features
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 38s over its last 1 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Install cargo-hack
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-hack

      - name: Run check-features
        run: make check-features

  check-all-targets:
    name: check-all-targets
    if: github.repository == 'nautechsystems/nautilus_trader'
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 866s over its last 1 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 29
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/check-all-targets
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 30s over its last 1 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Run check-all-targets
        run: make check-all-targets
