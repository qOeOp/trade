name: owner-chains

# The two isolated PostgreSQL Owner chains for a push to a `test-chain/` branch, and - for the
# Market Data lane's own branches only - the one venue leg that needs a reachable exchange.
#
# An Owner lane's acceptance is its entries in the ordered chain passing on Linux, and until now the
# only place to see that was the whole `build` gate - a push to `test-ci` or a Ready pull request -
# which is about thirty jobs and two hundred runner-minutes, most of them unrelated to the chain, on
# a repository whose budget is twenty concurrent jobs shared by every lane. This workflow runs the
# two chain jobs `build` runs, with the same matrix, environment and make targets: a lane pays two
# runner slots for its evidence and leaves the other eighteen alone.
#
# `venue-end-to-end` is the exception and is deliberately not in that matrix. It reaches a public
# exchange, so it can go red for a reason no change in this repository caused - the venue answers a
# GitHub-hosted runner with HTTP 451 from some of its hosts - and a leg like that does not belong on
# eight lanes' critical path. It runs only for `test-chain/market-data*`, where it verifies the
# Owner that owns it, and `build` does not run it at all.
#
# One branch per lane, `test-chain/<lane>`, and the branch is that lane's own, so a newer push
# supersedes the run before it. `test-ci` and `test-rd-owner-postgres` keep their commit-keyed
# groups because more than one agent pushes there.
#
# This is evidence for a lane, not admission to `main`. It admits no `pull_request` event, and a
# pull request still takes the whole `build` gate.

on:
  push:
    branches:
      - "test-chain/**"

permissions:
  contents: read

concurrency:
  group: owner-chains-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AUDIT_PR: ${{ github.repository == 'qOeOp/trade' }}

jobs:
  # The R&D chain's nextest archive, built where the Rust cache is. The chain job below only
  # downloads it: restoring the 6 GB cache took 145-225 s of every chain job's setup, and the chain's
  # 12-package graph reuses little of it anyway (its dependency features differ from the workspace
  # build that saved it, so 133 external crates compiled regardless). The archive is 383 MB. Both
  # legs of the matrix wait for it - Market Data does not use it, and finishes well inside the R&D
  # leg's time regardless.
  rd-owner-archive:
    name: rd owner archive (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # No run of this job to measure yet (2026-09-24), so a stand-in: the chain job's own setup and
    # step limits, which covered this same build when it ran inside the chain. Replace with twice this
    # job's slowest run after its first successful runs.
    timeout-minutes: 45
    env:
      # The chain builds exactly this; check-chain-channel-environment.py keeps the two equal.
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      # yamllint disable-line rule:line-length
      RUST_TEST_EXTRA_FEATURES: capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,vibe-strategy-factory/sealed-develop-composer-acceptance
      RUST_BACKTRACE: 1
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        timeout-minutes: 30
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          minimum-free-space-gb: "40"
          rust-cache-enabled: "true"
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      - name: Build the R&D chain archive
        timeout-minutes: 30
        run: >-
          make cargo-archive-rd-owner-postgres NEXTEST_PROFILE=ci
          EXTRA_FEATURES="${RUST_TEST_EXTRA_FEATURES}"
          RD_OWNER_ARCHIVE_FILE="${RUNNER_TEMP}/rd-owner-archive/rd-owner-tests.tar.zst"

      # Artifacts are Actions storage, not the 10 GB cache quota the Rust cache lives in. Kept one day:
      # the chain job reads it minutes later, and nothing else does.
      - name: Publish the R&D chain archive
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rd-owner-archive
          path: ${{ runner.temp }}/rd-owner-archive/
          if-no-files-found: error
          retention-days: 1

  owner-chain:
    name: ${{ matrix.chain.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.chain.job-timeout-minutes }}
    needs:
      - rd-owner-archive
    strategy:
      fail-fast: false
      matrix:
        chain:
          - key: rd-owner
            name: rd owner postgres (ubuntu-22.04)
            # Common setup: the slowest each part of it took across 45 rd/md chain jobs (2026-09-24) -
            # freeing disk 915s, rust-cache 340s, everything else 59s - is 1314s together; 30 minutes
            # leaves room above that. Freeing disk is bimodal: 42 jobs took 116-341s and 3 took
            # 839-915s on slow runners, so a sample without one of those reads far too low (this was
            # 18 and 28 minutes, and cut #979's setup at 18). Re-measure the parts, not the total,
            # and raise it once any of them routinely nears half of it.
            setup-timeout-minutes: 30
            step-timeout-minutes: 70
            # Above the step limits added together (30 + 70) and the short steps around them, so a
            # step timeout, which keeps its log, fires before the job limit, which does not.
            job-timeout-minutes: 105
            make: >-
              cargo-test-rd-owner-postgres-isolated NEXTEST_PROFILE=ci
              EXTRA_FEATURES="${RUST_TEST_EXTRA_FEATURES}"
          - key: market-data
            name: market data owner postgres (ubuntu-22.04)
            # Common setup: the slowest each part of it took across 45 rd/md chain jobs (2026-09-24) -
            # freeing disk 915s, rust-cache 340s, everything else 59s - is 1314s together; 30 minutes
            # leaves room above that. Freeing disk is bimodal: 42 jobs took 116-341s and 3 took
            # 839-915s on slow runners, so a sample without one of those reads far too low (this was
            # 18 and 28 minutes, and cut #979's setup at 18). Re-measure the parts, not the total,
            # and raise it once any of them routinely nears half of it.
            setup-timeout-minutes: 30
            step-timeout-minutes: 15
            # Above the step limits added together (30 + 15) and the short steps around them, so a
            # step timeout, which keeps its log, fires before the job limit, which does not.
            job-timeout-minutes: 50
            make: cargo-test-market-data-owner-postgres-isolated
    env:
      # What `build`'s chain job resolves to on a pull request, `main` and `test-ci` - the builds that
      # admit to `main` - because this workflow's result is the same acceptance (AGENTS.md). It was
      # `nextest`, whose dependencies are optimised: unoptimised sqlx and tokio futures keep larger
      # poll frames, so #993's entry 6 passed here and overflowed its stack in the pull request's
      # build. Being byte-identical also puts this job on the rust-cache entry `main` saves.
      # scripts/ci/check-chain-channel-environment.py refuses any CARGO_/RUST difference.
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      # yamllint disable-line rule:line-length
      RUST_TEST_EXTRA_FEATURES: capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,vibe-strategy-factory/sealed-develop-composer-acceptance
      RUST_BACKTRACE: 1
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        timeout-minutes: ${{ matrix.chain.setup-timeout-minutes }}
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          # The chains need far less room than the whole-workspace `rust tests` build this 110 was copied
          # from: measured on main 4a3013c12 (owner-chains run 35964493641), a hosted runner had 86G free
          # before any cleanup, and the rd chain's restored cache plus the chain itself took about 12G (md
          # about 5G). At 40 the cleanup is skipped on such a runner - it took 116-915s, 213s typically -
          # and still runs on any runner that starts below 40. Re-measure if a chain's use nears 20G.
          minimum-free-space-gb: "40"
          # Read-only, and the shared key `build`'s chain jobs state, so this restores the entry
          # `main`'s `rust tests` saves. Nothing is saved under it, so this workflow never spends the
          # 10 GB quota. It was `rust-cache-key`, which appends the job id: every run looked for an
          # `...-owner-chain-...` entry nobody saves and logged `No cache found.`.
          # The R&D leg compiles nothing - it runs the archive rd-owner-archive built - so it skips
          # the restore, which was most of its setup.
          rust-cache-enabled: ${{ matrix.chain.key != 'rd-owner' && 'true' || 'false' }}
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      # The R&D chain's entry 28, `strategy_source_browser_acceptance_reads_canonical_terminal_owner_custody`,
      # drives the Dashboard strategy viewer in a real browser only when these three inputs are
      # present; without them it passes in a few milliseconds and proves nothing about the browser.
      # `build`'s chain job runs it that way, so the only Linux evidence for the browser acceptance
      # has been `rd-owner-postgres.yml`. This leg carries the same sealed inputs, byte for byte, so
      # a lane's push exercises the whole entry. The Market Data leg has no browser to drive.
      - name: Install the sealed Dashboard browser acceptance inputs
        if: matrix.chain.key == 'rd-owner'
        uses: ./.github/actions/dashboard-browser-acceptance
        with:
          acceptance-candidate: ${{ github.sha }}

      - name: Download the R&D chain archive
        if: matrix.chain.key == 'rd-owner'
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rd-owner-archive
          path: ${{ runner.temp }}/rd-owner-archive

      - name: Report disk space before the chain
        run: bash scripts/ci/report-disk-space.bash "before ${{ matrix.chain.key }}"

      # The step and job ceilings are about twice what these chains take, measured on the successful
      # runs of build.yml and owner-chains.yml between 2026-09-19 and 2026-09-23: the R&D chain step
      # took median 32.8, p90 39.8, max 44.2 minutes over 66 runs (job max 48.5); the Market Data
      # step median 4.7, max 6.4 over 76 (job max 17.4). Without them a hung chain held the runner
      # until cancelled by hand, and a cancelled job keeps neither log nor artifact (run 35900267592).
      # The step ceiling fires first so the `always()` upload below still runs; the job ceiling is
      # the last resort. Each entry also has its own wall clock in the chain script.
      # These expire: the chain keeps growing (101 entries on 2026-09-24). When the rolling p90 of the
      # R&D step passes 55 minutes, or the Market Data step's passes 10, re-measure the same way and
      # raise both ceilings to about twice the new figures.
      - name: Run the isolated PostgreSQL Owner chain
        timeout-minutes: ${{ matrix.chain.step-timeout-minutes }}
        env:
          # The chain refuses an archive whose identity is not this tree's; empty on the Market Data leg.
          RD_OWNER_NEXTEST_ARCHIVE: >-
            ${{ matrix.chain.key == 'rd-owner'
            && format('{0}/rd-owner-archive/rd-owner-tests.tar.zst', runner.temp) || '' }}
        run: make ${{ matrix.chain.make }}

      # `if: always()`: the run that ends at an entry is the one whose record answers the most.
      # `if-no-files-found: error` because an empty upload would say "no entry ran" in the same
      # shape as "the copy broke".
      # Only the R&D leg writes these: `test-rd-owner-postgres.bash` takes the per-entry copies,
      # and the Market Data chain has its own script that does not. Without the leg condition this
      # step runs on both, finds nothing on the Market Data leg, and `if-no-files-found: error`
      # turns that into a failed job - which is exactly what it did on run 35688437514.
      - name: Publish which chain entries ran
        if: always() && matrix.chain.key == 'rd-owner'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-record-${{ matrix.chain.key }}
          path: target/nextest/chain-records/
          if-no-files-found: error
          retention-days: 7

      # A Market Data proof that ran past its wall clock leaves a record naming it
      # (run_market_data_owner_postgres.bash); a run with none leaves nothing to publish.
      - name: Publish which Market Data proof timed out
        if: always() && matrix.chain.key == 'market-data'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-record-${{ matrix.chain.key }}
          path: target/nextest/market-data-records/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Dashboard browser acceptance inputs
        if: always() && matrix.chain.key == 'rd-owner'
        run: |
          find product/dashboard/.next -depth -delete 2>/dev/null || true
          find product/dashboard/node_modules -depth -delete 2>/dev/null || true
          find "${RUNNER_TEMP}/dashboard-strategy-viewer-chrome" -depth -delete 2>/dev/null || true

      - name: Report disk space after the chain
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after ${{ matrix.chain.key }}"

  # The credential-free end-to-end proof of the Owner's PIT shape, which needs a reachable venue
  # rather than a database. It is a separate job rather than a third entry in the matrix above for
  # one reason: `jobs.<id>.if` cannot read the `matrix` context, so a matrix entry would run for
  # every lane's push and could only be skipped step by step - still taking a runner slot, and
  # still reporting on branches whose changes cannot affect it.
  #
  # It stood without a caller until its Makefile target landed, and without a hosted one after
  # that, because it reached `ObservationUnavailable` here and nothing in the leg could say why.
  # The runner now prints a status code per candidate venue host before the proof runs, so a red
  # names a cause; the client calls the public-data mirror its own binding proposes rather than the
  # trading API it was defaulting to; and the perpetual's host is substituted, out loud, when the
  # canonical one answers 451.
  venue-end-to-end:
    name: market data end-to-end, no credential (ubuntu-22.04)
    # This Owner's own branches only. The proof verifies Market Data's PIT path, so another lane's
    # push cannot make it more or less true - it can only make that lane wait, and inherit a red
    # from a venue's network policy.
    if: startsWith(github.ref_name, 'test-chain/market-data')
    runs-on: ubuntu-22.04
    # No successful run of this job to measure yet (2026-09-24), so a stand-in: twice the slowest
    # compile-and-test job measured on these runners, rust tests at 3228s, rounded up. A hang anywhere
    # in the job stops here rather than at GitHub's six-hour default. Replace with twice this job's
    # own slowest run after its first successful runs.
    timeout-minutes: 120
    env:
      # The same environment the chain jobs above are given, so this leg and they differ in what
      # they run and in nothing else.
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      RUST_BACKTRACE: 1
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # No successful run of this job to measure yet (2026-09-24), so twice the slowest Common setup
        # measured in any job: 1233s, rust tests. A hung setup fails here with its log instead of
        # running to the job limit. Replace with this job's own measurement after its first
        # successful runs.
        timeout-minutes: 42
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          minimum-free-space-gb: "110"
          rust-cache-enabled: "true"
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      - name: Report disk space before the proof
        run: bash scripts/ci/report-disk-space.bash "before market-data-e2e"

      - name: Run the credential-free end-to-end proof
        run: make cargo-test-market-data-end-to-end

      - name: Report disk space after the proof
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after market-data-e2e"
