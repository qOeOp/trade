name: pr-fast

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: pr-fast
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ github.repository == 'qOeOp/trade'
            && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      # https://github.com/actions/checkout
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run immutable-base plan
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" = "$(git rev-parse --verify "refs/remotes/origin/${BASE_REF}^{commit}")"
          trusted_plan="${RUNNER_TEMP}/ci-plan.sh"
          git show "${BASE_SHA}:scripts/ci/plan.sh" > "$trusted_plan"
          bash "$trusted_plan"

      - name: Install fast hook tools
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y ripgrep -o Acquire::Retries=5
          prek_version="$(bash scripts/tool-version.sh prek)"
          bash scripts/ci/install-prek.sh "$prek_version"
          command -v rg
          command -v prek
          rg --version
          prek --version

      - name: Run changed-file hooks
        env:
          PRE_COMMIT_BASE: ${{ steps.plan.outputs.pre_commit_base }}
        run: |-
          set -euo pipefail
          test -n "$PRE_COMMIT_BASE"
          # Global/cross-file hooks stay on the Ready full route. This lane only
          # exercises hooks whose contract consumes the exact changed-file argv.
          skip=(test-unicode-typography check-no-build-packages)
          skip+=(check-docker-toolchain-pins check-rust-toolchain check-miri-toolchain)
          skip+=(check-error-conventions check-no-legacy-paths check-links-offline)
          skip+=(check-anyhow-usage check-logging-conventions test-logging-conventions)
          skip+=(check-tokio-usage check-dst-conventions check-pyo3-conventions)
          skip+=(check-testing-conventions check-vibe-conventions)
          skip+=(check-formatting-rs test-formatting-rs check-formatting-py)
          skip+=(check-docs-conventions check-cargo-conventions check-jiff-features)
          skip+=(check-workspace-test-coverage fmt cargo-clippy)
          skip+=(cargo-clippy-network-turmoil-non-linux cargo-doc cargo-machete)
          args=()
          for hook in "${skip[@]}"; do args+=(--skip "$hook"); done
          prek run --from-ref "$PRE_COMMIT_BASE" --to-ref HEAD "${args[@]}"

      - name: Exercise changed planner
        env:
          PRE_COMMIT_BASE: ${{ steps.plan.outputs.pre_commit_base }}
        run: |-
          set -euo pipefail
          if ! git diff --quiet "$PRE_COMMIT_BASE" HEAD -- \
            scripts/ci/plan.sh scripts/ci/test-plan.sh; then
            bash scripts/ci/test-plan.sh
          fi
