name: research-graph-web

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-graph-web.yml
      - services/research-graph/web/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/research-graph-web.yml
      - services/research-graph/web/**

permissions:
  contents: read

concurrency:
  group: research-graph-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build the research graph web renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/research-graph/web/package-lock.json
      - run: npm ci --prefix services/research-graph/web
      - name: Type-check and build the single-file page (tsc --noEmit && vite build)
        run: npm run build --prefix services/research-graph/web
      - name: The built page holds the view placeholder exactly once
        run: test "$(grep -o __RESEARCH_GRAPH_VIEW__ services/research-graph/web/dist/index.html | wc -l)" -eq 1
