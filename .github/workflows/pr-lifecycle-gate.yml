name: pr-lifecycle-gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      expected_head_sha:
        description: Exact live pull request head
        required: true
        type: string
      expected_base_ref:
        description: Exact pull request base ref
        required: true
        type: string
      expected_base_sha:
        description: Exact live base commit
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-lifecycle-gate-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Verify exact PR lifecycle receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/pr-lifecycle.ts gate \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ inputs.pr_number }}" \
            --expected-head "${{ inputs.expected_head_sha }}" \
            --expected-base-ref "${{ inputs.expected_base_ref }}" \
            --expected-base-sha "${{ inputs.expected_base_sha }}" \
            --trusted-workflow-sha "$GITHUB_SHA"
