name: pr-lifecycle-gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      expected_head_sha:
        description: Exact live pull request head
        required: true
        type: string
      expected_base_ref:
        description: Exact pull request base ref
        required: true
        type: string
      expected_base_sha:
        description: Exact live base commit and workflow revision
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-lifecycle-gate-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish non-success status
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=pr-lifecycle-gate \
            -f description="Verifying native Codex review evidence" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: setup
        with:
          bun-version: 1.3.13
      - name: Bind workflow to the expected live base
        id: bind
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_BASE_SHA"
      - name: Verify native PR evidence twice
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_REF: ${{ inputs.expected_base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          bun scripts/check-pr-review.ts \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --expected-base-ref "$EXPECTED_BASE_REF" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --allow-draft
      - name: Publish final status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.expected_head_sha }}
          PENDING_OUTCOME: ${{ steps.pending.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          state=failure
          description="Native Codex review evidence rejected"
          if test "$PENDING_OUTCOME" = success \
            && test "$CHECKOUT_OUTCOME" = success \
            && test "$SETUP_OUTCOME" = success \
            && test "$BIND_OUTCOME" = success \
            && test "$VERIFY_OUTCOME" = success; then
              state=success
              description="Native Codex review evidence verified"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=pr-lifecycle-gate \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
