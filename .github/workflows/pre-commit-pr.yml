name: pre-commit-pr

# The hooks that need no compiled workspace, over all files, on every pull request push - drafts
# included - and on every push to `main`. This is where a pull request's no-compile hooks run:
# build.yml's pre-commit job, on the Ready run, runs only the compiled ones (cargo-clippy, its
# non-Linux turmoil sibling, cargo-doc, cargo-machete, and check-links-offline, which needs a pinned
# lychee install), and its `quality` requires this job's result for the same head, so both halves
# gate the merge. Both used to run every no-compile hook on each pull request - about 18
# runner-hours a day on 2026-09-24. scripts/ci/run-pre-commit.bash holds the hook lists.
#
# This lives outside `build.yml` on purpose: that file's contents are hashed into the Rust cache key,
# so editing it would evict the whole workspace cache for every job.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_PR: >-
    ${{ github.repository == 'qOeOp/trade'
    || github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository) }}

jobs:
  hooks:
    name: pre-commit (no-compile hooks)
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 561s over its last 15 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 19
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The same setup `build.yml`'s pre-commit job uses, so the two cannot drift into disagreeing
      # about toolchains. The Rust cache stays off: no hook here compiles anything.
      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 49s over its last 15 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "pre-commit"
          rust-cache-enabled: "false"

      # --all-files rather than a diff range: these hooks read the whole repository anyway, and the
      # full pass takes about the same time as resolving a merge base would save.
      - name: Run the hooks that need no compiled workspace
        run: bash scripts/ci/run-pre-commit.bash no-compile
