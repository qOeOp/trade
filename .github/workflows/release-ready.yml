name: release-ready

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-ready.yml
      - .github/scripts/release-ready.cjs
      - .github/scripts/release-ready.test.cjs
      - deploy/runtime_inputs.py
  # zizmor flags every workflow_run trigger: it runs with the base repository's token on events a fork can cause.
  # Here it only wakes the publisher: both jobs check out main (never the triggering run's code or artifacts), and
  # release-ready.cjs admits only push runs on main of qoeop/trade, by head SHA and artifact identity.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [quality, ide-web, ide-image, runtime-image, docs-pages, remote-paper-auth]
    types: [in_progress, completed]
    branches: [main]
  # Third-party checks can finish after the last workflow; check_suite has recursion suppression.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main callbacks keep one publisher; a queued PR test must not be replaced by a main callback.
  group: ${{ github.event_name == 'pull_request' && format('release-ready-pr-{0}', github.event.pull_request.number) || 'release-ready' }}
  cancel-in-progress: false

jobs:
  eligibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify the trusted runtime input helper
        run: python3 -c 'import runpy; runpy.run_path("deploy/runtime_inputs.py")'
      - run: node --test .github/scripts/release-ready.test.cjs
  release-ready:
    if: github.event_name != 'pull_request'
    needs: eligibility-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      # The default branch owns the publisher; never execute a triggering PR's code or artifact.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - name: Verify the trusted runtime input helper
        run: python3 -c 'import runpy; runpy.run_path("deploy/runtime_inputs.py")'
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const publish = require('./.github/scripts/release-ready.cjs');
            await publish({ github, context, core });
