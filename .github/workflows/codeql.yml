name: codeql

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            config: |-
              paths:
                - .agents/skills/run-bounded-mission/scripts
          - language: python
            config: "{}"
          - language: rust
            config: "{}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify JavaScript/TypeScript scan coverage
        if: ${{ matrix.language == 'javascript-typescript' }}
        shell: bash
        run: |
          javascript_typescript_paths=$(mktemp)
          trap 'rm -f "$javascript_typescript_paths"' EXIT

          if ! git ls-files -z -- \
              '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.ts' '*.tsx' '*.mts' '*.cts' >"$javascript_typescript_paths"; then
            printf 'Failed to inventory tracked JavaScript/TypeScript paths.\n' >&2
            exit 1
          fi

          while IFS= read -r -d '' javascript_typescript_path; do
            case "$javascript_typescript_path" in
              .agents/skills/run-bounded-mission/scripts/*) ;;
              *)
                printf 'Tracked JavaScript/TypeScript path is outside CodeQL coverage: %q\n' \
                  "$javascript_typescript_path" >&2
                exit 1
                ;;
            esac
          done <"$javascript_typescript_paths"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: ${{ matrix.config }}
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}

  go-absent:
    name: codeql-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove Go is absent
        run: bash .github/scripts/verify-go-absence.sh
