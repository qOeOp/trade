name: repository-quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: repository-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: project-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/project-quality
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validate-pr-title.sh "$PR_TITLE"
      - name: Validate changed lines
        env:
          QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --no-renames --check "$QUALITY_DIFF_BASE"...HEAD
      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          rust-cache-enabled: "false"
      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Install Python quality dependencies
        run: UV_SYNC_FLAGS="--inexact --locked" make sync
      - name: Check formatting and lint
        run: |
          bash .pre-commit-hooks/cargo_fmt_stable.sh --all -- --check
          env -u VIRTUAL_ENV uv run --project python --no-sync ruff format . --check \
            --config python/pyproject.toml \
            --force-exclude
          make check-code
      - name: Check metadata and build
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          bash scripts/ci/check-workspace-test-coverage.sh
          make cargo-check
      - name: Verify quality checks did not modify tracked files
        if: ${{ always() }}
        run: git diff --exit-code

  rust-tests:
    name: rust tests (ubuntu-22.04)
    needs: [project]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_CI_PROFILE: ci-pr
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      NEXTEST_PROFILE: ci
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          rust-cache-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: ${{ github.event_name == 'push' }}
      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Report disk space before Rust tests
        run: bash scripts/ci/report-disk-space.bash "before Rust tests"
      - name: Run Rust tests
        run: make cargo-test NEXTEST_PROFILE=ci
      - name: Report disk space after Rust tests
        if: ${{ always() }}
        run: bash scripts/ci/report-disk-space.bash "after Rust tests"
      - name: Verify tests did not modify tracked files
        if: ${{ always() }}
        run: git diff --exit-code

  quality:
    name: quality
    if: ${{ always() }}
    needs: [project, rust-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require project quality
        env:
          PROJECT_RESULT: ${{ needs.project.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: |
          test "$PROJECT_RESULT" = success
          test "$RUST_TESTS_RESULT" = success
