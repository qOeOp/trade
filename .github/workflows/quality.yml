name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main every commit keeps its own run:
# a cancelled run marks that merged commit red although nothing failed.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-paths
        id: paths
        with:
          # No check here reads these two trees. A change anywhere else, a new directory included, runs the
          # tests, and every commit on main does.
          paths: |
            **
            !docs/**
            !.agents/evals/**

  tests:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the job took 11-14 minutes on main in October 2026
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Research records verify source commits from other branches.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Lint with ruff (pyproject configuration)
        run: uv run --frozen ruff check .
      - name: Type-check the product packages with mypy (pyproject configuration)
        run: uv run --frozen mypy
      - name: Install pinned Dolt for ledger integration tests
        # The tests start and delete their own throwaway Dolt services; nothing runs here.
        run: |
          curl --fail --location --silent --show-error https://github.com/dolthub/dolt/releases/download/v2.7.2/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt.tar.gz"
          echo "72825a65d96bf0a0967ec408ad43bc21afc9b1c899b84cb84344a35f567fb11f  $RUNNER_TEMP/dolt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          echo "RESEARCH_DOLT_BINARY=$RUNNER_TEMP/dolt-linux-amd64/bin/dolt" >> "$GITHUB_ENV"
      - run: uv run --frozen python -m engine.run --help > /dev/null
      - name: Install pinned ffmpeg for the video evidence checker test
        # Static builds from a GitHub release, the version apt had: apt's mirror stalled often enough to fail runs.
        timeout-minutes: 5
        run: |
          base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          mkdir "$RUNNER_TEMP/ffmpeg"
          curl --fail --location --silent --show-error --retry 3 "$base/ffmpeg-linux-x64.gz" -o "$RUNNER_TEMP/ffmpeg/ffmpeg.gz"
          curl --fail --location --silent --show-error --retry 3 "$base/ffprobe-linux-x64.gz" -o "$RUNNER_TEMP/ffmpeg/ffprobe.gz"
          echo "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  $RUNNER_TEMP/ffmpeg/ffmpeg.gz" | sha256sum --check
          echo "25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  $RUNNER_TEMP/ffmpeg/ffprobe.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/ffmpeg/ffmpeg.gz" "$RUNNER_TEMP/ffmpeg/ffprobe.gz"
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - name: Run the tests; any ResourceWarning (unclosed file, socket or unwaited process) fails them
        env:
          # No PYTHONTRACEMALLOC here: it made the slowest modules 3-4 times slower. To find where a reported
          # resource was allocated, run that module locally with PYTHONTRACEMALLOC=1.
          # A -W option turns off unittest's own "default" filter, so restore it to keep DeprecationWarning visible.
          PYTHONWARNINGS: default,always::ResourceWarning
        # Each module runs in its own process, several at once: run serially the step took 13-15 minutes.
        run: |
          set -o pipefail
          uv run --frozen python .github/scripts/run-tests.py 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -n -A3 ResourceWarning "$RUNNER_TEMP/tests.log"; then
            echo "::error::the tests left a ResourceWarning (see above)"
            exit 1
          fi

  gate:
    name: quality
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks, or an explicitly unrelated change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            (.changes.outputs.changed as $changed |
             ($changed == "true" or $changed == "false") and
             ([to_entries[] | select(.key != "changes") | .value.result]
              | all(. == (if $changed == "true" then "success" else "skipped" end))))
          ' <<< "$NEEDS"
