name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q strategies/r1
      - run: uv run --frozen python strategies/r1/run_portfolio.py --help > /dev/null
      - run: uv run --frozen python -m unittest research.records.test_cli research.records.test_artifacts
      - name: Check frozen native parity receipts
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          for name in (
              'parity-h18a.json',
              'parity-h19a.json',
              'parity-cleanup-h19a.json',
          ):
              receipt = json.loads((Path('strategies/r1') / name).read_text())
              assert receipt['parity_passed'], name
          for name in ('parity-node-h18a.json', 'parity-node-h19a.json'):
              receipt = json.loads((Path('strategies/r1') / name).read_text())
              assert receipt['passed'], name
          migration = json.loads((Path('strategies/r1') / 'parity-node-migration.json').read_text())
          assert migration['all_behavior_matched']
          assert len(migration['variants']) == 16
          PY
