name: repository-quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  policy:
    name: policy-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: bash .github/scripts/validate-pr-title.sh "$PR_TITLE"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install repository dependencies
        run: env -u BINANCE_API_KEY -u BINANCE_API_SECRET -u SILICONFLOW_API_KEY bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Install ShellCheck binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.11.0 \
            --repo koalaman/shellcheck \
            --pattern shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" node_modules/shellcheck/bin/shellcheck
      - name: Verify ShellCheck binary
        run: ./node_modules/.bin/shellcheck --version
      - name: Capture clean workspace
        run: bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:side-effects --action capture --snapshot tmp/check/policy-workspace.json --require-clean
      - name: Check diff, source, secrets, and tool registry
        run: |
          git diff --no-renames --check "$QUALITY_DIFF_BASE"...HEAD
          git ls-files -- '*.sh' | while IFS= read -r file; do
            sh -n "$file"
            ./node_modules/.bin/shellcheck --severity=warning -e SC1007 "$file"
          done
          bun run lint
          bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:secrets
          bun run --cwd apps/orchestration-ops/agent-mcp check:toolset
      - name: Verify no workspace mutations
        if: ${{ always() }}
        run: bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:side-effects --action check --snapshot tmp/check/policy-workspace.json

  packages:
    name: packages-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: even-packages
            shard: 0/2
          - name: odd-packages
            shard: 1/2
    env:
      QUALITY_PACKAGE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            **/target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install repository dependencies
        run: env -u BINANCE_API_KEY -u BINANCE_API_SECRET -u SILICONFLOW_API_KEY bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Capture clean workspace
        run: bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:side-effects --action capture --snapshot tmp/check/packages-workspace.json --require-clean
      - name: Run package checks
        run: bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:packages --run-shard "$QUALITY_PACKAGE_SHARD"
      - name: Verify no workspace mutations
        if: ${{ always() }}
        run: bun run --cwd apps/orchestration-ops/agent-workspace-manager repository:side-effects --action check --snapshot tmp/check/packages-workspace.json

  quality:
    name: quality
    if: ${{ always() }}
    needs: [policy, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality leaf
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          for result in "$POLICY_RESULT" "$PACKAGES_RESULT"; do
            test "$result" = success
          done
