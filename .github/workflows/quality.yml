name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Research records verify source commits from other branches.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Lint with ruff (pyproject configuration)
        run: uv run --frozen ruff check .
      - name: Type-check the product packages with mypy (pyproject configuration)
        run: uv run --frozen mypy cli engine ledger market qualification registration replay report runtime services/ide/research_graph
      - name: Install pinned Dolt for ledger integration tests
        # The tests start and delete their own throwaway Dolt services; nothing runs here.
        run: |
          curl --fail --location --silent --show-error https://github.com/dolthub/dolt/releases/download/v2.4.2/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt.tar.gz"
          echo "5d95a271149dc6ea97f47157af7ba9a0df5e8d4e9bbac4d79c169f2faa3cfb9e  $RUNNER_TEMP/dolt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          echo "RESEARCH_DOLT_BINARY=$RUNNER_TEMP/dolt-linux-amd64/bin/dolt" >> "$GITHUB_ENV"
      - run: uv run --frozen python -m compileall -q cli engine ledger market qualification registration replay report runtime
      - run: uv run --frozen python -m engine.run --help > /dev/null
      - name: Install ffmpeg for the video evidence checker test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run the tests; any ResourceWarning (unclosed file, socket or unwaited process) fails them
        env:
          PYTHONWARNINGS: always::ResourceWarning
          PYTHONTRACEMALLOC: "1"
        run: |
          set -o pipefail
          uv run --frozen python -m unittest discover -s tests -t . -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -n -A3 ResourceWarning "$RUNNER_TEMP/tests.log"; then
            echo "::error::the tests left a ResourceWarning (see above)"
            exit 1
          fi
