name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main every commit keeps its own run:
# a cancelled run marks that merged commit red although nothing failed.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the job took 11-14 minutes on main in October 2026
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Research records verify source commits from other branches.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Lint with ruff (pyproject configuration)
        run: uv run --frozen ruff check .
      - name: Type-check the product packages with mypy (pyproject configuration)
        run: uv run --frozen mypy
      - name: Install pinned Dolt for ledger integration tests
        # The tests start and delete their own throwaway Dolt services; nothing runs here.
        run: |
          curl --fail --location --silent --show-error https://github.com/dolthub/dolt/releases/download/v2.4.2/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt.tar.gz"
          echo "5d95a271149dc6ea97f47157af7ba9a0df5e8d4e9bbac4d79c169f2faa3cfb9e  $RUNNER_TEMP/dolt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          echo "RESEARCH_DOLT_BINARY=$RUNNER_TEMP/dolt-linux-amd64/bin/dolt" >> "$GITHUB_ENV"
      - run: uv run --frozen python -m compileall -q cli engine ledger market paper qualification registration replay report runtime
      - run: uv run --frozen python -m engine.run --help > /dev/null
      - name: Install ffmpeg for the video evidence checker test
        # This step usually takes under 30 s but has hung for 13-25 minutes on a stalled mirror,
        # so each attempt is bounded and retried instead of running into the job timeout.
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get "${apt_options[@]}" update \
              && timeout 150 sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "::warning::ffmpeg install attempt $attempt failed or timed out"
          done
          exit 1
      - name: Run the tests; any ResourceWarning (unclosed file, socket or unwaited process) fails them
        env:
          # A -W option turns off unittest's own "default" filter, so restore it to keep DeprecationWarning visible.
          PYTHONWARNINGS: default,always::ResourceWarning
          PYTHONTRACEMALLOC: "1"
        # Each module runs in its own process, several at once: run serially the step took 13-15 minutes.
        run: |
          set -o pipefail
          uv run --frozen python .github/scripts/run-tests.py 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -n -A3 ResourceWarning "$RUNNER_TEMP/tests.log"; then
            echo "::error::the tests left a ResourceWarning (see above)"
            exit 1
          fi
