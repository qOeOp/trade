name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Research records verify source commits from other branches.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Start pinned local Dolt for metadata integration
        run: |
          curl --fail --location --silent --show-error https://github.com/dolthub/dolt/releases/download/v2.4.2/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt.tar.gz"
          echo "5d95a271149dc6ea97f47157af7ba9a0df5e8d4e9bbac4d79c169f2faa3cfb9e  $RUNNER_TEMP/dolt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/records-data"
          "$RUNNER_TEMP/dolt-linux-amd64/bin/dolt" sql-server --host 127.0.0.1 --port 13326 --data-dir "$RUNNER_TEMP/records-data" --socket "$RUNNER_TEMP/records.sock" > "$RUNNER_TEMP/dolt-server.log" 2>&1 &
          echo 'RESEARCH_DOLT_TEST_CONFIG={"host":"127.0.0.1","port":13326,"user":"root","password":"","database":"unused"}' >> "$GITHUB_ENV"
          uv run --frozen python - <<'PY'
          import time
          import pymysql
          for attempt in range(50):
              try:
                  with pymysql.connect(host='127.0.0.1', port=13326, user='root', connect_timeout=1):
                      break
              except pymysql.MySQLError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('pinned Dolt server did not become ready')
          PY
      - run: uv run --frozen python -m compileall -q backtest research/records
      - run: uv run --frozen python -m backtest.r1.run_portfolio --help > /dev/null
      - run: uv run --frozen python -m unittest discover -s tests -t . -p 'test_*.py'
      - name: Check frozen native parity receipts
        run: |
          uv run --frozen python - <<'PY'
          import json
          import hashlib
          import subprocess
          from pathlib import Path

          for name in (
              'parity-h18a.json',
              'parity-h19a.json',
              'parity-cleanup-h19a.json',
          ):
              receipt = json.loads((Path('backtest/r1/receipts') / name).read_text())
              assert receipt['parity_passed'], name
          for name in ('parity-node-h18a.json', 'parity-node-h19a.json'):
              receipt = json.loads((Path('backtest/r1/receipts') / name).read_text())
              assert receipt['passed'], name
          migration = json.loads((Path('backtest/r1/receipts') / 'parity-node-migration.json').read_text())
          assert migration['all_behavior_matched']
          assert len(migration['variants']) == 16
          current = json.loads(Path('backtest/r1/receipts/parity-single-file-h19a.json').read_text())
          assert current['passed'] and current['per_coin_diagnostics_exact']
          assert current['independent_native_audit']['passed']
          assert current['native_order_integrity'] == {'integrity_passed': True, 'denied_orders': 0, 'rejected_orders': 0}
          # These receipts describe earlier implementations; keep their bytes.
          current = json.loads(Path('backtest/r1/receipts/parity-dolt-oci-h19a.json').read_text())
          assert current['passed'] and current['per_coin_diagnostics_exact']
          assert current['independent_native_audit']['passed']
          assert current['recovery']['passed']
          assert current['native_order_integrity'] == {'integrity_passed': True, 'denied_orders': 0, 'rejected_orders': 0}
          for name, digest in current['runtime_source_sha256'].items():
              raw = subprocess.check_output(['git', 'show', 'c77702fc5c4a8afba318f32913ba9582df4677a4:' + name])
              assert hashlib.sha256(raw).hexdigest() == digest, name
          source = current['legacy_source']
          raw = subprocess.check_output(['git', 'show', source['commit'] + ':' + source['path']])
          assert hashlib.sha256(raw).hexdigest() == current['strategy_binding']['source_sha256']
          assert not Path('strategies').exists()
          assert not Path('research/r1_variants').exists()
          PY
