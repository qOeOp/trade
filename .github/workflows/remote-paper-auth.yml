name: remote-paper-auth
on:
  pull_request:
    branches: [main]
    paths: [deploy/remote/**, deploy/release*.py, tests/deploy/**, .github/scripts/check-remote-deploy.py, .github/workflows/remote-paper-auth.yml]
  push:
    branches: [main]
    paths: [deploy/remote/**, deploy/release*.py, tests/deploy/**, .github/scripts/check-remote-deploy.py, .github/workflows/remote-paper-auth.yml]
permissions:
  contents: read
jobs:
  native-auth:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Verify public ports and secret isolation with dummy configuration
        run: python3 .github/scripts/check-remote-deploy.py
      - name: Test the installed controller with Ubuntu system Python
        run: python3 -m unittest tests.deploy.test_release
      - name: Extract the exact pinned native proxy without starting it
        run: |
          docker create --name trade-oauth-check quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          docker cp trade-oauth-check:/usr/bin/oauth2-proxy "$RUNNER_TEMP/oauth2-proxy"
          docker rm trade-oauth-check
          chmod +x "$RUNNER_TEMP/oauth2-proxy"
      - name: Test login allowlist, expiry, API denial and streaming on loopback only
        run: RESEARCH_OAUTH2_PROXY_BINARY="$RUNNER_TEMP/oauth2-proxy" python3 -m unittest tests.deploy.test_remote_auth
      - name: Extract the pinned native Caddy for real hot-switch and rollback tests
        run: |
          docker create --name trade-release-caddy-check caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
          docker cp trade-release-caddy-check:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          docker rm trade-release-caddy-check
          chmod +x "$RUNNER_TEMP/caddy"
      - name: Exercise native atomic switching, streaming, rollback and independent Paper continuity
        run: RESEARCH_CADDY_BINARY="$RUNNER_TEMP/caddy" python3 -m unittest tests.deploy.test_release_proxy
      - name: Verify the existing Node bind-to-service-name mode on the native Docker DNS
        run: |
          image="$(awk '$1 == "FROM" && $NF == "agent" {print $2}' deploy/Dockerfile)"
          docker network create trade-release-dns-check
          trap 'docker rm -f trade-release-dns-agent; docker network rm trade-release-dns-check' EXIT
          docker run -d --name trade-release-dns-agent --network trade-release-dns-check --network-alias agent \
            --entrypoint node "$image" -e 'require("node:http").createServer((q,s)=>s.end("ready")).listen(8766,"agent")'
          docker run --rm --network trade-release-dns-check --entrypoint node "$image" \
            -e 'for(let n=0;n<20;n++){try{if(await(await fetch("http://agent:8766")).text()!=="ready")throw Error();process.exit(0)}catch{await new Promise(r=>setTimeout(r,100))}}process.exit(1)'
      - name: Read a cross-owner private fixture without granting write access
        run: |
          image="$(awk '$1 == "FROM" && $NF == "agent" {print $2}' deploy/Dockerfile)"
          fixture="$RUNNER_TEMP/reader-permission"
          mkdir "$fixture"
          printf fixture > "$fixture/reader.json"
          sudo chown 12345:12345 "$fixture/reader.json"
          sudo chmod 600 "$fixture/reader.json"
          docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges --mount type=bind,src="$fixture",dst=/fixture,readonly \
            --entrypoint node "$image" -e 'const fs=require("node:fs");if(fs.readFileSync("/fixture/reader.json","utf8")!=="fixture")throw Error("read failed");try{fs.writeFileSync("/fixture/reader.json","changed");throw Error("write admitted")}catch(e){if(e.code!=="EROFS")throw e}'
      - name: Validate the exact pinned HTTPS proxy configuration without network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /data:rw,nosuid,size=16777216 --tmpfs /config:rw,nosuid,size=16777216 \
            --env TRADE_DOMAIN=www.vibe-trading.info \
            --mount type=bind,src="$PWD/deploy/remote/Caddyfile",dst=/etc/caddy/Caddyfile,readonly \
            caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
