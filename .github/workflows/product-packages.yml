name: product-packages

# Three product packages carry their own test suites and nothing ran any of them. The Dashboard's
# 424 tests included two bilingual assertions that had never matched the documents they read, and
# the R&D Workbench's 255 included a content-addressed lock that had drifted from three of its
# scripts. Neither is visible until the suites execute somewhere.
#
# They are kept out of `build.yml` so a package change does not wait on that workflow's hour, and so
# adding them does not invalidate the Rust cache key that hashes it.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-packages.yml
      - product/dashboard/**
      - product/rd-workbench/**
      - product/rd-owner-client/**
      - docs/guide/dashboard.md
      - docs/guide/dashboard.zh.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/product-packages.yml
      - product/dashboard/**
      - product/rd-workbench/**
      - product/rd-owner-client/**
      - docs/guide/dashboard.md
      - docs/guide/dashboard.zh.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Product package tests
    runs-on: ubuntu-latest
    # The suites drive a browser and spawn previews. Node's test runner has no timeout of its own,
    # so without a bound a single unanswered command runs the job until the platform kills it, with
    # no log to read afterwards.
    timeout-minutes: 30
    # The seven PostgreSQL suites and the HTTP session suite skip themselves without a runtime,
    # which is how a directory of 133 test files ran 129 of them here while the RunStore routes
    # that Operations serves (Runs, Workers, Schedules, Service Logs, Audit) and the three browser
    # acceptances written for them never executed anywhere. The service container below is the
    # same PostgreSQL pin the R&D Owner chain uses; each suite creates and drops its own database
    # next to the control database named for it and never touches the caller's.
    services:
      postgres:
        # yamllint disable-line rule:line-length
        image: mirror.gcr.io/library/postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DASHBOARD_SUITE_POSTGRES: postgresql://postgres:dashboard@127.0.0.1:5432
    steps:
      - name: Harden runner
        # https://github.com/step-security/harden-runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: product/dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix product/dashboard

      - name: Run Dashboard tests
        run: npm run test --prefix product/dashboard

      - name: Check Dashboard types
        run: npm run typecheck --prefix product/dashboard

      # The browser, from the one definition the chain uses rather than a second copy of the install.
      # That is the whole reason; the browser itself is not what the schedule calendar acceptance was
      # red on. This comment previously said the channel was the cause, on a reading that did not
      # survive its second run: the same Chrome for Testing 152.0.7977.83 build passed and failed it
      # on byte-identical sources. The cause was the suite synthesizing Enter as keyDown with text
      # and leaving Chrome to derive the char event a button activates on, which it intermittently
      # did not. The suite now sends that event itself.
      #
      # It sits here rather than beside the Node setup for a reason a run found: this action also
      # exports the three variables that switch the chain's own strategy-viewer acceptance on, and
      # that acceptance needs an Owner API this job does not run. Placed earlier, it turned that
      # acceptance on during `npm run test` and the job died there, before any of the three suites
      # below had run at all.
      - name: Install the Dashboard browser acceptance inputs
        uses: ./.github/actions/dashboard-browser-acceptance
        with:
          acceptance-candidate: ${{ github.sha }}

      - name: Create the Dashboard suite control databases
        working-directory: product/dashboard
        run: node scripts/create-suite-databases.mjs

      # The README's local checks end with a production build, and the HTTP session suite starts
      # that build; the gate never built the bundle before.
      - name: Build the Dashboard
        run: npm run build --prefix product/dashboard

      - name: Run the Dashboard PostgreSQL and browser suites
        working-directory: product/dashboard
        env:
          DASHBOARD_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_run_store
          DASHBOARD_TEST_CURSOR_HMAC_KEY: run-store-disposable-cursor-key-at-least-32-bytes
          DASHBOARD_RUN_LIST_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_runs
          DASHBOARD_SHADOW_RUNTIME_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_shadow_runtime
          DASHBOARD_SHADOW_RUNTIME_TEST_CURSOR_HMAC_KEY: shadow-runtime-disposable-cursor-key-at-least-32-bytes
          # All three RunStore browser acceptances run here. None of them had ever run anywhere, and
          # each was held back under a reason that measurement later replaced.
          #
          # Schedule calendar was the last, and it was the suite at fault rather than the page. It
          # synthesized Enter as a keyDown carrying text, which leaves Chrome to derive the char
          # event a button activates on - and on this runner Chrome intermittently did not derive
          # it. The keypress reached the right button and the button never acted. The suite now
          # sends rawKeyDown, char and keyUp itself, and asserts the control was activated rather
          # than that the key arrived.
          #
          # The record matters more than the conclusion here, because three readings preceded that
          # one and two of them were written down as fact. First, focus: a dump showed focus on the
          # right control and that control enabled, which killed it. Then four candidates went for
          # nothing - the date, by rerunning on the runner's own day; the timezone, by rerunning
          # under UTC after checking the override reached the browser; the platform, by installing
          # the browser the local passes used; and the version, by holding the channel and moving
          # only the build. The channel was what remained and it was written into this file as the
          # cause - then the same Chrome for Testing 152.0.7977.83 build passed one run and failed
          # the next on byte-identical sources, serially, on the same UTC day. Third, undelivered
          # keys, which the suite's own new instrument refuted by reporting a shape nobody had
          # proposed: the key arrived, at the right element, and still did not activate it.
          #
          # What ended it was a positive control rather than another run: removing the char event
          # reproduces the failure deterministically, including on a machine where twenty-eight
          # consecutive runs had passed. A diagnostic that can report a shape you did not think of
          # is worth more than one that confirms a candidate you did.
          # Service logs was held back three times over for reasons that measurement replaced, and
          # the sequence is worth keeping. It was first recorded as meeting a cursor continuity
          # failure, which the page never showed: the wait is a conjunction and a timeout quotes
          # only its first line, so what was written down was the first line of the expression
          # rather than the part that was unmet. That part required every row to contain an
          # identifier the surface renders as a label. Past it, the acceptance surfaced a header
          # that changed height while reading, and then a run of assertions written against the
          # data model's identifiers rather than the page - none of which could have held on any
          # day since they were written. It now passes in about 50 s.
          #
          # Workers stalled here twice while passing locally in 24 to 38 s, and the browser build
          # looked like the difference. It was not: pinning the build changed nothing, and the suite
          # was missing three Chrome startup flags the ordered chain's own acceptance passes on this
          # same runner. Its holdback was the environment all along, one line of it.
          DASHBOARD_WORKERS_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_workers
          DASHBOARD_WORKERS_BROWSER_ACCEPTANCE: "1"
          DASHBOARD_WORKERS_ACCEPTANCE_CANDIDATE: ${{ github.sha }}
          DASHBOARD_WORKERS_BROWSER_EXECUTABLE: ${{ env.DASHBOARD_STRATEGY_VIEWER_BROWSER_EXECUTABLE }}
          DASHBOARD_CALENDAR_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_calendar
          DASHBOARD_CALENDAR_BROWSER_ACCEPTANCE: "1"
          DASHBOARD_CALENDAR_ACCEPTANCE_CANDIDATE: ${{ github.sha }}
          DASHBOARD_CALENDAR_BROWSER_EXECUTABLE: ${{ env.DASHBOARD_STRATEGY_VIEWER_BROWSER_EXECUTABLE }}
          DASHBOARD_SERVICE_LOGS_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_service_logs
          DASHBOARD_SERVICE_LOGS_BROWSER_ACCEPTANCE: "1"
          DASHBOARD_SERVICE_LOGS_ACCEPTANCE_CANDIDATE: ${{ github.sha }}
          DASHBOARD_SERVICE_LOGS_BROWSER_EXECUTABLE: ${{ env.DASHBOARD_STRATEGY_VIEWER_BROWSER_EXECUTABLE }}
        # `--test-force-exit` used to be here, covering suites that left a browser or a server
        # running: the runner's cleanup had to terminate them as orphans, and without the flag the
        # test runner never exited. Those suites now put the browser in its own process group and
        # signal the group, so the flag should have nothing left to cover.
        #
        # A leak of that kind is intermittent, so a green run here does not show the flag is
        # unnecessary - it shows this run did not leak. What distinguishes the two is whether the
        # job's cleanup reports "Terminate orphan process" at the end. That line is what exposed the
        # leak in the first place, and its absence across runs is the evidence for dropping this.
        run: >-
          node --test --test-concurrency=1 --test-timeout=600000
          tests/run-store.postgres.test.mjs
          tests/run-list-view-gateway.postgres.test.mjs
          tests/shadow-runtime.postgres.test.mjs
          tests/operations-workers.postgres.test.mjs
          tests/schedule-calendar.postgres.test.mjs
          tests/service-logs.postgres.test.mjs

      # The Audit suite reads the same two variable names as the RunStore suite and migrates the
      # database they name in place, so it gets a control database of its own.
      - name: Run the Dashboard Audit PostgreSQL suite
        working-directory: product/dashboard
        env:
          DASHBOARD_TEST_DATABASE_URL: ${{ env.DASHBOARD_SUITE_POSTGRES }}/dashboard_audit
          DASHBOARD_TEST_CURSOR_HMAC_KEY: audit-disposable-cursor-key-at-least-32-bytes
        run: node --test --test-timeout=300000 tests/operation-audit.postgres.test.mjs

      # A suite that starts a server can fail in two ways this job has to tell apart. A test that
      # hangs is bounded below; a process that will not exit once every test has passed is not, and
      # `--test-force-exit` is the wrong instrument for it - it would end the process and report a
      # pass while the leak that caused it stayed. This step lost a whole job to that second kind,
      # and the fix is in the suite's own teardown. The job's own limit reports a recurrence as the
      # failure it is.
      - name: Run the Dashboard local operator session HTTP suite
        working-directory: product/dashboard
        run: node --test --test-timeout=300000 tests/local-operator-session.http.mjs

      # The R&D Owner client has no package manifest and no dependencies; it runs on the standard
      # library alone, which is why nothing had to install it and why nothing ran it either. The
      # R&D Workbench step that stood beside this one retired with Windmill: that package now ships
      # deployment manifests and their checks, which `make rd-workbench-check` owns, and carries no
      # test files at all.
      - name: Run R&D Owner client tests
        working-directory: product/rd-owner-client
        run: node --test --test-timeout=300000 ./*.test.mjs

      # The R&D deployment package carries manifests rather than tests. Its checks read files and
      # need no container, so the gate that already watches its path can run them.
      - name: Check the R&D deployment package
        run: make rd-workbench-check
