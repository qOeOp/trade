name: build

# Build and publish the Python package, Rust crates, and stable release assets

permissions:
  # Principle of least privilege
  contents: read
  actions: read

on:
  # `main` is deliberately absent here and verified by `schedule` below instead.
  push:
    branches:
      - test-ci
      - test-pre-commit
      - nightly
      - master
  # Every push to `main` started a full build, and the concurrency group below puts all of them in
  # one group with `cancel-in-progress: true`, so each merge killed the run before it finished. In
  # the twenty hours to 2026-09-20T23:34Z, 53 of the 60 `main` builds were cancelled and 6 reached
  # a verdict; `main` had gone 39 commits with no Owner-chain verdict at all. A fixed schedule
  # verifies the tip on its own cadence: six runs a day that nothing supersedes, in place of sixty
  # that cancel one another for the same six verdicts.
  #
  # This trigger cannot make a red tree green - a scheduled run validates the same tree a push
  # would have - so the only failure it can introduce is a verdict arriving later than a merge,
  # never a false green.
  #
  # The minute is off the hour. Measured 2026-09-24T06:26Z over every slot since this trigger landed
  # (2026-09-21 04:00 to 2026-09-24 04:00 UTC, 19 slots), the on-the-hour cron started 12 runs: 7
  # slots never ran at all (every 04:00 and 12:00), and of the 12 that did, 10 started 58 minutes to
  # 3h06m late. (Each run counted for the nearest slot before it: runs never start early, so that is
  # the smallest delay that fits.) This expires 48 hours after it lands: re-measure the slots, with
  # 04:17 and 12:17 seen at least twice each. If they arrive and the delays shrink, the hour was the
  # cause and this stays. If 04 and 12 still go missing, the hours are the cause: move to
  # "17 2,6,10,14,18,22 * * *", clear of both, and measure again.
  schedule:
    - cron: "17 */4 * * *"
  # A same-tree verdict on `main` on demand, without creating a branch to push to. `ready-gate` and
  # `scripts/ci/plan.sh` must route it like `schedule`, to full validation; scripts/ci/test-plan.sh
  # runs both with this event and fails if either would skip. It shares `main`'s concurrency group,
  # so it supersedes a scheduled run still in progress on the same branch, as a newer tip would.
  workflow_dispatch:
  # `ready-gate` admits exactly `ready_for_review`, `opened:false` and `reopened:false`, so these
  # are the only events it can answer `run-full` for. `synchronize` is deliberately absent: a push
  # would fail the gate rather than validate, and re-validating after a push is the Draft -> Ready
  # toggle the gate's own notice asks for.
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
  # A merge queue asks this workflow for a verdict on a temporary
  # `gh-readonly-queue/main/...` branch holding `main` plus the entries ahead of the candidate. The
  # queue waits for that verdict and drops the entry when none arrives, so a queue configured while
  # this trigger is absent would refuse every pull request in turn. `ready-gate` already answers
  # `run-full` for any non-pull-request event and `scripts/ci/plan.sh` already routes an unknown
  # event to full validation, so what the queue receives is the same gate a push to `main` receives.
  # No `branches` filter: the entry ref is the queue's own branch, not the base, and a filter that
  # failed to match would fail by never running, which is the one failure this trigger exists to
  # prevent.
  merge_group:
    types:
      - checks_requested

# One run per pull request, and one per branch tip on `main`. Keying a push group on the commit
# gave every `main` push a group of its own, so `cancel-in-progress` could never fire there: the
# 41 merges of 2026-09-17 left nine full builds queued behind one another, holding the runner
# budget that the next pull request's gate waits for while publishing nothing, since every
# release job here is gated on `nautechsystems/nautilus_trader`. `main` is squash-merged in
# sequence, so only its tip is worth verifying and a superseded run should yield its runner.
# The shared test branches keep the commit in their group on purpose: a force-push there is
# another agent's experiment rather than a superseding tip, and cancelling it would destroy
# verification someone is waiting for.
concurrency:
  group: >-
    ${{ format('{0}-{1}', github.workflow,
    github.event.pull_request.number
    || (github.ref_name == 'main' && github.ref_name
    || format('{0}-{1}', github.ref_name, github.sha))) }}
  cancel-in-progress: true

env:
  AUDIT_PR: >-
    ${{ github.repository == 'qOeOp/trade'
    || github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository) }}
  UNTRUSTED_PR: >-
    ${{ github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository
    || !github.event.pull_request.user.login
    || github.event.pull_request.user.login == 'dependabot[bot]') }}
  PACKAGE_DIR: python
  # Whether this run saves the build caches, for every step that saves one. main is built by the
  # schedule and, on demand, by a dispatch on main, never by a push; both save, because the
  # schedule misses slots and a cache key change stays cold until main saves again. The name must
  # not start with CARGO, CC, CFLAGS, CXX, CMAKE or RUST: rust-cache hashes such variables into its
  # key, and one that differs between pull requests and main would stop pull requests restoring
  # main's entries.
  SAVE_BUILD_CACHES: >-
    ${{ github.event_name == 'push' || github.event_name == 'schedule'
    || github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}

jobs:
  ready-gate:
    name: build-ready-gate
    runs-on: ubuntu-latest
    outputs:
      run-full: ${{ steps.route.outputs.run-full }}
    steps:
      - name: Classify Ready entry
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          run_full=false
          if [[ "$EVENT_NAME" != pull_request ]]; then
            run_full=true
          else
            case "${ACTION}:${DRAFT}" in
              ready_for_review:* | opened:false | reopened:false) run_full=true ;;
            esac
          fi
          echo "run-full=${run_full}" >> "$GITHUB_OUTPUT"
          if [[ "$run_full" != true ]]; then
            echo '::notice::needs-full-ready: move the PR to Draft, then mark it Ready'
          fi

  plan:
    name: plan
    needs: ready-gate
    if: needs.ready-gate.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.plan.outputs.run_tests }}
      run-rust-tests: ${{ steps.plan.outputs.run_rust_tests }}
      run-generated-drift: ${{ steps.plan.outputs.run_generated_drift }}
      run-full-pre-commit: ${{ steps.plan.outputs.run_full_pre_commit }}
      run-capnp-check: ${{ steps.plan.outputs.run_capnp_check }}
      pre-commit-base: ${{ steps.plan.outputs.pre_commit_base }}
      security-audit-needed: ${{ steps.security-audit.outputs.audit_needed }}
      untrusted_pr: ${{ steps.policy.outputs.untrusted_pr }}
      publish_r2: ${{ steps.wheel-publication.outputs.publish_r2 }}
      publish_development: ${{ steps.wheel-publication.outputs.publish_development }}
      publish_environment: ${{ steps.wheel-publication.outputs.publish_environment }}
      wheel_matrix: ${{ steps.wheel-publication.outputs.wheel_matrix }}
      wheel_version: ${{ steps.wheel-publication.outputs.wheel_version }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Export CI policy
        id: policy
        run: echo "untrusted_pr=${UNTRUSTED_PR}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            # Take the plan from the base branch, never from the pull request: the head is the
            # untrusted side. Read it at the branch tip rather than at BASE_SHA. BASE_SHA is
            # frozen in the event payload, so it goes stale the moment anything lands on the
            # base, and pinning to it refused every open pull request with a bare exit 1.
            # scripts/ci/plan.sh already merge-bases BASE_SHA against HEAD, so the tip's copy
            # selects the same jobs while always being the plan the base branch has in force.
            trusted_plan="${RUNNER_TEMP}/ci-plan.sh"
            git show "refs/remotes/origin/${BASE_REF}:scripts/ci/plan.sh" > "$trusted_plan"
            bash "$trusted_plan"
          else
            bash scripts/ci/plan.sh
          fi

      - name: Plan security audit
        id: security-audit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: bash scripts/ci/security-audit-gate.sh

      - name: Plan wheel publication
        id: wheel-publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.repository }}" != "nautechsystems/nautilus_trader" ]]; then
            {
              echo "publish_r2=false"
              echo "publish_development=false"
              echo "publish_environment="
              echo "wheel_matrix=none"
              echo "wheel_version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci/plan-wheel-publication.bash

      # Candidate-owned fixtures run only after every authority-bearing output
      # above is frozen, so they can fail the job but cannot influence routing.
      - name: Exercise CI plan fixtures
        run: bash scripts/ci/test-plan.sh

  pre-commit:
    name: pre-commit
    needs: plan
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 1400s over its last 12 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 47
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/pre-commit
      CARGO_CI_PROFILE: ci-pr
      # Scopes incremental clippy/doc checks; empty for non-PR/push events.
      CHANGED_BASE_SHA: >-
        ${{ github.event.pull_request.base.sha || github.event.before }}
      PRE_COMMIT_BASE: ${{ needs.plan.outputs.pre-commit-base }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so changed-file scripts can resolve CHANGED_BASE_SHA.
          fetch-depth: 0

      # Temporary: fail fast on rare runner worktree corruption while we isolate the root cause
      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 48s over its last 12 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          build-type: "pre-commit"
          rust-cache-enabled: "false"

      - name: Get lychee version
        run: |
          version="$(bash scripts/cargo-tool-version.sh lychee)"
          echo "LYCHEE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install lychee
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: lychee@${{ env.LYCHEE_VERSION }}
        env:
          # Ubuntu 22.04 glibc is older than Lychee's GNU binary requires
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

      - name: Get cargo-machete version
        run: |
          version="$(bash scripts/cargo-tool-version.sh cargo-machete)"
          echo "CARGO_MACHETE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install cargo-machete
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }}

      - name: Run pre-commit
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.run-full-pre-commit }}" == true ]]; then
            prek run --all-files
          else
            test -n "$PRE_COMMIT_BASE"
            # Every narrow route is non-Rust by plan.sh. Agent TOML and other
            # generic text would otherwise match cargo fmt/clippy/doc's broad
            # TOML filter and rebuild the entire workspace without a Rust
            # consumer. Their applicable generic TOML/Markdown checks remain.
            prek run --from-ref "$PRE_COMMIT_BASE" --to-ref HEAD \
              --skip check-anyhow-usage \
              --skip check-logging-conventions \
              --skip check-tokio-usage \
              --skip check-dst-conventions \
              --skip check-pyo3-conventions \
              --skip check-testing-conventions \
              --skip check-vibe-conventions \
              --skip fmt \
              --skip cargo-clippy \
              --skip cargo-clippy-network-turmoil-non-linux \
              --skip cargo-doc \
              --skip cargo-machete
          fi

      - name: Lint the ordered chain's sealed feature union
        # The workspace clippy above never enables a sealed acceptance feature, so code the ordered
        # chain compiles behind one is otherwise linted by nothing. Same job, profile and target dir as
        # that clippy, so only the sealed crates and their dependents are rechecked; this job has slack
        # before the chain and rust-test jobs finish, so it stays off the critical path.
        if: needs.plan.outputs.run-full-pre-commit == 'true'
        run: bash scripts/ci/check-sealed-feature-clippy.bash

      - name: Verify capnp schemas are up-to-date
        if: needs.plan.outputs.run-capnp-check == 'true'
        run: make check-capnp-schemas

  build:
    if: github.ref != 'refs/heads/test-pre-commit' && needs.plan.outputs.run-tests == 'true'
    needs:
      - plan
    strategy:
      fail-fast: false
      matrix:
        # One version on a pull request, all three everywhere else. A pull request gate answers
        # "is this change correct", and three interpreter builds cost 37 of the 139 job-minutes a
        # pull request spends - 3 of its 11 jobs. The concurrency allowance is 20 jobs for the whole
        # account, so 11 jobs means two pull requests saturate it and the third waits; 9 means it
        # does not. Version compatibility is still checked, on `main`'s scheduled run and on every
        # other push, a few hours later rather than once per pull request.
        #
        # 3.13 is the one kept, not an arbitrary pick: two steps below gate on
        # `matrix.python-version == '3.13'`, including the generated-stub drift check. Keeping a
        # different version would stop that check running on pull requests without failing anything.
        python-version: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["3.13"]')
          || fromJSON('["3.12", "3.13", "3.14"]') }}
    name: build - python ${{ matrix.python-version }} (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 2037s over its last 11 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 68
    defaults:
      run:
        shell: bash
    env:
      CARGO_CI_PROFILE: ci-pr
      MATURIN_PROFILE: ci-pr-wheel
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/py${{ matrix.python-version }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Temporary: fail fast on rare runner worktree corruption while we isolate the root cause
      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 106s over its last 11 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          rust-cache-enabled: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          # rust-cache already folds `rustc -vV`, every CARGO_/RUST_ variable, the toolchain file
          # and the Cargo manifests and lockfile into the key it computes, so this input only has
          # to name what that key cannot see. It used to hash this workflow and the setup action
          # as well, which decide nothing about the compiled artifacts, so every CI edit threw the
          # whole entry away. `pyproject.toml` stays because maturin reads the profile and feature
          # selection from it and rust-cache does not read that file.
          rust-cache-key: >-
            python-wheel-py${{ matrix.python-version }}-${{ env.MATURIN_PROFILE }}-
            ${{ hashFiles('python/pyproject.toml') }}
          rust-cache-workspaces: . -> target/py${{ matrix.python-version }}
          rust-cache-on-failure: "false"
          rust-cache-save-if: ${{ env.SAVE_BUILD_CACHES }}
          rust-cache-workspace-crates: "true"

      - name: Update version in pyproject.toml
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
        run: |
          bash ../scripts/ci/update-pyproject-version.sh

      # Temporary: fail fast on rare runner worktree corruption while we isolate the root cause
      - name: Verify immutable CI inputs (pre-wheel build)
        run: bash scripts/ci/verify-ci-inputs.sh pre-wheel-build

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --profile "$MATURIN_PROFILE" --out ../dist

      - name: Run Python tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/test-wheel.bash

      - name: Restore generated stubs Rust cache
        if: >-
          matrix.python-version == '3.13' &&
          needs.plan.outputs.run-generated-drift == 'true' &&
          runner.environment == 'github-hosted'
        # https://github.com/Swatinem/rust-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target/py-stubs
          cache-on-failure: "false"
          cache-workspace-crates: "true"
          # The same prefix common-setup gives every other rust-cache step: `make py-stubs` builds
          # under the compile environment in build-env.mk, which rust-cache cannot see.
          prefix-key: v0-rust-${{ hashFiles('build-env.mk') }}
          env-vars: CAPNP
          # A literal, for the reason already recorded on `rust tests` below: rust-cache derives
          # the rest of the key itself, so naming compile inputs here can only lose entries.
          # This key hashed `build.yml`, `Cargo.lock` and the `Makefile`, three files that change
          # with almost every CI or dependency edit, and the result is that the entry never came
          # back. Runs 35413952045 and 35438818832 both logged `No cache found.` here and then
          # compiled 595 crates into `target/py-stubs` from scratch -- 1460s and 1493s, the
          # largest single step in the gate. The wheel cache in this same job hashes only
          # `python/pyproject.toml` and does restore.
          key: py-stubs
          save-if: ${{ env.SAVE_BUILD_CACHES }}

      - name: Check generated file drift
        # Keep this 3.13 condition in sync with the matrix so drift is checked once per run.
        if: >-
          matrix.python-version == '3.13' &&
          needs.plan.outputs.run-generated-drift == 'true'
        env:
          TARGET_DIR: >-
            ${{ (runner.environment == 'github-hosted'
            || github.event_name == 'pull_request'
            && needs.plan.outputs.untrusted_pr != 'false')
            && format('{0}/target/py-stubs', github.workspace)
            || '/home/runner/.cache/cargo-target/py-stubs' }}
        run: |
          make py-stubs
          bash scripts/ci/check-generated-drift.bash

      - name: Upload wheel artifact
        uses: ./.github/actions/upload-artifact-wheel
        with:
          retention-days: ${{ github.ref_name == 'master' && '7' || '1' }}

  rust-doctests-linux-x86:
    if: >
      github.ref != 'refs/heads/test-pre-commit' &&
      needs.plan.outputs.run-tests == 'true' &&
      (needs.plan.outputs.run-rust-tests == 'true' ||
       needs.plan.outputs.publish_r2 == 'true' ||
       github.ref == 'refs/heads/master')
    name: rust doctests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 801s over its last 11 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 27
    needs:
      - plan
    env:
      CARGO_CI_PROFILE: >-
        ${{ (github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.ref_name == 'main' || github.ref_name == 'test-ci')
        && 'ci-pr' || 'nextest' }}
      CARGO_TARGET_DIR: target/rust-tests-linux-x86
      RUST_BACKTRACE: 1
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # Twice this job's slowest successful Common setup (5 minutes at least): 107s over its last 11 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 5
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          rust-cache-enabled: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          # This names the shared target directory and nothing else. rust-cache derives the rest
          # of the key itself -- `rustc -vV`, every CARGO_/RUST_ variable, the toolchain file, the
          # Cargo manifests and the lockfile -- and appends `GITHUB_JOB`, so a cache entry is
          # always scoped to one job whatever this string says. Naming compile inputs here can
          # therefore only lose entries, never share them: the earlier value also hashed this
          # workflow, the setup action, the nextest config and the Makefile, so an edit to a
          # trigger or a make target invalidated every Rust entry at once. On 2026-09-17 seven
          # main commits did that, four of them CI changes, and each cold run then pushed a fresh
          # multi-GB entry that evicted the rest of the 10 GB quota. Optimising CI made CI slower.
          rust-cache-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      - name: Run Rust doctests
        run: >-
          make cargo-test-doc
          EXTRA_FEATURES="capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres"

      - name: Report disk space after Rust doctests
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after Rust doctests"

  rust-tests-linux-x86:
    if: >
      github.ref != 'refs/heads/test-pre-commit' &&
      needs.plan.outputs.run-tests == 'true' &&
      (needs.plan.outputs.run-rust-tests == 'true' ||
       needs.plan.outputs.publish_r2 == 'true' ||
       github.ref == 'refs/heads/master')
    name: rust tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # Twice this job's slowest successful run: 3228s over its last 10 successful runs (2026-09-24).
    # A hang anywhere in the job stops here rather than at GitHub's six-hour default. Re-measure
    # and raise it once the job routinely takes half of it.
    timeout-minutes: 108
    needs:
      - plan
    env:
      # [DO NOT MERGE] experiment: the commit main's current rust-tests cache was built from.
      VIBE_SOURCE_COMMIT_WHEN_UNRECORDED: a67eeacbe18ec831a86631c0ab1b1bd774972704
      # `rust-cache` folds every CARGO_* and RUST_* variable into its key, so a job stating a
      # different profile or target directory than the run that saved the cache can never restore
      # it. Same-repository pull requests used to state `nextest` and an out-of-workspace target
      # directory, and paid a cold workspace build for it every time: run 35305461586 logged
      # `No cache found.` and spent 40 of its 51 minutes compiling, while the 3.8 GB entry `main`
      # saved sat unread under the profile `main` states. Say what `main` says and the entry is
      # readable. This adds no entry of its own: pull requests still never save, because a cache a
      # pull request writes is scoped to its own ref and would cost 3.8 GB per open pull request
      # against a 10 GB quota.
      CARGO_CI_PROFILE: >-
        ${{ (github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.ref_name == 'main' || github.ref_name == 'test-ci')
        && 'ci-pr'
        || 'nextest' }}
      CARGO_TARGET_DIR: >-
        ${{ (github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.ref_name == 'main' || github.ref_name == 'test-ci')
        && 'target/rust-tests-linux-x86'
        || '/home/runner/.cache/cargo-target/rust-tests-linux-x86' }}
      # yamllint disable-line rule:line-length
      RUST_TEST_EXTRA_FEATURES: capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,vibe-strategy-factory/sealed-develop-composer-acceptance
      RUST_BACKTRACE: 1
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    # yamllint disable rule:line-length
    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: vibe
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d vibe" --health-interval 10s --health-timeout 5s --health-retries
          5
    # yamllint enable rule:line-length
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # Twice this job's slowest successful Common setup: 1233s over its last 10 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 42
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          # Measured on three pull request runs (35994104295, 36001760102, 35974183716): a hosted
          # runner had 86G free before any cleanup, and this job then took about 54G - about 35G of
          # restored cache and 19G of build and test output - so without the cleanup it ends with
          # about 32G free. At 110 the cleanup ran on every runner and took 226-303s of the critical
          # path. At 70 it is skipped on such a runner and still runs on any that starts below 70.
          # Re-measure if the job's own use nears 60G.
          minimum-free-space-gb: "70"
          rust-cache-enabled: >-
            ${{ (runner.environment == 'github-hosted'
            || github.event_name == 'push'
            && (github.ref_name == 'main' || github.ref_name == 'test-ci'))
            && 'true' || 'false' }}
          # `shared-key`, not `key`: rust-cache appends `GITHUB_JOB` to `key`, so the two jobs
          # that build into this directory would each get their own multi-GB entry. This job is
          # the only one that builds the whole workspace and the only one that saves, so its
          # entry is the superset the others restore.
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: ${{ env.SAVE_BUILD_CACHES }}
          rust-cache-workspace-crates: "true"
          rust-cache-source-mtimes: "true"

      # The tests are uniformly small (26353 of them averaging 88ms, one single `slow`), so this
      # job reads the whole machine rather than the `ci` profile's `test-threads = 2`, which came
      # in with the #180 naming baseline, inherited rather than measured. `NEXTEST_TEST_THREADS`
      # is set here rather than in `.config/nextest.toml` so the Postgres chain jobs, `dst.yml`
      # and `performance.yml`, which share the `ci` profile, keep the parallelism they were
      # verified at. The `serial-tests` and `large-data-tests` groups still hold their members to
      # one thread. Cargo's build parallelism needs no step: its default is the vCPU count.
      - name: Use the whole runner for the critical-path job
        if: runner.environment == 'github-hosted'
        run: echo "NEXTEST_TEST_THREADS=4" >> "$GITHUB_ENV"

      - name: Install Vibe CLI
        env:
          VIBE_CLI_FORCE_SOURCE: "1"
        run: bash scripts/ci/install-nautilus-cli.sh

      - name: Init postgres schema
        run: vibe database init --schema ${{ github.workspace }}/schema/sql
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DATABASE: vibe

      - name: Cached test data
        uses: ./.github/actions/common-test-data

      - name: Report disk space before Rust tests
        run: bash scripts/ci/report-disk-space.bash "before Rust tests"

      - name: Run Rust tests
        id: rust-tests
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: >-
          make cargo-test NEXTEST_PROFILE=ci
          EXTRA_FEATURES="${RUST_TEST_EXTRA_FEATURES}"

      # `cargo nextest run` rewrites junit.xml, and the proofs below are a second invocation, so
      # this copy has to happen between them or only the proofs survive. `always()`: a failing run
      # is the one whose record matters most.
      #
      # The path is workspace-relative and deliberately does not use CARGO_TARGET_DIR: nextest's
      # store directory is `<workspace>/target/nextest` whatever CARGO_TARGET_DIR says. Measured -
      # with CARGO_TARGET_DIR pointed elsewhere, `cargo metadata` follows it and the record does
      # not. Guessing the other way is what made run 35558496598 fail.
      - name: Keep the workspace test record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p junit
          cp target/nextest/ci/junit.xml junit/workspace.xml

      # Deliberately not captured: `test-toolchain-proofs.bash` loops, running one
      # `cargo nextest run` per proof, so a single junit.xml holds the last proof and would look
      # like a record of all of them. It prints `--- <proof>` per iteration instead, which is what
      # the Owner chain does and is why the chain publishes no record either.
      - name: Run the toolchain proofs
        # These are `#[ignore]`, so `make cargo-test` never selects them. They need the pinned
        # wasm target this job already installs, or Docker, and no database.
        #
        # They report whether or not the step above passed. They share nothing with it, and a proof
        # that only speaks when its neighbour succeeds is one an unrelated failure can silence.
        if: ${{ !cancelled() }}
        run: make cargo-test-toolchain-proofs NEXTEST_PROFILE=ci

      - name: Publish which tests ran
        if: always()
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-record-linux-x86
          path: junit/
          if-no-files-found: error
          retention-days: 7

      - name: Report disk space after workspace Rust tests
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after workspace Rust tests"

      - name: Report disk space after Rust tests
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after Rust tests"

  postgres-owner-chains-linux-x86:
    if: >
      github.ref != 'refs/heads/test-pre-commit' &&
      needs.plan.outputs.run-tests == 'true' &&
      (needs.plan.outputs.run-rust-tests == 'true' ||
       needs.plan.outputs.publish_r2 == 'true' ||
       github.ref == 'refs/heads/master')
    name: ${{ matrix.chain.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.chain.job-timeout-minutes }}
    needs:
      - plan
    strategy:
      fail-fast: false
      matrix:
        chain:
          - key: rd-owner
            name: rd owner postgres (ubuntu-22.04)
            # Common setup: the slowest each part of it took across 45 rd/md chain jobs (2026-09-24) -
            # freeing disk 915s, rust-cache 340s, everything else 59s - is 1314s together; 30 minutes
            # leaves room above that. Freeing disk is bimodal: 42 jobs took 116-341s and 3 took
            # 839-915s on slow runners, so a sample without one of those reads far too low (this was
            # 18 and 28 minutes, and cut #979's setup at 18). Re-measure the parts, not the total,
            # and raise it once any of them routinely nears half of it.
            setup-timeout-minutes: 30
            step-timeout-minutes: 70
            # Above the step limits added together (30 + 70) and the short steps around them, so a
            # step timeout, which keeps its log, fires before the job limit, which does not.
            job-timeout-minutes: 105
            make: >-
              cargo-test-rd-owner-postgres-isolated NEXTEST_PROFILE=ci
              EXTRA_FEATURES="${RUST_TEST_EXTRA_FEATURES}"
          - key: market-data
            name: market data owner postgres (ubuntu-22.04)
            # Common setup: the slowest each part of it took across 45 rd/md chain jobs (2026-09-24) -
            # freeing disk 915s, rust-cache 340s, everything else 59s - is 1314s together; 30 minutes
            # leaves room above that. Freeing disk is bimodal: 42 jobs took 116-341s and 3 took
            # 839-915s on slow runners, so a sample without one of those reads far too low (this was
            # 18 and 28 minutes, and cut #979's setup at 18). Re-measure the parts, not the total,
            # and raise it once any of them routinely nears half of it.
            setup-timeout-minutes: 30
            step-timeout-minutes: 15
            # Above the step limits added together (30 + 15) and the short steps around them, so a
            # step timeout, which keeps its log, fires before the job limit, which does not.
            job-timeout-minutes: 50
            make: cargo-test-market-data-owner-postgres-isolated
    env:
      # Byte-identical to `rust tests`, deliberately: rust-cache folds every CARGO_/RUST_
      # variable into the key, so a different profile or target directory here would defeat the
      # shared entry below however the key is spelled.
      CARGO_CI_PROFILE: >-
        ${{ (github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.ref_name == 'main' || github.ref_name == 'test-ci')
        && 'ci-pr' || 'nextest' }}
      CARGO_TARGET_DIR: >-
        ${{ (github.event_name == 'pull_request'
        || github.event_name == 'merge_group'
        || github.ref_name == 'main' || github.ref_name == 'test-ci')
        && 'target/rust-tests-linux-x86'
        || '/home/runner/.cache/cargo-target/rust-tests-linux-x86' }}
      # yamllint disable-line rule:line-length
      RUST_TEST_EXTRA_FEATURES: capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,vibe-strategy-factory/sealed-develop-composer-acceptance
      RUST_BACKTRACE: 1
      VIBE_TEST_DATA_BASE_URL: ${{ vars.VIBE_TEST_DATA_BASE_URL }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        timeout-minutes: ${{ matrix.chain.setup-timeout-minutes }}
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          # The chains need far less room than the whole-workspace `rust tests` build this 110 was copied
          # from: measured on main 4a3013c12 (owner-chains run 35964493641), a hosted runner had 86G free
          # before any cleanup, and the rd chain's restored cache plus the chain itself took about 12G (md
          # about 5G). At 40 the cleanup is skipped on such a runner - it took 116-915s, 213s typically -
          # and still runs on any runner that starts below 40. Re-measure if a chain's use nears 20G.
          minimum-free-space-gb: "40"
          rust-cache-enabled: >-
            ${{ (runner.environment == 'github-hosted'
            || github.event_name == 'push'
            && (github.ref_name == 'main' || github.ref_name == 'test-ci'))
            && 'true' || 'false' }}
          # These chains build a different selection from `rust tests` -- five packages under the
          # sealed Owner features rather than the whole workspace -- into the same target
          # directory, so `rust tests`'s entry is a superset of what they need. `key` could not
          # deliver it: rust-cache appends `GITHUB_JOB`, so run 35414461628 logged `No cache
          # found.` here and compiled 473 crates from scratch, 26 minutes, on the gate's
          # second-longest job. `shared-key` drops that job component. The job still does not
          # save, so the quota still holds one copy of this directory, not three.
          rust-cache-shared-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "true"

      # Entry 28 of the R&D chain drives the Dashboard strategy viewer in a real browser only when
      # these inputs are present, and reports PASS in a few milliseconds when they are not. Without
      # this step `build`'s chain job and `owner-chains` were not interchangeable evidence, which is
      # what AGENTS.md says they are. The Market Data leg has no browser to drive.
      - name: Install the sealed Dashboard browser acceptance inputs
        if: matrix.chain.key == 'rd-owner'
        uses: ./.github/actions/dashboard-browser-acceptance
        with:
          acceptance-candidate: ${{ github.sha }}

      - name: Report disk space before the chain
        run: bash scripts/ci/report-disk-space.bash "before ${{ matrix.chain.key }}"

      # The step and job ceilings are about twice what these chains take, measured on the successful
      # runs of build.yml and owner-chains.yml between 2026-09-19 and 2026-09-23: the R&D chain step
      # took median 32.8, p90 39.8, max 44.2 minutes over 66 runs (job max 48.5); the Market Data
      # step median 4.7, max 6.4 over 76 (job max 17.4). Without them a hung chain held the runner
      # until cancelled by hand, and a cancelled job keeps neither log nor artifact (run 35900267592).
      # The step ceiling fires first so the `always()` upload below still runs; the job ceiling is
      # the last resort. Each entry also has its own wall clock in the chain script.
      # These expire: the chain keeps growing (101 entries on 2026-09-24). When the rolling p90 of the
      # R&D step passes 55 minutes, or the Market Data step's passes 10, re-measure the same way and
      # raise both ceilings to about twice the new figures.
      - name: Run the isolated PostgreSQL Owner chain
        timeout-minutes: ${{ matrix.chain.step-timeout-minutes }}
        run: make ${{ matrix.chain.make }}

      # `if: always()`: the run that ends at an entry is the one whose record answers the most.
      # `if-no-files-found: error` because an empty upload would say "no entry ran" in the same
      # shape as "the copy broke".
      # Only the R&D leg writes these: `test-rd-owner-postgres.bash` takes the per-entry copies,
      # and the Market Data chain has its own script that does not. Without the leg condition this
      # step runs on both, finds nothing on the Market Data leg, and `if-no-files-found: error`
      # turns that into a failed job - which is exactly what it did on run 35688437514.
      - name: Publish which chain entries ran
        if: always() && matrix.chain.key == 'rd-owner'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-record-${{ matrix.chain.key }}
          path: target/nextest/chain-records/
          if-no-files-found: error
          retention-days: 7

      # A Market Data proof that ran past its wall clock leaves a record naming it
      # (run_market_data_owner_postgres.bash); a run with none leaves nothing to publish.
      - name: Publish which Market Data proof timed out
        if: always() && matrix.chain.key == 'market-data'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-record-${{ matrix.chain.key }}
          path: target/nextest/market-data-records/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Dashboard browser acceptance inputs
        if: always() && matrix.chain.key == 'rd-owner'
        run: |
          find product/dashboard/.next -depth -delete 2>/dev/null || true
          find product/dashboard/node_modules -depth -delete 2>/dev/null || true
          find "${RUNNER_TEMP}/dashboard-strategy-viewer-chrome" -depth -delete 2>/dev/null || true

      - name: Report disk space after the chain
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after ${{ matrix.chain.key }}"

  quality:
    name: quality
    # `always()`, because this job exists to read the others' results and must run when they failed.
    # The second half is what every other job here already carries, and this was the one job without
    # it: on a run that ready-gate did not admit as full, every job it aggregates is skipped, so it
    # aggregated nothing and reported that nothing as a failure.
    #
    # A pull request opened as a draft is the documented way to open one, so that run happens on
    # essentially every pull request. Its `quality` fails in about three and a half minutes - the
    # jobs it waits on are skipped, so there is nothing to wait for - while the run that matters
    # takes the better part of an hour. For all of that hour the pull request shows a red `quality`
    # that is not about the code. On 2026-09-22 two different sessions read that red on two
    # different pull requests and acted on it; both were wrong, and neither had any way to tell.
    #
    # Skipped, not passed. A skipped check and a failed one are different, and so are a skipped one
    # and a green one: reporting success here would trade a false red for a false green, which is
    # worse than what it replaces.
    if: always() && needs.ready-gate.outputs.run-full == 'true'
    needs:
      - ready-gate
      - plan
      - pre-commit
      - build
      - rust-doctests-linux-x86
      - rust-tests-linux-x86
      - postgres-owner-chains-linux-x86
    runs-on: ubuntu-22.04
    steps:
      - name: Verify required build graph
        env:
          READY_GATE_RESULT: ${{ needs.ready-gate.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUST_DOCTESTS_RESULT: ${{ needs.rust-doctests-linux-x86.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests-linux-x86.result }}
          POSTGRES_CHAINS_RESULT: ${{ needs.postgres-owner-chains-linux-x86.result }}
          RUN_TESTS: ${{ needs.plan.outputs.run-tests }}
          RUN_RUST_TESTS: ${{ needs.plan.outputs.run-rust-tests }}
          RUN_GENERATED_DRIFT: ${{ needs.plan.outputs.run-generated-drift }}
          PUBLISH_R2: ${{ needs.plan.outputs.publish_r2 }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$READY_GATE_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$PRE_COMMIT_RESULT" = success
          if [[ "$RUN_TESTS" == true ]]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
          if [[ "$RUN_GENERATED_DRIFT" == true ]]; then
            test "$RUN_TESTS" = true
          fi
          if [[ "$REF" != refs/heads/test-pre-commit ]] &&
             [[ "$RUN_TESTS" == true ]] &&
             { [[ "$RUN_RUST_TESTS" == true ]] ||
               [[ "$PUBLISH_R2" == true ]] ||
               [[ "$REF_NAME" == master ]]; }; then
            test "$RUST_TESTS_RESULT" = success
            test "$RUST_DOCTESTS_RESULT" = success
