name: services-rust-mcp

# Each of the three Rust domain MCP servers is its own Cargo workspace, with its own Cargo.lock,
# excluded from the root workspace (Cargo.toml's `exclude`). The root `rust tests`/`cargo clippy`
# jobs never see them, so each gets its own fmt/clippy/test here instead, the same way
# video-note-mcp.yml covers the one Python MCP.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/services-rust-mcp.yml
      - .pre-commit-config.yaml
      - services/market-data-mcp/**
      - services/strategy-authoring-mcp/**
      - services/backtest-mcp/**
  push:
    branches: [main]
    paths:
      - .github/workflows/services-rust-mcp.yml
      - .pre-commit-config.yaml
      - services/market-data-mcp/**
      - services/strategy-authoring-mcp/**
      - services/backtest-mcp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-rust-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [market-data-mcp, strategy-authoring-mcp, backtest-mcp]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Toolchain channel comes from the repository root's rust-toolchain.toml, which rustup finds
      # by walking up from this directory; no separate toolchain step is needed.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check service Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          --config ../../.markdownlint.jsonc
          README.md
