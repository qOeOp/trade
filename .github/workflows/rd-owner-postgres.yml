name: rd-owner-postgres

permissions:
  contents: read

on:
  workflow_call:
  # No `push:` trigger. `owner-chains.yml` runs the same
  # `cargo-test-rd-owner-postgres-isolated` target on `test-chain/**`, and two more targets beside
  # it, so a second branch-triggered channel bought a duplicate forty-minute run and nothing else.
  #
  # The file stays because the channel is not all it is. `scripts/ci/test-rd-owner-postgres.bash`
  # pins the `RUST_TEST_EXTRA_FEATURES` block below verbatim and fails closed without it, while
  # `owner-chains.yml` declares a strictly smaller set. Deleting this workflow would take the
  # declaration along with the channel and leave nothing checking that union.
  workflow_dispatch:

concurrency:
  group: >-
    ${{ format('rd-owner-postgres-{0}',
    github.event.pull_request.number || format('{0}-{1}', github.ref_name, github.sha)) }}
  cancel-in-progress: true

env:
  AUDIT_PR: >-
    ${{ github.repository == 'qOeOp/trade'
    || github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository) }}
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/rd-owner-postgres
  RUST_TEST_EXTRA_FEATURES: >-
    capnp,hypersync,vibe-serialization/sbe,vibe-infrastructure/postgres,
    vibe-strategy-factory/sealed-develop-composer-acceptance,
    vibe-strategy-factory-rd-owner-api/sealed-source-intake-acceptance,
    vibe-strategy-factory-rd-owner-api/sealed-artifact-source-browser-acceptance,
    vibe-strategy-factory-rd-owner-api/sealed-source-intake-composer-acceptance

jobs:
  rd-owner-postgres:
    name: R&D Owner PostgreSQL isolated tests
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        # Twice this job's slowest successful Common setup: 483s over its last 15 successful
        # runs (2026-09-24). A hung setup then fails as this step and keeps its log, instead of running
        # to the job limit and being cancelled with none. Re-measure and raise it once setup
        # routinely takes half of it.
        timeout-minutes: 17
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: test
          free-disk-space: "true"
          free-disk-space-max-build: "true"
          minimum-free-space-gb: "110"
          rust-cache-enabled: "false"
          uv-cache-enabled: "false"
          prek-cache-enabled: "false"
          capnp-cache-enabled: "false"
          rust-cache-save-if: "false"
          rust-cache-workspace-crates: "false"

      - name: Install the sealed Dashboard browser acceptance inputs
        uses: ./.github/actions/dashboard-browser-acceptance
        with:
          acceptance-candidate: ${{ github.sha }}

      - name: Report disk space before Rust tests
        run: bash scripts/ci/report-disk-space.bash "before Rust tests"

      # The same ceiling as the R&D leg of build.yml and owner-chains.yml; the measurement is there.
      - name: Run isolated R&D Owner PostgreSQL tests
        timeout-minutes: 70
        run: >-
          make cargo-test-rd-owner-postgres-isolated NEXTEST_PROFILE=ci
          EXTRA_FEATURES="${RUST_TEST_EXTRA_FEATURES}"

      - name: Clean Dashboard browser acceptance inputs
        if: always()
        run: |
          find product/dashboard/.next -depth -delete 2>/dev/null || true
          find product/dashboard/node_modules -depth -delete 2>/dev/null || true
          find "${RUNNER_TEMP}/dashboard-strategy-viewer-chrome" -depth -delete 2>/dev/null || true

      - name: Report disk space after Rust tests
        if: always()
        run: df -h || true
