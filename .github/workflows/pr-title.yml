name: pr-title

# The branch ruleset requires the `pr-title` check context; this job's own check run satisfies it,
# so the title is validated once per event and nothing is published to the status API.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# One group per pull request: a newer event cancels the older run.
concurrency:
  group: pr-title-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: pr-title
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate the pull request title
        env:
          # The title reaches the shell as an environment variable, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validate-pr-title.sh "$PR_TITLE"
