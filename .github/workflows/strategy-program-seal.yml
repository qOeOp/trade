name: strategy-program-seal

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  seal:
    name: seal and attest complex strategy program (linux arm64)
    if: >-
      github.repository == 'qOeOp/trade' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04-arm
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Seal exact complex strategy program
        run: |
          set -euo pipefail
          bash crates/strategy_factory/tools/seal-program.sh \
            crates/strategy_factory/programs/complex/strategy-program-project-v1.jcs \
            strategy-program-seal-product \
            crates/strategy_factory/tools/program-seal.dockerfile
          cmp strategy-program-seal-product/source-capsule.tar \
            crates/strategy_factory/assets/program_complex_v1/source-capsule.tar
          cmp strategy-program-seal-product/build-recipe.jcs \
            crates/strategy_factory/assets/program_complex_v1/build-recipe.jcs
          cmp strategy-program-seal-product/program.first.wasm \
            crates/strategy_factory/assets/program_complex_v1/program.first.wasm
          cmp strategy-program-seal-product/program.second.wasm \
            crates/strategy_factory/assets/program_complex_v1/program.second.wasm
          test "$(find strategy-program-seal-product -mindepth 1 -maxdepth 1 \
            -type f | wc -l)" -eq 4
          test -z "$(find strategy-program-seal-product -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)"
          tar --sort=name --mtime='@1' --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            -cf strategy-program-seal.tar -C strategy-program-seal-product .

      - name: Attest strategy program seal provenance
        id: attest-program-seal
        uses: ./.github/actions/attest-build-provenance-retry
        with:
          subject-path: strategy-program-seal.tar

      - name: Verify strategy program seal attestation online
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          ATTESTATION_ISSUER: https://token.actions.githubusercontent.com
          ATTESTATION_PREDICATE_TYPE: https://slsa.dev/provenance/v1
          ATTESTATION_DENY_SELF_HOSTED_RUNNERS: "true"
          ATTESTATION_SIGNER_DIGEST: ${{ github.sha }}
          ATTESTATION_SOURCE_DIGEST: ${{ github.sha }}
          ATTESTATION_SOURCE_REF: refs/heads/main
        run: bash ./scripts/ci/verify-gh-attestations.bash strategy-program-seal.tar

      - name: Stage exact program seal and attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-program-seal.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/strategy-program-seal
          cp strategy-program-seal.tar dist/strategy-program-seal/
          cp "$BUNDLE_PATH" dist/strategy-program-seal/strategy-program-seal.sigstore

      - name: Upload custodied strategy program seal
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-program-seal-${{ github.sha }}-wasm32v1-none
          path: dist/strategy-program-seal
          if-no-files-found: error
          retention-days: 30
