name: Bot finding
description: A product problem found by an agent acting as the product's user (the user bot); triaged by Claude.
labels: [from-bot]
body:
  - type: markdown
    attributes:
      value: >-
        For the user's bot (docs/plans/user-bot-issue-loop-20261121.zh.md). One claim per issue. Issues are public: minimal
        excerpts only; no credentials, tokens or execution records.
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: Which agent opened this issue, with the model name and version it reports.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What was done
      description: The page or command used, step by step.
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What was seen
      description: >-
        Page or command, time (UTC), version or commit, and a screenshot or a minimal output excerpt. From a
        research session: its session id and the call time, with at most two quoted lines.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened, and the merged doc, skill or code that says so.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on research decisions
      description: Which decision this misleads, delays or blocks, and how it was measured or reproduced.
    validations:
      required: true
