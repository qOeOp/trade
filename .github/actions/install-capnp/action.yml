name: install-capnp
description: Install Cap'n Proto compiler on Linux

inputs:
  cache-enabled:
    description: Whether to restore and save the Cap'n Proto compiler cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set Cap'n Proto install prefix
      shell: bash
      run: |
        echo "CAPNP_PREFIX=$GITHUB_WORKSPACE/.cache/capnp" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/.cache/capnp/bin" >> "$GITHUB_PATH"

    - name: Get Linux version
      id: linux-version
      shell: bash
      run: echo "release=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"

    - name: Get Cap'n Proto version
      shell: bash
      run: echo "CAPNP_VERSION=$(bash scripts/tool-version.sh capnp)" >> "$GITHUB_ENV"

    - name: Cache Cap'n Proto
      if: inputs.cache-enabled == 'true'
      id: cache-capnp
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.cache/capnp
        key: capnp-linux-${{ steps.linux-version.outputs.release }}-${{ env.CAPNP_VERSION }}-${{ runner.arch }}

    - name: Install Cap'n Proto
      shell: bash
      run: bash scripts/install-capnp.sh
