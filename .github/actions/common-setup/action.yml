name: common-setup
description: Common Linux quality environment setup

inputs:
  python-version:
    description: The Python version to setup
    required: true
  free-disk-space:
    description: Free disk space
    required: false
    default: "false"
  free-disk-space-max-build:
    description: Remove additional tools unused by large Linux build jobs
    required: false
    default: "false"
  rust-cache-key:
    description: Extra rust-cache key material to partition cache entries
    required: false
    default: ""
  rust-cache-workspaces:
    description: Optional rust-cache workspace mapping
    required: false
    default: ""
  rust-cache-on-failure:
    description: Whether to save the Rust cache when the job fails
    required: false
    default: "true"
  rust-cache-save-if:
    description: Whether to save the Rust cache
    required: false
    default: "true"
  rust-cache-enabled:
    description: Whether to invoke the Rust cache
    required: false
    default: "true"
  uv-cache-enabled:
    description: Whether to persist the uv cache
    required: false
    default: "auto"
  capnp-cache-enabled:
    description: Whether to restore and save the Cap'n Proto compiler cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      env:
        MAX_BUILD: ${{ inputs.free-disk-space-max-build }}
      run: |
        args="--android --dotnet --docker-images --swap-storage --tool-cache --haskell --large-packages --extra"
        if [ "$MAX_BUILD" = "true" ]; then
          args="$args --max-build"
        fi
        bash scripts/ci/free-disk-space.bash $args

    - name: Install runner dependencies
      shell: bash
      run: |
        sudo apt-get update -o Acquire::Retries=5
        sudo apt-get install -y curl clang lld git make pkg-config ripgrep -o Acquire::Retries=5
        sudo apt-get install -y python3-dev libpython3-dev -o Acquire::Retries=5
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Install Cap'n Proto
      uses: ./.github/actions/install-capnp
      with:
        cache-enabled: ${{ inputs.capnp-cache-enabled }}

    - name: Get Rust toolchain version
      shell: bash
      run: |
        TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
        echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ env.TOOLCHAIN }}
        components: clippy,rustfmt
        cache: false
        override: true

    - name: Rust cache
      if: inputs.rust-cache-enabled == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: ${{ inputs.rust-cache-workspaces || '. -> target' }}
        cache-on-failure: ${{ inputs.rust-cache-on-failure }}
        key: ${{ inputs.rust-cache-key }}
        save-if: ${{ inputs.rust-cache-save-if }}

    - name: Get cargo-nextest version
      shell: bash
      run: |
        version="$(bash scripts/cargo-tool-version.sh cargo-nextest)"
        if [ -z "$version" ]; then
          echo "::error::Failed to extract cargo-nextest version"
          exit 1
        fi
        echo "CARGO_NEXTEST_VERSION=$version" >> "$GITHUB_ENV"

    - name: Install cargo-nextest
      uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
      with:
        tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

    - name: Set CARGO_INCREMENTAL=0 for CI
      shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    - name: Set up Python environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Ensure local bin on PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Get cache scope
      shell: bash
      env:
        CACHE_SCOPE: ${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}
      run: echo "CACHE_SCOPE=$CACHE_SCOPE" >> "$GITHUB_ENV"

    - name: Get uv version
      shell: bash
      run: echo "UV_VERSION=$(bash scripts/uv-version.sh)" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: >-
          ${{ inputs.uv-cache-enabled == 'auto'
          && runner.os == 'macOS'
          && 'false'
          || inputs.uv-cache-enabled }}
        cache-suffix: ${{ env.CACHE_SCOPE }}-uv-${{ env.UV_VERSION }}
        prune-cache: true

    - name: Set uv cache directory
      shell: bash
      run: echo "UV_CACHE_DIR=$(uv cache dir)" >> "$GITHUB_ENV"

    - name: Prune uv cache
      shell: bash
      run: uv cache prune --ci

    - name: Report cache footprint
      shell: bash
      run: |-
        {
          echo "## Cache footprint"
          echo
          echo '```'
          df -h "$HOME" 2>/dev/null || df -h /
          echo
          for path in \
            "$HOME/.cache/uv" \
            "$HOME/.cache/cargo-target" \
            "$HOME/.cargo/registry" \
            "$HOME/.cargo/git"; do
            [ -d "$path" ] && du -sh "$path" 2>/dev/null || true
          done
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
