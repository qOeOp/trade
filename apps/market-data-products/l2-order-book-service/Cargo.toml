[package]
name = "trade-l2-order-book-service"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "l2-order-book-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
prost = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
trade-l2-order-book-core = { path = "../l2-order-book-core" }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
