syntax = "proto3";

package trade.l2.v1;

service L2OrderBook {
  rpc GetCurrentBook(BookRequest) returns (BookSnapshot);
  rpc WatchBook(WatchRequest) returns (stream BookWatermark);
  rpc GetHealth(HealthRequest) returns (HealthSnapshot);
}

message BookRequest {
  string symbol = 1;
  uint32 depth = 2;
}

message WatchRequest {
  string symbol = 1;
}

message HealthRequest {
  string symbol = 1;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
}

message BookSnapshot {
  string schema_version = 1;
  string symbol = 2;
  string stream_epoch = 3;
  uint64 last_update_id = 4;
  uint64 exchange_event_time_ms = 5;
  uint64 exchange_transaction_time_ms = 6;
  uint64 local_receive_time_ms = 7;
  uint64 published_at_ms = 8;
  uint64 freshness_ms = 9;
  string continuity_status = 10;
  string book_hash = 11;
  repeated PriceLevel bids = 12;
  repeated PriceLevel asks = 13;
}

message BookWatermark {
  string schema_version = 1;
  string symbol = 2;
  string stream_epoch = 3;
  uint64 last_update_id = 4;
  uint64 local_receive_time_ms = 5;
  uint64 published_at_ms = 6;
  string continuity_status = 7;
  bool resync_required = 8;
}

message HealthSnapshot {
  string schema_version = 1;
  string symbol = 2;
  string service_status = 3;
  string stream_epoch = 4;
  string continuity_status = 5;
  bool source_ready = 6;
  bool raw_writer_ready = 7;
  bool projector_ready = 8;
  bool read_ready = 9;
  bool broker_enabled = 10;
  bool broker_ready = 11;
  uint64 last_update_id = 12;
  uint64 last_receive_time_ms = 13;
  uint64 freshness_ms = 14;
  uint64 incident_count = 15;
  string last_incident = 16;
}
