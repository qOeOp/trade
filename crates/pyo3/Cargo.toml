[package]
name = "vibe-pyo3"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for the Vibe trading engine"
repository.workspace = true
publish = false # Internal extension crate

[lints]
workspace = true

[lib]
name = "vibe_pyo3"
crate-type = ["rlib", "cdylib"]

[features]
default = []
arrow = [
  "vibe-deribit/arrow",
  "vibe-hyperliquid/arrow",
  "vibe-serialization/arrow",
]
betfair = ["dep:vibe-betfair", "vibe-betfair/python"]
defi = [
  "dep:vibe-blockchain",
  "vibe-backtest/defi",
  "vibe-blockchain/python",
]
extension-module = [
  "vibe-analysis/extension-module",
  "vibe-architect-ax/extension-module",
  "vibe-backtest/extension-module",
  "vibe-betfair?/extension-module",
  "vibe-binance/extension-module",
  "vibe-bitmex/extension-module",
  "vibe-coinbase/extension-module",
  "vibe-blockchain?/extension-module",
  "vibe-bybit/extension-module",
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-cryptography/extension-module",
  "vibe-data/extension-module",
  "vibe-databento/extension-module",
  "vibe-deribit/extension-module",
  "vibe-derive/extension-module",
  "vibe-dydx/extension-module",
  "vibe-execution/extension-module",
  "vibe-hyperliquid/extension-module",
  "vibe-indicators/extension-module",
  "vibe-infrastructure/extension-module",
  "vibe-interactive-brokers/extension-module",
  "vibe-kraken/extension-module",
  "vibe-lighter/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-okx/extension-module",
  "vibe-portfolio/extension-module",
  "vibe-polymarket/extension-module",
  "vibe-sandbox/extension-module",
  "vibe-persistence/extension-module",
  "vibe-risk/extension-module",
  "vibe-serialization/extension-module",
  "vibe-tardis/extension-module",
  "vibe-testkit/extension-module",
  "vibe-trading/extension-module",
  "pyo3/extension-module",
]
high-precision = [
  "vibe-model/high-precision",
  "vibe-serialization/high-precision",
  "vibe-testkit/high-precision",
  "vibe-betfair?/high-precision",
  "vibe-binance/high-precision",
  "vibe-bitmex/high-precision",
  "vibe-coinbase/high-precision",
  "vibe-bybit/high-precision",
  "vibe-databento/high-precision",
  "vibe-deribit/high-precision",
  "vibe-derive/high-precision",
  "vibe-dydx/high-precision",
  "vibe-hyperliquid/high-precision",
  "vibe-kraken/high-precision",
  "vibe-lighter/high-precision",
  "vibe-okx/high-precision",
  "vibe-polymarket/high-precision",
  "vibe-sandbox/high-precision",
  "vibe-tardis/high-precision",
]
hypersync = ["defi", "vibe-blockchain/hypersync"]
mimalloc = ["dep:mimalloc"]
postgres = ["vibe-infrastructure/postgres"]
redis = ["vibe-infrastructure/redis"]
tracing-bridge = ["vibe-common/tracing-bridge"]
[dependencies]
vibe-analysis = { workspace = true, features = ["python"] }
vibe-backtest = { workspace = true, features = ["python", "examples"] }
vibe-common = { workspace = true, features = ["python"] }
vibe-core = { workspace = true, features = ["python"] }
vibe-cryptography = { workspace = true, features = ["python"] }
vibe-data = { workspace = true, features = ["python"] }
vibe-execution = { workspace = true, features = ["python"] }
vibe-indicators = { workspace = true, features = ["python"] }
vibe-infrastructure = { workspace = true, features = ["python"] }
vibe-live = { workspace = true, features = [
  "python",
  "examples",
  "plugin",
] }
vibe-model = { workspace = true, features = ["python"] }
vibe-network = { workspace = true, features = [
  "python",
  "transport-sockudo",
] }
vibe-persistence = { workspace = true, features = ["python"] }
vibe-portfolio = { workspace = true, features = ["python"] }
vibe-risk = { workspace = true, features = ["python"] }
vibe-serialization = { workspace = true, features = ["python"] }
vibe-system = { workspace = true, features = ["python"] }
vibe-testkit = { workspace = true, default-features = false, features = [
  "python",
] }
vibe-trading = { workspace = true, features = ["python"] }

# Adapters
vibe-architect-ax = { workspace = true, features = ["python"] }
vibe-betfair = { workspace = true, optional = true }
vibe-binance = { workspace = true, features = ["python"] }
vibe-bitmex = { workspace = true, features = ["python"] }
vibe-blockchain = { workspace = true, features = [
  "python",
], optional = true }
vibe-bybit = { workspace = true, features = ["python"] }
vibe-coinbase = { workspace = true, features = ["python"] }
vibe-databento = { workspace = true, features = ["python", "live"] }
vibe-deribit = { workspace = true, features = ["python"] }
vibe-derive = { workspace = true, features = ["python"] }
vibe-dydx = { workspace = true, features = ["python"] }
vibe-hyperliquid = { workspace = true, features = ["python"] }
vibe-interactive-brokers = { workspace = true, features = ["python"] }
vibe-kraken = { workspace = true, features = ["python"] }
vibe-lighter = { workspace = true, features = ["python"] }
vibe-okx = { workspace = true, features = ["python"] }
vibe-polymarket = { workspace = true, features = ["python"] }
vibe-sandbox = { workspace = true, features = ["python"] }
vibe-tardis = { workspace = true, features = ["python", "replay"] }

# local_dynamic_tls avoids exhausting static TLS space when the extension is dlopen'd
mimalloc = { workspace = true, features = [
  "local_dynamic_tls",
], optional = true }
pyo3 = { workspace = true }
pyo3-stub-gen = { workspace = true }

# Run with `cargo run --bin python-stub-gen`
[[bin]]
name = "python-stub-gen"
path = "bin/stub_gen.rs"
doc = false
test = false
