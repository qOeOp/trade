[package]
name = "vibe-indicators-kernel"
version = "0.62.0"
edition = "2024"
rust-version = "1.97.1"
license = "LGPL-3.0-or-later"
publish = false
description = "Pure no_std numerical kernels shared by native wrappers and portable consumers"
repository = "https://github.com/qOeOp/trade"

[package.metadata.portable-no-std]
portable = true

[lib]
path = "src/lib.rs"

[dependencies]
libm = { version = "0.2.16", default-features = false }

[dev-dependencies]
rstest = "0.26.1"
