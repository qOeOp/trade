[package]
name = "vibe-cli"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Command-line interface for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
defi = ["dep:vibe-blockchain", "vibe-model/defi"]
[dependencies]
vibe-common = { workspace = true }
vibe-core = { workspace = true }
vibe-infrastructure = { workspace = true, features = ["postgres"] }
vibe-model = { workspace = true }

vibe-blockchain = { workspace = true, features = [
  "hypersync",
], optional = true }

anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
log = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[[bin]]
name = "vibe"
path = "src/bin/cli.rs"
doc = false
test = false
