[package]
name = "vibe-backtest-owner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Caller-unforgeable Backtest Replay V2 owner carriers"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
vibe-backtest-owner-contracts = { workspace = true }
vibe-backtest-result-custody = { workspace = true }
vibe-data = { workspace = true }
vibe-strategy-factory = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true }
trybuild = { workspace = true }
# The ordered PostgreSQL gate binds protected V3 Results to the Market Data sealed-acceptance
# Shared Time chain, and this crate takes the feature only for its tests.
# Measured on main at 2026-09-19: every enabler is a test or gate path - CI's
# `RUST_TEST_EXTRA_FEATURES`, the Makefile's chain feature set, the ordered chain script, and the
# toolchain proofs - and no deployed binary enables it. That last part is recent rather than
# permanent: #646 removed `dashboard-composer-readback` from the Dashboard read API, which until
# then did enable it in the image. Re-measure before repeating the claim.
vibe-data = { workspace = true, features = [
  "sealed-strategy-input-acceptance",
] }
vibe-testkit = { workspace = true, features = ["postgres"] }
