[package]
name = "vibe-strategy-factory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Owner-local Strategy Factory product boundary"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# The production half of the composer-backed Replay: the COMPOSER_V3 commit, its tables and
# migration, and every read that recognizes a COMPOSER_V3 Replay. It carries no acceptance
# fixture or sealed corpus; the acceptance feature below includes it rather than owning it.
composer-v3-replay = []
sealed-develop-composer-acceptance = ["sealed-strategy-input-acceptance"]
sealed-artifact-source-acceptance = []
sealed-source-intake-acceptance = []
sealed-source-intake-research-acceptance = ["sealed-source-intake-acceptance"]
sealed-source-intake-composer-acceptance = [
  "composer-v3-replay",
  "sealed-source-intake-research-acceptance",
  "sealed-develop-composer-acceptance",
  "vibe-product-edge/sealed-deployment-acceptance",
]
sealed-strategy-input-acceptance = [
  "vibe-data/sealed-strategy-input-acceptance",
]
isolated-event-replay-acceptance = [
  "sealed-strategy-input-acceptance",
  "vibe-data/isolated-event-replay-acceptance",
]

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
statrs = { workspace = true }
strategy-factory-program-sdk = { path = "programs/sdk" }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vibe-analysis = { workspace = true }
vibe-backtest = { workspace = true, features = ["streaming"] }
vibe-backtest-owner-contracts = { workspace = true }
vibe-backtest-result-custody = { workspace = true }
vibe-binance = { workspace = true }
vibe-common = { workspace = true }
vibe-core = { workspace = true }
vibe-data = { workspace = true }
vibe-deployment-attestation = { workspace = true }
vibe-execution = { workspace = true }
vibe-fred = { workspace = true }
vibe-indicators-kernel = { workspace = true }
vibe-market-data-repair-custody = { workspace = true }
# `stubs` in a normal dependency is the one exception production builds carry: the legacy formation
# path builds its instrument from `vibe_model::instruments::stubs::currency_pair_btcusdt`
# (`src/application.rs`). R&D has ruled that path retired; this goes with it.
# scripts/ci/check-production-features.py allows this edge and no other.
vibe-model = { workspace = true, features = ["stubs"] }
vibe-persistence = { workspace = true }
vibe-portfolio = { workspace = true }
vibe-postgres-connect = { workspace = true }
vibe-product-edge = { workspace = true }
vibe-qualification = { workspace = true }
vibe-rd-artifact-invocation-custody = { workspace = true }
vibe-rd-exploratory-replay-custody = { workspace = true }
vibe-rd-market-data-repair-custody = { workspace = true }
vibe-rd-source-intake-invocation-custody = { workspace = true }
vibe-risk = { workspace = true }
vibe-scheduled-events = { workspace = true }
vibe-trading = { workspace = true }
wasmi = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tracing-subscriber = { workspace = true }
vibe-operator-authorization = { workspace = true }
vibe-portfolio = { workspace = true }
# The deployment fixture, so a test can put its request proof through Source Intake's own check.
vibe-product-edge = { workspace = true, features = [
  "sealed-deployment-acceptance",
] }
vibe-qualification = { workspace = true, features = [
  "ready-lineage-acceptance",
] }
vibe-testkit = { workspace = true, features = ["postgres"] }
vibe-trading = { workspace = true, features = ["examples"] }

[[bin]]
name = "strategy-factory-author-role-intent"
path = "src/bin/author_role_intent.rs"
doc = false
test = false

[[bin]]
name = "strategy-factory-formation"
path = "src/bin/strategy_factory_formation.rs"
doc = false
test = false

[[bin]]
name = "strategy-factory-rd-build-sandbox"
path = "src/bin/strategy_factory_rd_build_sandbox.rs"
doc = false
test = false

[[bin]]
name = "replay-policy-catalog-sealed-fixture"
path = "src/bin/replay_policy_catalog_sealed_fixture.rs"
required-features = ["sealed-source-intake-composer-acceptance"]
doc = false
test = false
