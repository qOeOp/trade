[package]
name = "vibe-strategy-factory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Owner-local Strategy Factory product boundary"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
sealed-develop-composer-acceptance = ["sealed-strategy-input-acceptance"]
sealed-source-intake-acceptance = []
sealed-source-intake-research-acceptance = ["sealed-source-intake-acceptance"]
sealed-source-intake-composer-acceptance = [
  "sealed-source-intake-research-acceptance",
  "sealed-develop-composer-acceptance",
  "dep:vibe-testkit",
]
sealed-strategy-input-acceptance = [
  "vibe-data/sealed-strategy-input-acceptance",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
statrs = { workspace = true }
strategy-factory-program-sdk = { path = "programs/sdk" }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
vibe-analysis = { workspace = true }
vibe-backtest = { workspace = true, features = ["streaming"] }
vibe-backtest-owner-contracts = { workspace = true }
vibe-backtest-result-custody = { workspace = true }
vibe-binance = { workspace = true }
vibe-common = { workspace = true }
vibe-core = { workspace = true }
vibe-data = { workspace = true }
vibe-deployment-attestation = { workspace = true }
vibe-fred = { workspace = true }
vibe-model = { workspace = true }
vibe-persistence = { workspace = true }
vibe-product-edge = { workspace = true }
vibe-qualification = { workspace = true }
vibe-rd-artifact-invocation-custody = { workspace = true }
vibe-rd-exploratory-replay-custody = { workspace = true }
vibe-rd-source-intake-invocation-custody = { workspace = true }
vibe-scheduled-events = { workspace = true }
vibe-testkit = { workspace = true, features = ["postgres"], optional = true }
vibe-trading = { workspace = true }
wasmi = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
vibe-operator-authorization = { workspace = true }
vibe-portfolio = { workspace = true }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "strategy-factory-formation"
path = "src/bin/strategy_factory_formation.rs"
doc = false
test = false

[[bin]]
name = "strategy-factory-rd-build-sandbox"
path = "src/bin/strategy_factory_rd_build_sandbox.rs"
doc = false
test = false

[[bin]]
name = "replay-policy-catalog-sealed-fixture"
path = "src/bin/replay_policy_catalog_sealed_fixture.rs"
required-features = ["sealed-source-intake-composer-acceptance"]
doc = false
test = false

[[bin]]
name = "source-research-composer-stored-tamper-probe"
path = "src/bin/source_research_composer_stored_tamper_probe.rs"
required-features = ["sealed-source-intake-composer-acceptance"]
doc = false
test = false
