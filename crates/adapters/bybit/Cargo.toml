[package]
name = "vibe-bybit"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Bybit exchange integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_bybit"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = [
  "vibe-live/node",
  "vibe-network/transport-sockudo",
  "vibe-trading/examples",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "python",
  "pyo3/extension-module",
]
high-precision = ["vibe-model/high-precision"]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }

# Run with `cargo bench -p vibe-bybit --bench websocket`
[[bench]]
name = "websocket"
harness = false

# Run with `cargo run -p vibe-bybit --bin bybit-http`.
[[bin]]
name = "bybit-http"
path = "bin/http.rs"
doc = false
test = false

# Run with `cargo run -p vibe-bybit --bin bybit-ws-data`.
[[bin]]
name = "bybit-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

# Run with `cargo run -p vibe-bybit --bin bybit-flatten`.
[[bin]]
name = "bybit-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# Run with `cargo run --example bybit-data-tester --package vibe-bybit --features examples`.
[[example]]
name = "bybit-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bybit-exec-tester --package vibe-bybit --features examples`.
[[example]]
name = "bybit-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bybit-greeks-tester --package vibe-bybit --features examples`.
[[example]]
name = "bybit-greeks-tester"
path = "examples/node_greeks.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bybit-option-chain --package vibe-bybit --features examples`.
[[example]]
name = "bybit-option-chain"
path = "examples/node_option_chain.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bybit-delta-neutral --package vibe-bybit --features examples`.
[[example]]
name = "bybit-delta-neutral"
path = "examples/node_delta_neutral.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
