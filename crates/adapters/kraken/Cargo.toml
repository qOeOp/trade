[package]
name = "vibe-kraken"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Kraken Pro exchange integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_kraken"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = [
  "dep:vibe-backtest",
  "dep:vibe-tardis",
  "vibe-live/node",
  "vibe-network/transport-sockudo",
  "vibe-trading/examples",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]
high-precision = ["vibe-model/high-precision"]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

vibe-backtest = { workspace = true, optional = true }
vibe-tardis = { workspace = true, optional = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
toml = { workspace = true }

# Run with `cargo bench -p vibe-kraken --bench websocket`
[[bench]]
name = "websocket"
harness = false

[[bin]]
name = "kraken-http-spot-raw"
path = "bin/http_spot_raw.rs"
doc = false
test = false

[[bin]]
name = "kraken-http-spot-public"
path = "bin/http_spot_public.rs"
doc = false
test = false

[[bin]]
name = "kraken-ws-spot-data"
path = "bin/ws_spot_data.rs"
doc = false
test = false

# Run with `cargo run -p vibe-kraken --example kraken-data-tester --features examples`
[[example]]
name = "kraken-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p vibe-kraken --example kraken-exec-tester --features examples`
[[example]]
name = "kraken-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p vibe-kraken --features examples --example kraken-hurst-vpin-backtest --release`
[[example]]
name = "kraken-hurst-vpin-backtest"
path = "examples/engine_hurst_vpin_backtest.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p vibe-kraken --features examples --example kraken-hurst-vpin-live`
[[example]]
name = "kraken-hurst-vpin-live"
path = "examples/node_hurst_vpin_live.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
