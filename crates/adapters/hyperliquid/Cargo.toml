[package]
name = "vibe-hyperliquid"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Hyperliquid integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_hyperliquid"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
arrow = ["dep:arrow", "vibe-serialization"]
examples = ["vibe-live/node", "vibe-network/transport-sockudo"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
high-precision = [
  "vibe-model/high-precision",
  "vibe-serialization?/high-precision",
]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-persistence-macros = { workspace = true }
vibe-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rmp-serde = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

arrow = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-persistence = { workspace = true }
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "signing"
harness = false

[[bench]]
name = "data"
harness = false

[[bench]]
name = "exec"
harness = false

[[bench]]
name = "micros"
harness = false

[[bin]]
name = "hyperliquid-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-ws-exec"
path = "bin/ws_exec.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-exec"
path = "bin/http_exec.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-user-outcome"
path = "bin/http_user_outcome.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-outcome-order"
path = "bin/http_outcome_order.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-capture-test-data"
path = "bin/capture_test_data.rs"
doc = false
test = false

# Run with `cargo run -p vibe-hyperliquid --bin hyperliquid-flatten`.
[[bin]]
name = "hyperliquid-flatten"
path = "bin/flatten.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-builder-fee-approve"
path = "bin/builder_fee_approve.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-builder-fee-revoke"
path = "bin/builder_fee_revoke.rs"
doc = false
test = false

# Run with `cargo run --example hyperliquid-data-tester --package vibe-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-exec-tester --package vibe-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-outcome-exec-tester --package vibe-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-outcome-exec-tester"
path = "examples/node_outcome_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-chained-modify-smoke --package vibe-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-chained-modify-smoke"
path = "examples/chained_modify_smoke.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
