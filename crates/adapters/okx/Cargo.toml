[package]
name = "vibe-okx"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "OKX exchange integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_okx"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
high-precision = ["vibe-model/high-precision"]
examples = [
  "vibe-live/node",
  "vibe-network/transport-sockudo",
  "vibe-trading/examples",
]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = { workspace = true }

# Canonical benches; see crates/adapters/okx/benches/BENCHMARKS.md for context
[[bench]]
name = "data"
harness = false

[[bench]]
name = "exec"
harness = false

[[bench]]
name = "micros"
harness = false

[[bench]]
name = "signing"
harness = false

[[bin]]
name = "okx-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "okx-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[bin]]
name = "okx-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "okx-ws-exec"
path = "bin/ws_exec.rs"
doc = false
test = false

# Run with `cargo run -p vibe-okx --bin okx-flatten`.
[[bin]]
name = "okx-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# Run with `cargo run --example okx-data-tester --package vibe-okx --features examples`.
[[example]]
name = "okx-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-greeks-tester --package vibe-okx --features examples`.
[[example]]
name = "okx-greeks-tester"
path = "examples/node_greeks.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-exec-tester --package vibe-okx --features examples`.
[[example]]
name = "okx-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-delta-neutral --package vibe-okx --features examples`.
[[example]]
name = "okx-delta-neutral"
path = "examples/node_delta_neutral.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
