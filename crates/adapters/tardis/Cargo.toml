[package]
name = "vibe-tardis"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Tardis integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_tardis"
crate-type = ["rlib"]

[features]
default = ["replay", "high-precision"]
examples = ["vibe-live/node"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-serialization/extension-module",
  "pyo3/extension-module",
  "python",
  "replay",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-serialization/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
  "replay",
]
replay = []
high-precision = [
  "vibe-model/high-precision",
  "vibe-serialization/high-precision",
]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-persistence = { workspace = true }
vibe-serialization = { workspace = true, features = ["arrow"] }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
csv = { workspace = true }
derive_builder = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parquet = { workspace = true, features = ["snap", "zstd"] }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ryu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
vibe-live = { workspace = true }
vibe-testkit = { workspace = true, default-features = false, features = [
  "datasets",
  "testers",
] }

[[bench]]
name = "messages"
harness = false

[[bin]]
name = "tardis-csv"
path = "bin/example_csv.rs"
doc = false
test = false

[[bin]]
name = "tardis-http"
path = "bin/example_http.rs"
doc = false
test = false

[[bin]]
name = "tardis-replay"
path = "bin/example_replay.rs"
required-features = ["replay"]
doc = false
test = false

# Run with `cargo run --bin stream_deltas_bench --profile bench`
[[bin]]
name = "stream_deltas_bench"
path = "bin/stream_deltas_bench.rs"
doc = false
test = false

# Run with `cargo run --example tardis-data-tester -p vibe-tardis --features examples`
[[example]]
name = "tardis-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
