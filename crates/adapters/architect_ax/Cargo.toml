[package]
name = "vibe-architect-ax"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "AX Exchange integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_architect_ax"
crate-type = ["rlib"]

[features]
default = []
examples = ["vibe-live/node", "vibe-network/transport-sockudo"]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]

[package.metadata.cargo-machete]
ignored = ["vibe-system"] # Optional dep activated only via the python feature
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }

# cargo bench -p vibe-architect-ax --bench deserialization
[[bench]]
name = "deserialization"
path = "benches/deserialization.rs"
harness = false

# cargo bench -p vibe-architect-ax --bench parsing
[[bench]]
name = "parsing"
path = "benches/parsing.rs"
harness = false

# cargo run -p vibe-architect-ax --bin ax-http-public
[[bin]]
name = "ax-http-public"
path = "bin/http_public.rs"
doc = false
test = false

# cargo run -p vibe-architect-ax --bin ax-ws-data
[[bin]]
name = "ax-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

# cargo run -p vibe-architect-ax --bin ax-ws-orders
[[bin]]
name = "ax-ws-orders"
path = "bin/ws_orders.rs"
doc = false
test = false

# cargo run -p vibe-architect-ax --bin ax-flatten
[[bin]]
name = "ax-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# cargo run --example ax-data-tester -p vibe-architect-ax --features examples
[[example]]
name = "ax-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# cargo run --example ax-exec-tester -p vibe-architect-ax --features examples
[[example]]
name = "ax-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false
