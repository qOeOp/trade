[package]
name = "vibe-betfair"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Betfair exchange integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_betfair"
crate-type = ["rlib"]

[features]
examples = ["vibe-live/node", "vibe-trading/examples"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]
high-precision = [
  "vibe-model/high-precision",
  "vibe-serialization/high-precision",
]
python = [
  "dep:vibe-system",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-stub-gen",
]

[package.metadata.cargo-machete]
ignored = ["arrow"] # Used by `custom_data` macro expansion
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-persistence-macros = { workspace = true }
vibe-serialization = { workspace = true, features = ["arrow"] }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true } # Used by `custom_data` macro expansion (cargo-machete false positive)
async-trait = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
bzip2 = { workspace = true }
flate2 = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-backtest = { workspace = true }
vibe-execution = { workspace = true }
vibe-live = { workspace = true, features = ["node"] }
vibe-portfolio = { workspace = true }
vibe-risk = { workspace = true }
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
dotenvy = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }

# Run with `cargo run -p vibe-betfair --example betfair-data-tester --features examples`
[[example]]
name = "betfair-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p vibe-betfair --example betfair-exec-tester --features examples`
[[example]]
name = "betfair-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p vibe-betfair --example betfair-load-file`
[[example]]
name = "betfair-load-file"
path = "examples/load_betfair_file.rs"
doc = false

# Run with `cargo run -p vibe-betfair --features examples --example betfair-backtest`
[[example]]
name = "betfair-backtest"
path = "examples/betfair_backtest.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
