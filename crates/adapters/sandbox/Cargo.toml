[package]
name = "vibe-sandbox"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Sandbox execution adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_sandbox"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-execution/extension-module",
  "vibe-model/extension-module",
  "python",
  "pyo3/extension-module",
]
python = [
  "vibe-common/python",
  "vibe-core/python",
  "vibe-execution/python",
  "vibe-model/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["vibe-model/high-precision"]
example-databento = [
  "dep:vibe-databento",
  "dep:vibe-live",
  "dep:dotenvy",
  "vibe-live/node",
]
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-execution = { workspace = true }
vibe-model = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
ustr = { workspace = true }

vibe-databento = { workspace = true, features = ["live"], optional = true }
vibe-live = { workspace = true, optional = true }

dotenvy = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-data = { workspace = true }
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

rstest = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[[example]]
name = "databento-cme-sandbox"
path = "examples/databento_cme.rs"
required-features = ["example-databento"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
