[package]
name = "vibe-coinbase"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Coinbase Advanced Trade integration adapter for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_coinbase"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "vibe-common/extension-module",
  "vibe-core/extension-module",
  "vibe-live/extension-module",
  "vibe-model/extension-module",
  "vibe-network/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:vibe-system",
  "vibe-common/python",
  "vibe-core/python",
  "vibe-live/python",
  "vibe-model/python",
  "vibe-network/python",
  "vibe-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["vibe-model/high-precision"]
examples = [
  "vibe-live/node",
  "vibe-network/transport-sockudo",
  "vibe-trading/examples",
]

[package.metadata.cargo-machete]
ignored = [
  "vibe-system",
] # Optional dep activated only via the python feature
[dependencies]
vibe-common = { workspace = true, features = ["live"] }
vibe-core = { workspace = true }
vibe-live = { workspace = true }
vibe-model = { workspace = true }
vibe-network = { workspace = true }
vibe-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
pem = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
vibe-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
vibe-trading = { workspace = true }

axum = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
rstest = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "coinbase-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "coinbase-cancel-all-open"
path = "bin/cancel_all_open.rs"
doc = false
test = false

[[bin]]
name = "coinbase-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[example]]
name = "coinbase-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "coinbase-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
