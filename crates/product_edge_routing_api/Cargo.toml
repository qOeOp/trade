[package]
name = "vibe-product-edge-routing-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Product Edge operation routing read port over HTTP"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vibe-product-edge = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true }
vibe-product-edge = { workspace = true, features = [
  "sealed-deployment-acceptance",
] }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "product-edge-routing-read-api"
path = "src/main.rs"
doc = false
test = false
