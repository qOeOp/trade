[package]
name = "vibe-portfolio"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Portfolio components and functionality for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_portfolio"
crate-type = ["rlib"]

[features]
default = []
extension-module = ["python", "pyo3/extension-module"]
python = [
  "vibe-analysis/python",
  "vibe-common/python",
  "vibe-model/python",
  "pyo3",
  "pyo3-stub-gen",
]
[dependencies]
vibe-analysis = { workspace = true }
vibe-common = { workspace = true }
vibe-core = { workspace = true }
vibe-model = { workspace = true, features = ["stubs"] }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

ahash = { workspace = true }
bon = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "portfolio"
path = "benches/portfolio.rs"
harness = false
