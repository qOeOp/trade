path = "src/bin/replay_policy_catalog_owner_readback.rs"
doc = false
test = false

[[bin]]
name = "replay-policy-catalog-command-seal"
path = "src/bin/replay_policy_catalog_command_seal.rs"
doc = false
test = false

[[bin]]
name = "deployment-store-publication-author"
path = "src/bin/deployment_store_publication_author.rs"
doc = false
test = false

[[bin]]
name = "deployment-store-publication-seal"
path = "src/bin/deployment_store_publication_seal.rs"
doc = false
test = false

[[bin]]
name = "deployment-store-publication-publish"
path = "src/bin/deployment_store_publication_publish.rs"
