[package]
name = "vibe-strategy-factory-rd-owner-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Composition API for R&D Owner and Product Edge"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Production surfaces that no deployed image carries yet; adding one to the image is a deployment
# decision (docs/owners/rd.md, "deployed service"). None of them carries an acceptance fixture, sealed
# corpus or acceptance route: the sealed features below include them rather than own them.
# The Composer's resolve and readback, and the Replay composition and execution-input-binding
# issuance over the production Composer's sealed read port.
composer-replay-issuance = []
# The COMPOSER_V3 Replay commit route, and the Owner half behind it.
composer-v3-replay = [
  "composer-replay-issuance",
  "vibe-strategy-factory/composer-v3-replay",
]
# The Native Replay execution route (`POST /v2/exploratory-replays`) and its service, which write
# the Backtest Owner's run result, and Market Data repair. A production surface with no acceptance
# fixture, corpus or route; the image does not build it until the Native Replay cut-over.
native-replay-execution = [
  "composer-replay-issuance",
  "vibe-strategy-factory/native-replay-execution",
]
sealed-artifact-source-browser-acceptance = [
  "vibe-strategy-factory/sealed-artifact-source-acceptance",
]
sealed-source-intake-acceptance = [
  "vibe-strategy-factory/sealed-develop-composer-acceptance",
  "vibe-strategy-factory/sealed-source-intake-acceptance",
  "vibe-strategy-factory/sealed-source-intake-research-acceptance",
]
sealed-source-intake-composer-acceptance = [
  "composer-v3-replay",
  "sealed-source-intake-acceptance",
  "sealed-develop-composer-acceptance",
  "vibe-strategy-factory/sealed-source-intake-composer-acceptance",
  "vibe-product-edge/sealed-deployment-acceptance",
]
sealed-develop-composer-acceptance = [
  "native-replay-execution",
  "vibe-strategy-factory/sealed-develop-composer-acceptance",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vibe-backtest-owner = { workspace = true }
vibe-backtest-owner-contracts = { workspace = true }
vibe-binance = { workspace = true }
vibe-core = { workspace = true }
vibe-data = { workspace = true }
vibe-databento = { workspace = true }
vibe-postgres-connect = { workspace = true }
vibe-product-edge = { workspace = true }
vibe-strategy-factory = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
# The first COMPOSER_V3 Replay oracle's exact decimal arithmetic.
rust_decimal = { workspace = true }
tower = { workspace = true }
vibe-backtest-result-custody = { workspace = true }
# The chain fixture's instrument constant, shared with the Market Data fixtures it names.
vibe-data = { workspace = true, features = [
  "sealed-strategy-input-acceptance",
] }
vibe-operator-authorization = { workspace = true }
vibe-product-edge-routing-api = { workspace = true }
vibe-rd-artifact-invocation-custody = { workspace = true }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "strategy-factory-rd-owner-api"
path = "src/main.rs"
doc = false
test = false

[[bin]]
name = "strategy-factory-rd-dashboard-read-api"
