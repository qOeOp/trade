[package]
name = "vibe-strategy-factory-rd-owner-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Composition API for R&D Owner and Product Edge"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
sealed-artifact-source-browser-acceptance = [
  "vibe-strategy-factory/sealed-artifact-source-acceptance",
]
sealed-source-intake-acceptance = [
  "vibe-strategy-factory/sealed-develop-composer-acceptance",
  "vibe-strategy-factory/sealed-source-intake-acceptance",
  "vibe-strategy-factory/sealed-source-intake-research-acceptance",
]
sealed-source-intake-composer-acceptance = [
  "sealed-source-intake-acceptance",
  "sealed-develop-composer-acceptance",
  "vibe-strategy-factory/sealed-source-intake-composer-acceptance",
]
sealed-develop-composer-acceptance = [
  "vibe-strategy-factory/sealed-develop-composer-acceptance",
]
dashboard-composer-readback = [
  "vibe-strategy-factory/sealed-source-intake-composer-acceptance",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vibe-backtest-owner-contracts = { workspace = true }
vibe-backtest-owner = { workspace = true }
vibe-data = { workspace = true }
vibe-product-edge = { workspace = true }
vibe-strategy-factory = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tower = { workspace = true }
vibe-operator-authorization = { workspace = true }
vibe-rd-artifact-invocation-custody = { workspace = true }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "strategy-factory-rd-owner-api"
path = "src/main.rs"
doc = false
test = false

[[bin]]
name = "strategy-factory-rd-dashboard-read-api"
path = "src/bin/dashboard_read_api.rs"
doc = false
test = false

[[bin]]
name = "replay-policy-catalog-authority-bootstrap"
path = "src/bin/replay_policy_catalog_authority_bootstrap.rs"
doc = false
test = false

[[bin]]
name = "replay-policy-catalog-owner-readback"
path = "src/bin/replay_policy_catalog_owner_readback.rs"
doc = false
test = false

[[test]]
name = "rd_owner_api_main"
path = "src/main.rs"

[[test]]
name = "dashboard_read_api"
path = "src/bin/dashboard_read_api.rs"
