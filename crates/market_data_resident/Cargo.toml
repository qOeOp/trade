[package]
name = "vibe-market-data-resident"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Market Data's resident process: the REST recorder, archive verification and the settled-funding recorder, one scheduler (B6)"
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "market_data_resident"
path = "src/lib.rs"

[package.metadata.cargo-machete]
# Never imported: it exists only to request the `high-precision` feature (see the dependency's own
# comment below), which no code here reads directly - the conversions happen inside vibe-binance/
# vibe-data, already built against the feature this dependency turns on for them.
ignored = ["vibe-model"]

[dependencies]
vibe-binance = { workspace = true }
vibe-core = { workspace = true }
vibe-data = { workspace = true }
# `high-precision` is the product's precision (FIXED_PRECISION 16), a property of the product crate
# rather than of a build flag: every build of this crate and its dependents - local `cargo test -p`,
# CI, the Owner chain and the production images - converts and stores fixed-point values the same
# way. scripts/ci/check-production-features.py requires it of every production package that links
# vibe-model. This process links it only transitively (through vibe-binance/vibe-data), neither of
# which forces it on its own, so it is requested directly here.
vibe-model = { workspace = true, features = ["high-precision"] }

anyhow = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[[bin]]
name = "market-data-resident"
path = "src/main.rs"
doc = false
test = false
