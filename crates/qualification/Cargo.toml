[package]
name = "vibe-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Qualification Owner protected-feedback custody"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
owner-recovery = ["dep:tokio"]

[package.metadata.cargo-machete]
# Recovery-owned integration tests use this feature-gated isolation contract through CI.
ignored = ["vibe-testkit"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
vibe-backtest-owner-contracts = { path = "../backtest_owner_contracts" }
vibe-backtest-result-custody = { path = "../backtest_result_custody" }
vibe-data = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true }
# The ordered PostgreSQL gate drives the protected-evaluation terminal with the Market Data
# sealed-acceptance Shared Time chain, and this crate takes the feature only for its tests.
# Measured on main at 2026-09-19: every enabler is a test or gate path - CI's
# `RUST_TEST_EXTRA_FEATURES`, the Makefile's chain feature set, the ordered chain script, and the
# toolchain proofs - and no deployed binary enables it. That last part is recent rather than
# permanent: #646 removed `dashboard-composer-readback` from the Dashboard read API, which until
# then did enable it in the image. Re-measure before repeating the claim.
vibe-data = { workspace = true, features = [
  "sealed-strategy-input-acceptance",
] }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "qualification-owner-recovery"
path = "src/bin/qualification_owner_recovery.rs"
required-features = ["owner-recovery"]
doc = false
test = false
