[package]
name = "vibe-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Qualification Owner protected-feedback custody"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
owner-recovery = ["dep:tokio"]

[package.metadata.cargo-machete]
# Recovery-owned integration tests use this feature-gated isolation contract through CI.
ignored = ["vibe-testkit"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
vibe-backtest-owner-contracts = { path = "../backtest_owner_contracts" }
vibe-backtest-result-custody = { path = "../backtest_result_custody" }
vibe-data = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true }
# The ordered PostgreSQL gate drives the protected-evaluation terminal with the Market Data
# sealed-acceptance Shared Time chain. This crate takes the feature only for its tests. The feature
# itself is not test-only: the deployed Dashboard read API enables it through
# `dashboard-composer-readback`, which is deliberate and documented in vibe-strategy-factory.
vibe-data = { workspace = true, features = [
  "sealed-strategy-input-acceptance",
] }
vibe-testkit = { workspace = true, features = ["postgres"] }

[[bin]]
name = "qualification-owner-recovery"
path = "src/bin/qualification_owner_recovery.rs"
required-features = ["owner-recovery"]
doc = false
test = false
