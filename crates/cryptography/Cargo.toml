[package]
name = "vibe-cryptography"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Cryptographic primitives and management for the Vibe trading engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "vibe_cryptography"
crate-type = ["rlib"]

[features]
default = []
extension-module = [
  "vibe-core/extension-module",
  "python",
  "pyo3/extension-module",
]
python = ["vibe-core/python", "pyo3", "pyo3-stub-gen"]
[dependencies]
vibe-core = { workspace = true }

anyhow = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
log = { workspace = true }
pem = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
