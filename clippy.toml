cognitive-complexity-threshold = 10
allow-expect-in-tests = true
allow-unwrap-in-tests = true
disallowed-methods = [
  { path = "getrandom::fill", reason = "raw OS RNG bypasses DST seed control", replacement = "a cfg-gated DST RNG seam", allow-invalid = true },
  { path = "getrandom::u32", reason = "raw OS RNG bypasses DST seed control", replacement = "a cfg-gated DST RNG seam", allow-invalid = true },
  { path = "getrandom::u64", reason = "raw OS RNG bypasses DST seed control", replacement = "a cfg-gated DST RNG seam", allow-invalid = true },
  { path = "sqlx_core::pool::Pool::connect", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::Pool::connect_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::Pool::connect_lazy", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::Pool::connect_lazy_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::options::PoolOptions::connect", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::options::PoolOptions::connect_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::options::PoolOptions::connect_lazy", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::pool::options::PoolOptions::connect_lazy_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::connection::Connection::connect", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::connection::Connection::connect_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_core::connection::ConnectOptions::connect", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_postgres::listener::PgListener::connect", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
  { path = "sqlx_postgres::listener::PgListener::connect_with", reason = "a connection must state its TLS; sqlx falls back to Prefer, which accepts any certificate once a TLS backend is compiled in", replacement = "vibe_postgres_connect" },
]
disallowed-types = [
  { path = "tokio::task::LocalSet", reason = "LocalSet is not available under the madsim runtime", replacement = "vibe_common::live::dst::task::spawn_local", allow-invalid = true },
]
doc-valid-idents = [
  "BaseSwap",
  "BaseX",
  "BitMEX",
  "DataFusion",
  "DeFi",
  "HyperSync",
  "MessagePack",
  "VibeTrader",
  "PancakeSwap",
  "PascalCase",
  "PnL",
  "PnLs",
  "PostgreSQL",
  "PyO3",
  "SushiSwap",
  "SQLx",
  "..",
]
