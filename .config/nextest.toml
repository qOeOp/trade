[test-groups]
serial-tests = { max-threads = 1 }
large-data-tests = { max-threads = 1 }

[profile.default]
# Default settings

# Which tests ran is not recoverable from this job's log: `--status-level fail` prints nothing for a
# test that passes, so "the name is absent" reads the same whether it ran and passed or was never
# selected. JUnit records every test by name, pass or fail, and a machine can assert on it.
# Written to <CARGO_TARGET_DIR>/nextest/ci/junit.xml, and overwritten by each `cargo nextest run`,
# so a job with more than one invocation must copy the file out between them.
[profile.ci.junit]
path = "junit.xml"

[profile.ci]
# GitHub Actions runners have 4 vCPUs and 16GB RAM.
# Limit parallelism to avoid OOM kills from too many concurrent test processes.
test-threads = 2
# Kill hung tests after 10 minutes so the run fails fast with the test name,
# instead of stalling until the workflow timeout with no logs to attribute.
# Tests with a per-test slow-timeout override keep their own settings.
slow-timeout = { period = "120s", terminate-after = 5 }

# Required CI is fail-closed: a first failure must not become green on retry.
# This profile-specific override takes precedence over the local default override below.
[[profile.ci.overrides]]
filter = 'binary(websocket) | binary(data_client)'
retries = 0

# The trybuild compile-fail binaries compile a probe crate against the workspace inside the test
# process. On a cold cache that build alone took 5m45s (run 35340365433), so the 600s budget above,
# sized for tests averaging 88ms, killed one while the other 26425 passed. They get a budget of
# their own and run one at a time, so four such builds do not contend for the runner's four
# cores; the terminate stays so a hung build still fails with a name.
[[profile.ci.overrides]]
filter = 'binary(compile_fail)'
slow-timeout = { period = "300s", terminate-after = 4 }
test-group = 'serial-tests'

[[profile.default.overrides]]
filter = 'test(serial_tests)'
test-group = 'serial-tests'

[[profile.default.overrides]]
filter = 'test(test_order_book)'
slow-timeout = { period = "300s" }

# Tests that download large data files share the same target paths across binaries
[[profile.default.overrides]]
filter = 'binary(grid_mm_itch) | binary(backtest_node_itch) | binary(orderbook_integration) | binary(large_data) | binary(test_pinned_data_direct_session)'
test-group = 'large-data-tests'

# Websocket and data client tests can be flaky due to timing on low-spec runners
[[profile.default.overrides]]
filter = 'binary(websocket) | binary(data_client)'
retries = 3
