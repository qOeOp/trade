services:
  operator:
    profiles:
      - operator
    image: trade-runtime:${TRADE_IMAGE_TAG:-local}
    restart: always
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 256
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 1.0
    env_file:
      - ${TRADE_OPERATOR_SECRET_ENV_FILE:?set TRADE_OPERATOR_SECRET_ENV_FILE}
    environment:
      TRADE_ENVIRONMENT_ID: ${TRADE_ENVIRONMENT_ID:-runtime:primary}
    command:
      - bun
      - modules/orchestration-ops/operator-http/src/scripts/main.ts
      - --profile
      - profile/operator-http.json
    volumes:
      - trade-data:/app/data
      - trade-ops:/app/data/ops
      - trade-runtime-tmp:/app/tmp
      - trade-artifacts:/app/tmp/artifacts
      - trade-agent-artifacts:/app/data/artifacts/agent-runs
      - trade-panels:/app/tmp/panels
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch("http://127.0.0.1:8787/healthz");if(!r.ok)process.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
