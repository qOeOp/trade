name: trade-server

x-runtime-hardening: &runtime-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
  pids_limit: 512
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  runtime:
    <<: *runtime-hardening
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      args:
        BUN_VERSION: 1.3.13
        RUST_VERSION: 1.97.1
    image: trade-runtime:${TRADE_IMAGE_TAG:-local}
    restart: always
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - trade-data:/app/data
      - trade-l2:/app/data/l2
      - trade-runtime-tmp:/app/tmp
      - trade-artifacts:/app/tmp/artifacts
      - trade-panels:/app/tmp/panels
    healthcheck:
      test:
        - CMD
        - bun
        - modules/orchestration-ops/trade-flow/src/scripts/server-runtime-container-status.ts
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s

volumes:
  trade-data:
  trade-l2:
  trade-runtime-tmp:
  trade-artifacts:
  trade-panels:
