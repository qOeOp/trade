# The whole deployment, the same on a workstation and a server whose Docker engine is linux/arm64 or linux/amd64
# (.github/workflows/ide-image.yml, Dockerfile): docker compose -f deploy/compose.yaml
# up -d, then open http://127.0.0.1:8765/. Updating runs named services (README.md here, Updating).
# .env beside this file names TRADE_UID, TRADE_GID and TRADE_DATA, and the images by digest (README.md here,
# Image versions); the host directories are mounted at their own paths, since service.json, the profiles, backups and run
# directories name them (docs/plans/paper-compose-deployment.zh.md §4.3, ledger-compose-service.zh.md §4.2).
name: trade-ide

# Every service's log, kept to 30 MB: the engine's default json-file log grows without end.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-product: &product
  image: ${TRADE_SERVICE_IMAGE:?run deploy/images.py, README.md here}
  init: true
  user: "${TRADE_UID:?set TRADE_UID in .env}:${TRADE_GID:?set TRADE_GID in .env}"
  restart: unless-stopped
  logging: *logging

services:
  # The page and the chat service. They read ledger with the reader accounts only: the profiles below
  # name the reader-only service file ledger writes into trade-ledger-readers, never service.json.
  ide:
    image: ${TRADE_IDE_IMAGE:?run deploy/images.py, README.md here}
    init: true
    ports:
      - "127.0.0.1:${TRADE_IDE_PORT:-8765}:8765"
    environment:
      TRADE_DOLT_HOST: ledger
      PUBLISHED_PORT: ${TRADE_IDE_PORT:-8765}  # the page's allowed Host names this port
    configs:
      - source: ide-research
        target: /run/trade/ledgers/research.json
      - source: market
        target: /run/trade/ledgers/market.json
    volumes:
      # The chat service's agents (with their API keys) and threads.
      - trade-ide-agent:/data/agent
      - trade-ledger-readers:/run/trade/ledger-readers:ro
      - ${TRADE_DATA:?set TRADE_DATA in .env}/market:${TRADE_DATA}/market:ro
      # market-import's status file, for the status bar (its archive cache beside it is read by nothing).
      - trade-market-import:/run/trade/market-import:ro
    restart: unless-stopped
    # It starts without the ledger: on a deployment's first start the page is where the ledger gets set up.
    command: ["--paper=http://paper:8767", "--market-import=/run/trade/market-import/market-import/status.json",
              "--setup=http://ledger:8770"]
    logging: *logging

  # The Dolt service of the research ledger. On first start it bootstraps from the DoltHub repository
  # TRADE_RESEARCH_ORIGIN or the IDE's page names (an empty one starts a new ledger; later starts do not read it),
  # waiting on that page for what it lacks, so `up -d` waits until it is healthy before starting paper. The setup
  # port is reached only by ide. Dolt's memory grows with what it serves,
  # and the cap keeps the service from taking the memory of paper and
  # the other services: a service over it is killed and restarted.
  ledger:
    <<: *product
    mem_limit: ${TRADE_LEDGER_MEMORY:-40g}
    memswap_limit: ${TRADE_LEDGER_MEMORY:-40g}
    command:
      - python
      - -m
      - cli.main
      - ledger
      - service
      - run
      - --service-root=${TRADE_DATA:?set TRADE_DATA in .env}/dolt
      - --data-dir=/var/lib/trade-dolt
      - --backup-root=${TRADE_DATA}/dolt-backups
      - --credentials=/run/dolthub/.dolt
      - --research-origin=${TRADE_RESEARCH_ORIGIN:-}
      - --port=${TRADE_LEDGER_PORT:-13330}
      - --readers=/var/lib/trade-readers
      - --setup=ledger:8770
    environment:
      TRADE_LEDGER_HOME: ${TRADE_DATA}/ledgers
      HOME: /tmp
    ports:
      - "127.0.0.1:${TRADE_LEDGER_PORT:-13330}:${TRADE_LEDGER_PORT:-13330}"
    volumes:
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt
      - ${TRADE_DATA}/ledgers:${TRADE_DATA}/ledgers
      - ${TRADE_DATA}/dolt-backups:${TRADE_DATA}/dolt-backups
      - trade-dolt-data:/var/lib/trade-dolt
      # The reader-only service.json, written at every start, for containers that only read.
      - trade-ledger-readers:/var/lib/trade-readers
      # The DoltHub key, needed to bootstrap and to publish; nothing else sees it. Writable because a first start
      # makes one when this directory is empty; a directory holding anything (a `dolt login` ~/.dolt) is not written.
      - ${TRADE_DOLTHUB:-${TRADE_DATA}/dolthub}:/run/dolthub/.dolt
    healthcheck:
      test: ["CMD", "python", "-m", "cli.main", "ledger", "service", "check"]
      interval: 30s
      timeout: 30s
      retries: 3
      # A first start waits on the IDE's first-run page until a person names a DoltHub repository and adds a key,
      # then clones or publishes the ledger; `up -d` waits this long for it (README.md here, First start). The
      # first passing check ends the period, so a later start is healthy within seconds.
      start_period: 6h
      start_interval: 10s

  # The unattended import of Binance data (market/README.md, "Unattended upkeep"): bars of --bar-symbols daily,
  # metrics daily, aggTrades and quotes of --symbols monthly. The only writer of the market directory. It reaches
  # data.binance.vision and fapi.binance.com (bars). Unhealthy
  # while anything is stopped or lagging, or when its status is a day old (docs/plans/monthly-market-import.zh.md).
  market-import:
    <<: *product
    # TRADE_MARKET_ARGS in .env is this deployment's range, split by the shell (deploy/README.md); unset,
    # `market follow` refuses and the container keeps restarting rather than downloading a range nobody chose.
    command: ["sh", "-c", "exec python -m cli.main market follow --market /run/trade/market-import.json $$TRADE_MARKET_ARGS"]
    environment:
      TRADE_MARKET_ARGS: ${TRADE_MARKET_ARGS:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: market
        target: /run/trade/market-import.json
    volumes:
      - ${TRADE_DATA}/market:${TRADE_DATA}/market
      # The archive cache (about 3 GB of aggTrades a month, kept) and the status file, on a volume: a host
      # directory refuses the chmod of multiprocessing's forkserver socket (macOS bind mounts), and a new
      # volume mounted elsewhere belongs to root, which TRADE_UID cannot write.
      - trade-market-import:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "from market.follow import check; raise SystemExit(check())"]
      interval: 5m
      timeout: 30s
      retries: 1
      # The first round starts 5 minutes after start and may import a month of aggTrades.
      start_period: 3h
      start_interval: 30s

  # The paper daemon: the Paper panel's runs. Reached only by ide on the project network; reaches
  # Docker only through docker-api. It reads membership, stored bars and a reconciliation's replay inputs from
  # the market directory, mounted read-only (the config market).
  paper:
    <<: *product
    command: ["python", "-m", "cli.main", "paper", "serve", "--host", "0.0.0.0", "--allow-host", "paper:8767",
              "--market", "/run/trade/paper-market.json",
              "--runtime=${TRADE_RUNTIME_IMAGE:?run deploy/images.py, README.md here}"]
    configs:
      - source: market
        target: /run/trade/paper-market.json
    environment:
      TRADE_DOLT_HOST: ledger
      DOCKER_HOST: tcp://docker-api:2375
      TRADE_LEDGER_HOME: ${TRADE_DATA}/ledgers
      TMPDIR: ${TRADE_DATA}/paper-tmp
      HOME: ${TRADE_DATA}/paper-tmp
    volumes:
      - ${TRADE_DATA}/ledgers:${TRADE_DATA}/ledgers:ro
      # The service directory read-only, for service.json (its accounts): compose creates this container
      # before ledger has written the file, so the directory, not the file. Its home/ (the DoltHub key)
      # is covered; the run directory beneath is writable.
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt:ro
      - type: tmpfs
        target: ${TRADE_DATA}/dolt/home
      - ${TRADE_DATA}/dolt/paper:${TRADE_DATA}/dolt/paper
      - ${TRADE_DATA}/paper-tmp:${TRADE_DATA}/paper-tmp
      - ${TRADE_DATA}/market:${TRADE_DATA}/market:ro
    networks: [default, docker-api]
    depends_on:
      ledger:
        condition: service_healthy
      docker-api:
        condition: service_started

  # The only way to Docker, for paper: exactly its calls, and of containers only those runtime/container.py builds
  # (docker-api/check.go). The mount roots are the two directories paper's containers mount from; it sees them
  # at their own paths, read-only, to resolve a mount's symlinks.
  docker-api:
    image: ghcr.io/qoeop/trade-docker-api@sha256:e1a6a64859b769596b1059579a0cb6c1940a181c36d4a18296e2a83a67a5d358  # moved only by a pull request (README.md here, Updating)
    user: "0:0"  # the engine's socket is root's; the image has no user names
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]  # to resolve paths through TRADE_UID's private temporary directories
    security_opt: ["no-new-privileges:true"]
    command:
      - --image=ghcr.io/qoeop/trade-runtime
      - --user=${TRADE_UID}:${TRADE_GID}
      - --mount-root=${TRADE_DATA}/dolt/paper
      - --mount-root=${TRADE_DATA}/paper-tmp
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${TRADE_DATA}/dolt/paper:${TRADE_DATA}/dolt/paper:ro
      - ${TRADE_DATA}/paper-tmp:${TRADE_DATA}/paper-tmp:ro
    networks: [docker-api]
    restart: unless-stopped
    logging: *logging

networks:
  docker-api:
    internal: true

# The IDE's read-only ledger profile (kind null: never publishes) and the one market profile of the IDE, market-import
# and paper. The readers' mounts are read-only.
configs:
  ide-research:
    content: |
      {"name": "research", "kind": null, "database": "research",
       "service": "/run/trade/ledger-readers"}
  market:
    content: |
      {"name": "market", "kind": "market", "root": "${TRADE_DATA}/market"}

volumes:
  trade-ide-agent:
  trade-dolt-data:
  trade-ledger-readers:
  trade-market-import:
