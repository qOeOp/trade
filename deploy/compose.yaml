# The whole deployment, the same on a workstation and a server whose Docker engine is linux/arm64 (the images
# are built for arm64 only: .github/workflows/ide-image.yml, Dockerfile): docker compose -f deploy/compose.yaml
# up -d, then open http://127.0.0.1:8765/. Update with `docker compose pull && docker compose up -d`.
# .env beside this file names TRADE_UID, TRADE_GID and TRADE_DATA (README.md here); the host
# directories are mounted at their own paths, since service.json, the profiles, backups and run
# directories name them (docs/plans/paper-compose-deployment.zh.md §4.3, ledger-compose-service.zh.md §4.2).
name: trade-ide

x-product: &product
  image: ghcr.io/qoeop/trade-service:main
  init: true
  user: "${TRADE_UID:?set TRADE_UID in .env}:${TRADE_GID:?set TRADE_GID in .env}"
  restart: unless-stopped

services:
  # The page and the chat service. They read ledger with the reader accounts only: the profiles below
  # name the reader-only service file ledger writes into trade-ledger-readers, never service.json.
  ide:
    image: ghcr.io/qoeop/trade-ide:main
    init: true
    ports:
      - "127.0.0.1:${TRADE_IDE_PORT:-8765}:8765"
    environment:
      TRADE_DOLT_HOST: ledger
      PUBLISHED_PORT: ${TRADE_IDE_PORT:-8765}  # the page's allowed Host names this port
    configs:
      - source: ide-research
        target: /run/trade/ledgers/research.json
      - source: ide-market
        target: /run/trade/ledgers/market.json
    volumes:
      # The chat service's agents (with their API keys) and threads.
      - trade-ide-agent:/data/agent
      - trade-ledger-readers:/run/trade/ledger-readers:ro
    restart: unless-stopped
    command: ["--paper=http://paper:8767"]
    depends_on:
      ledger:
        condition: service_healthy

  # The Dolt service of the ledger and the market. On first start it bootstraps from the public
  # copies (the market is about 17 GB), so `up -d` waits until it is healthy before starting paper.
  ledger:
    <<: *product
    command:
      - python
      - -m
      - cli.main
      - ledger
      - service
      - run
      - --service-root=${TRADE_DATA:?set TRADE_DATA in .env}/dolt
      - --data-dir=/var/lib/trade-dolt
      - --backup-root=${TRADE_DATA}/dolt-backups
      - --credentials=/run/dolthub/.dolt
      - --research-origin=${TRADE_RESEARCH_ORIGIN:-https://doltremoteapi.dolthub.com/vincent/trade-research}
      - --market-origin=${TRADE_MARKET_ORIGIN:-https://doltremoteapi.dolthub.com/vincent/trade-market}
      - --port=${TRADE_LEDGER_PORT:-13330}
      - --readers=/var/lib/trade-readers
    environment:
      TRADE_LEDGER_HOME: ${TRADE_DATA}/ledgers
      HOME: /tmp
    ports:
      - "127.0.0.1:${TRADE_LEDGER_PORT:-13330}:${TRADE_LEDGER_PORT:-13330}"
    volumes:
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt
      - ${TRADE_DATA}/ledgers:${TRADE_DATA}/ledgers
      - ${TRADE_DATA}/dolt-backups:${TRADE_DATA}/dolt-backups
      - trade-dolt-data:/var/lib/trade-dolt
      # The reader-only service.json, written at every start, for containers that only read.
      - trade-ledger-readers:/var/lib/trade-readers
      # The DoltHub key (a `dolt login` ~/.dolt): needed to bootstrap and to publish; nothing else sees it.
      - ${TRADE_DOLTHUB:-${TRADE_DATA}/dolthub}:/run/dolthub/.dolt:ro
    healthcheck:
      test: ["CMD", "python", "-m", "cli.main", "ledger", "service", "check"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 6h
      start_interval: 10s

  # Replay inputs over HTTP (market/README.md, "Remote supply for replay inputs"): a client whose market
  # profile names remote_url receives the native files of its pinned commit, contracts and window, never
  # the database. Loopback only: it has no authentication.
  market-supply:
    <<: *product
    command: ["python", "-m", "market.remote", "--market", "/run/trade/market-source.json", "--bind", "0.0.0.0",
              "--port", "8210"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TRADE_DOLT_HOST: ledger
    ports:
      - "127.0.0.1:${TRADE_MARKET_SUPPLY_PORT:-8210}:8210"
    configs:
      - source: market-source
        target: /run/trade/market-source.json
    volumes:
      # service.json (the reader's account), as paper reads it; the DoltHub key beneath is covered.
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt:ro
      - type: tmpfs
        target: ${TRADE_DATA}/dolt/home
      # Its exports, on a volume rather than a host directory: macOS bind mounts refuse the chmod of
      # multiprocessing's forkserver socket. They are never removed (market/README.md).
      - trade-market-exports:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "from market.remote import RemoteMarket; RemoteMarket({'database': 'market', 'remote_url': 'http://127.0.0.1:8210'}).resolve_commit('main')"]
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      ledger:
        condition: service_healthy

  # The daily import of Binance metrics (market/README.md, "follow-metrics"): each round imports the days
  # the archive has published since the held ones and publishes the market. Unhealthy while a contract is
  # stopped or lagging, or when its status is a day old (docs/plans/daily-metrics-import.zh.md).
  metrics-import:
    <<: *product
    command: ["python", "-m", "cli.main", "market", "follow-metrics", "--market", "/run/trade/market-import.json",
              "--symbols", "BTCUSDT", "ETHUSDT", "SOLUSDT"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TRADE_DOLT_HOST: ledger
    configs:
      - source: market-import
        target: /run/trade/market-import.json
    volumes:
      # service.json (the import and admin accounts); the DoltHub key beneath is covered, since ledger pushes.
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt:ro
      - type: tmpfs
        target: ${TRADE_DATA}/dolt/home
      # The archive cache and the status file, on a volume as for market-supply: a new volume mounted
      # elsewhere belongs to root, which TRADE_UID cannot write.
      - trade-metrics-import:/tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "from market.follow import check; raise SystemExit(check())"]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 30m
      start_interval: 30s
    depends_on:
      ledger:
        condition: service_healthy

  # The paper daemon: the Paper panel's runs. Reached only by ide on the project network; reaches
  # Docker only through docker-api. Its market (paper-market) reads membership and stored bars from
  # ledger, and a reconciliation's replay inputs from market-supply.
  paper:
    <<: *product
    command: ["python", "-m", "cli.main", "paper", "serve", "--host", "0.0.0.0", "--allow-host", "paper:8767",
              "--market", "/run/trade/paper-market.json"]
    configs:
      - source: paper-market
        target: /run/trade/paper-market.json
    environment:
      TRADE_DOLT_HOST: ledger
      DOCKER_HOST: tcp://docker-api:2375
      TRADE_LEDGER_HOME: ${TRADE_DATA}/ledgers
      TMPDIR: ${TRADE_DATA}/paper-tmp
      HOME: ${TRADE_DATA}/paper-tmp
    volumes:
      - ${TRADE_DATA}/ledgers:${TRADE_DATA}/ledgers:ro
      # The service directory read-only, for service.json (its accounts): compose creates this container
      # before ledger has written the file, so the directory, not the file. Its home/ (the DoltHub key)
      # is covered; the run directory beneath is writable.
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt:ro
      - type: tmpfs
        target: ${TRADE_DATA}/dolt/home
      - ${TRADE_DATA}/dolt/paper:${TRADE_DATA}/dolt/paper
      - ${TRADE_DATA}/paper-tmp:${TRADE_DATA}/paper-tmp
    networks: [default, docker-api]
    depends_on:
      ledger:
        condition: service_healthy
      docker-api:
        condition: service_started

  docker-api:
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    user: root  # the engine's socket is root's
    read_only: true
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./docker-api.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [docker-api]
    restart: unless-stopped

networks:
  docker-api:
    internal: true

# The IDE's two read-only profiles (kind null: never publishes), and the market profiles of market-supply
# (only the database: a supply serves a local reader), metrics-import and paper (also the supply and its
# own cache).
configs:
  ide-research:
    content: |
      {"name": "research", "holds": "research", "kind": null, "database": "research",
       "service": "/run/trade/ledger-readers", "research_branch": "main"}
  ide-market:
    content: |
      {"name": "market", "kind": "market", "database": "market", "service": "/run/trade/ledger-readers"}
  market-source:
    content: |
      {"name": "market", "kind": "market", "database": "market", "service": "${TRADE_DATA}/dolt"}
  # metrics-import's profile: role active, since publishing the market needs it (ledger/publish.py).
  market-import:
    content: |
      {"name": "market", "kind": "market", "role": "active", "database": "market", "service": "${TRADE_DATA}/dolt"}
  paper-market:
    content: |
      {"name": "market", "kind": "market", "database": "market", "service": "${TRADE_DATA}/dolt",
       "remote_url": "http://market-supply:8210", "cache_root": "${TRADE_DATA}/paper-tmp/market-client-cache"}

volumes:
  trade-ide-agent:
  trade-dolt-data:
  trade-ledger-readers:
  trade-market-exports:
  trade-metrics-import:
