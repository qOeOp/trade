# The compose project's Docker API proxy (the docker-api service): the only way to Docker, for the paper
# daemon and the commands it runs. It allows exactly the calls they make, by method and path
# (docs/plans/paper-compose-deployment.zh.md §4.2), and refuses every other one: no exec, volumes, build,
# system, swarm or plugins. A reconcile replay attaches for up to 3600 s (paper/serve.py), so the
# timeouts are longer than that. The proxy sees no request body: a container it lets be created can
# still mount any host path (the residual risk the design names).
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout http-request 30s
    timeout client 3700s
    timeout server 3700s
    timeout tunnel 3700s

frontend docker
    bind :2375
    acl read method GET HEAD
    acl post method POST
    acl delete method DELETE
    # Every docker command first pings and may ask the version.
    http-request allow if read { path,url_dec -m reg ^(/v[0-9.]+)?/(_ping|version)$ }
    # Containers: ps, inspect, logs; run (create, attach, start, wait); stop, kill; rm.
    http-request allow if read { path,url_dec -m reg ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if read { path,url_dec -m reg ^(/v[0-9.]+)?/containers/[^/]+/(json|logs)$ }
    http-request allow if post { path,url_dec -m reg ^(/v[0-9.]+)?/containers/create$ }
    http-request allow if post { path,url_dec -m reg ^(/v[0-9.]+)?/containers/[^/]+/(attach|start|wait|stop|kill)$ }
    http-request allow if delete { path,url_dec -m reg ^(/v[0-9.]+)?/containers/[^/]+$ }
    # Networks: inspect, create, connect, rm.
    http-request allow if read { path,url_dec -m reg ^(/v[0-9.]+)?/networks(/[^/]+)?$ }
    http-request allow if post { path,url_dec -m reg ^(/v[0-9.]+)?/networks/(create|[^/]+/connect)$ }
    http-request allow if delete { path,url_dec -m reg ^(/v[0-9.]+)?/networks/[^/]+$ }
    # Images: pull, inspect (a reference holds slashes, a colon and an @).
    http-request allow if post { path,url_dec -m reg ^(/v[0-9.]+)?/images/create$ }
    http-request allow if read { path,url_dec -m reg ^(/v[0-9.]+)?/images/.+/json$ }
    http-request deny
    default_backend engine

backend engine
    server engine /var/run/docker.sock
