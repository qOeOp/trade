# GitHub user restrictions are required by compose. An email domain alone is not authorization.
provider = "github"
http_address = "0.0.0.0:4180"
upstreams = ["http://ide:8765/"]
reverse_proxy = true
pass_host_header = true
email_domains = ["*"]
scope = "user:email"
skip_provider_button = true
api_routes = ["^/api(?:/|$)"]
cookie_name = "__Host-trade_session"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "15m"
cookie_csrf_per_request = true
upstream_timeout = "0s"
flush_interval = "100ms"
pass_basic_auth = false
pass_user_headers = false
pass_access_token = false
request_logging = false
