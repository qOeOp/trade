# Overlay for the reviewed pull-based Web release plane. Each version's control reads it from its own service image
# (deploy/release_host.py DockerHost.definition) and runs compose only to move the ledger mirror and market-import to
# that version's service image and docker-api to its pin (README.md, Ledger mirror and market import).
services:
  ide-router:
    image: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    networks: [frontend]
    command: [caddy, run, --config, /etc/caddy/release/active.json]
    volumes:
      - /var/lib/trade-release/router:/etc/caddy/release:ro
    tmpfs: [/config, /data]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
