# Overlay on ../compose.yaml; use --env-file remote/.env and both -f files (README.md).
# Never expose the unauthenticated IDE, ledger or Paper API on a public interface.
services:
  # The release plane runs the Web, its Agent and the Paper controller (install-release.sh); a whole-project
  # `up` must not start a second Agent writer or Paper controller beside them.
  ide:
    profiles: [workstation]
  ledger:
    ports: !reset []
    healthcheck:
      test: [CMD, python, -m, cli.main, ledger, service, check, --ledger, research]
    mem_limit: ${TRADE_LEDGER_MEMORY:-2g}
    memswap_limit: ${TRADE_LEDGER_MEMORY:-2g}
    command:
      - python
      - -m
      - cli.main
      - ledger
      - mirror
      - --service-root=${TRADE_DATA}/dolt
      - --data-dir=/var/lib/trade-dolt
      - --backup-root=${TRADE_DATA}/dolt-backups
      - --research-origin=${TRADE_RESEARCH_ORIGIN:?set the public DoltHub repository this host mirrors}
      - --port=${TRADE_LEDGER_PORT:-13330}
      - --readers=/var/lib/trade-readers
      - --controllers=/var/lib/trade-controllers
      - --http-host=0.0.0.0
      - --http-port=8769
      - --allow-host=ledger:8769
    volumes: !override
      - ${TRADE_DATA}/dolt:${TRADE_DATA}/dolt
      - ${TRADE_DATA}/ledgers:${TRADE_DATA}/ledgers
      - ${TRADE_DATA}/dolt-backups:${TRADE_DATA}/dolt-backups
      - trade-dolt-data:/var/lib/trade-dolt
      - trade-ledger-readers:/var/lib/trade-readers
      - trade-paper-controller:/var/lib/trade-controllers
  paper:
    profiles: [workstation]
  market-import:
    profiles: [local-research-import]
  oauth2:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    user: "${TRADE_UID:?set TRADE_UID}:${TRADE_GID:?set TRADE_GID}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    networks: [edge, frontend]
    command:
      - --config=/etc/oauth2-proxy.cfg
      - --client-secret-file=/run/secrets/github_client_secret
      - --cookie-secret-file=/run/secrets/oauth_cookie_secret
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${TRADE_GITHUB_CLIENT_ID:?set the GitHub OAuth client ID}
      OAUTH2_PROXY_GITHUB_USERS: ${TRADE_GITHUB_USERS:?set the allowed GitHub usernames}
      OAUTH2_PROXY_REDIRECT_URL: https://${TRADE_DOMAIN}/oauth2/callback
    configs:
      - source: remote-oauth
        target: /etc/oauth2-proxy.cfg
    secrets: [github_client_secret, oauth_cookie_secret]
    logging: &remote-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  edge:
    image: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    ports: ["80:80", "443:443"]
    networks: [edge]
    environment:
      TRADE_DOMAIN: ${TRADE_DOMAIN}
      TRADE_DOMAIN_ALIASES: ${TRADE_DOMAIN_ALIASES:-}
    configs:
      - source: remote-caddy
        target: /etc/caddy/Caddyfile
    volumes: [remote-caddy-data:/data, remote-caddy-config:/config]
    logging: *remote-logging
networks:
  edge: {}
  frontend:
    internal: true
configs:
  remote-oauth:
    file: ./remote/oauth2-proxy.cfg
  remote-caddy:
    file: ./remote/Caddyfile
secrets:
  github_client_secret:
    file: ${TRADE_GITHUB_CLIENT_SECRET_FILE:?set a private GitHub secret file path}
  oauth_cookie_secret:
    file: ${TRADE_OAUTH_COOKIE_SECRET_FILE:?set a private cookie secret file path}
volumes:
  trade-paper-controller: {}
  remote-caddy-data: {}
  remote-caddy-config: {}
